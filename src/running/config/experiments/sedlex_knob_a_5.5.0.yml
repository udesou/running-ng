# =============================================================================
# Knob-A olly pass — sedlex 3-rung input-size ladder, OCaml 5.5.0 (1 inv)
# =============================================================================
# gc%/pause + max_rss_kb_excl_ring for the settled sedlex rungs. Knob A = input
# SIZE (argv.1 = generated # lines); the driver retains the whole token list so
# RSS/live-heap grow ~linearly. Rungs live in base/ocaml/macro_base.yml
# (suite macro-sedlex, timeout 300):
#   sedlex_tokenize_small   2M   ~4.6s  2.8GB
#   sedlex_tokenize_default 6M   ~14s   8.5GB
#   sedlex_tokenize_large   20M  ~46s   28GB
# (huge band deferred.) re-25 ring is ample (~77k collections at large).
#
# Usage:
#   cd ~/running-ng
#   OLLY_DIR=~/runtime_events_tools RUNNING_MACRO_BENCH_DIR=~/macro-benches \
#   CONFIG_FILE=src/running/config/experiments/sedlex_knob_a_5.5.0.yml \
#   LOG_DIR=/tmp/claude-1001/-home-udesou/0be6b255-53c7-455c-805e-9ca3aee89314/scratchpad/sedlex_olly \
#     bash run_ocaml_bench_gc_sweep.sh
# =============================================================================

includes:
  - "../base/ocaml/macro_base.yml"

overrides:
  invocations: 1
  benchmarks:
    macro-sedlex:
      - sedlex_tokenize_small
      - sedlex_tokenize_default
      - sedlex_tokenize_large

runtimes:
  ocaml-5.5.0:
    type: OCaml
    version: "5.5.0"
    olly_ref: "main"

configs:
  - "ocaml-5.5.0|perf_grp1|re-25|md-2"
