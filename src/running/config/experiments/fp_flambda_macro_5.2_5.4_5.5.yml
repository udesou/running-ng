# =============================================================================
# FP × Flambda × {OCaml 5.2.1, 5.4.1, 5.5-beta (d8bb46c)} — macrobenchmarks
# =============================================================================
# 3 versions × 2 (frame-pointers on/off) × 2 (flambda on/off) = 12 variants.
#
# Versions:
#   - 5.2.1                (release)        — baseline for cross-version comp
#   - 5.4.1                (release)
#   - d8bb46c39bf5fcafb513a8ba18e667d3f8c2600a  — labelled "5.5-beta"
#
# Comparisons (7 blocks):
#   intra-version (3) — flag effects within each version
#   inter-version (4) — 5.2.1 baseline vs 5.4.1 + d8bb46c, per flag combo
#
# Benchmarks, suites, modifiers, plugins, and run settings are inherited from
# macrobenchmarks_base.yml.  Only runtimes / configs / comparisons live here.
#
# Prerequisite — opam switches:
#   The 5.2.1 switches must exist before this YAML can run. Create with
#   running-ng's opam-compiler integration, or manually:
#     opam compiler create 'running-ng-ocaml-5.2.1' '5.2.1'
#     opam compiler create 'running-ng-ocaml-5.2.1-fp' '5.2.1' \
#       --packages 'ocaml-option-fp'
#     opam compiler create 'running-ng-ocaml-5.2.1-flambda' '5.2.1' \
#       --packages 'ocaml-option-flambda'
#     opam compiler create 'running-ng-ocaml-5.2.1-fp-flambda' '5.2.1' \
#       --packages 'ocaml-option-fp,ocaml-option-flambda'
#   (The 5.4.1 and d8bb46c switches were already created for the 2-version
#   config — fp_flambda_macro_5.4.1_vs_d8bb46c.yml.)
#
# 5.2 compat caveats (will skip on 5.2 runtimes):
#   - liq_parse_typecheck — Liquidsoap-lang requires OCaml ≥ 5.3 (Jane Street
#     PPX dep). running-ng will skip / error this benchmark on 5.2; the rest
#     of the suite continues.
#   - eio_fiber_stream — Eio requires OCaml ≥ 5.2; should work on 5.2.1.
#
# Usage:
#   RUNNING_MACRO_BENCH_DIR=~/macro-benches \
#   CONFIG_FILE=src/running/config/fp_flambda_macro_5.2_5.4_5.5.yml \
#     bash run_ocaml_bench_gc_sweep.sh
#
# Estimated runtime: ~4–6 hours on obelisk for the full matrix.
# Best run inside a screen / tmux session.
# =============================================================================

plugins:
  zulip:
    type: Zulip
    request:
      type: private
      to: [361443]

includes:
  - "../base/ocaml/macro_base.yml"

# =============================================================================
# Runtimes — 12 variants
# =============================================================================
runtimes:
  # --- OCaml 5.2.1 ---
  ocaml-5.2.1:
    type: OCaml
    version: "5.2.1"
  ocaml-5.2.1-fp:
    type: OCaml
    version: "5.2.1"
    configure_args: ["--enable-frame-pointers"]
  ocaml-5.2.1-flambda:
    type: OCaml
    version: "5.2.1"
    configure_args: ["--enable-flambda"]
  ocaml-5.2.1-fp-flambda:
    type: OCaml
    version: "5.2.1"
    configure_args: ["--enable-frame-pointers", "--enable-flambda"]

  # --- OCaml 5.4.1 ---
  ocaml-5.4.1:
    type: OCaml
    version: "5.4.1"
  ocaml-5.4.1-fp:
    type: OCaml
    version: "5.4.1"
    configure_args: ["--enable-frame-pointers"]
  ocaml-5.4.1-flambda:
    type: OCaml
    version: "5.4.1"
    configure_args: ["--enable-flambda"]
  ocaml-5.4.1-fp-flambda:
    type: OCaml
    version: "5.4.1"
    configure_args: ["--enable-frame-pointers", "--enable-flambda"]

  # --- ocaml/ocaml commit d8bb46c (labelled 5.5-beta) ---
  ocaml-d8bb46c:
    type: OCaml
    commit: "d8bb46c39bf5fcafb513a8ba18e667d3f8c2600a"
  ocaml-d8bb46c-fp:
    type: OCaml
    commit: "d8bb46c39bf5fcafb513a8ba18e667d3f8c2600a"
    configure_args: ["--enable-frame-pointers"]
  ocaml-d8bb46c-flambda:
    type: OCaml
    commit: "d8bb46c39bf5fcafb513a8ba18e667d3f8c2600a"
    configure_args: ["--enable-flambda"]
  ocaml-d8bb46c-fp-flambda:
    type: OCaml
    commit: "d8bb46c39bf5fcafb513a8ba18e667d3f8c2600a"
    configure_args: ["--enable-frame-pointers", "--enable-flambda"]

# =============================================================================
# Configs — 12 runtimes × default GC params, re-25 ring (32 MB)
# =============================================================================
configs:
  # 5.2.1
  - "ocaml-5.2.1|perf_grp1|re-25|md-2"
  - "ocaml-5.2.1-fp|perf_grp1|re-25|md-2"
  - "ocaml-5.2.1-flambda|perf_grp1|re-25|md-2"
  - "ocaml-5.2.1-fp-flambda|perf_grp1|re-25|md-2"
  # 5.4.1
  - "ocaml-5.4.1|perf_grp1|re-25|md-2"
  - "ocaml-5.4.1-fp|perf_grp1|re-25|md-2"
  - "ocaml-5.4.1-flambda|perf_grp1|re-25|md-2"
  - "ocaml-5.4.1-fp-flambda|perf_grp1|re-25|md-2"
  # 5.5-beta (d8bb46c)
  - "ocaml-d8bb46c|perf_grp1|re-25|md-2"
  - "ocaml-d8bb46c-fp|perf_grp1|re-25|md-2"
  - "ocaml-d8bb46c-flambda|perf_grp1|re-25|md-2"
  - "ocaml-d8bb46c-fp-flambda|perf_grp1|re-25|md-2"

# =============================================================================
# Comparisons — 7 blocks
#
#   Intra-version (3 blocks): how does each compiler flag combo change
#   wall-time / RSS / GC behaviour relative to the version's vanilla
#   baseline?
#
#   Inter-version (4 blocks): with 5.2.1 fixed as the baseline, how do
#   5.4.1 and 5.5-beta compare? Pairwise with scalar broadcasting:
#   `a: ocaml-5.2.1-X` (scalar) and `b: [ocaml-5.4.1-X, ocaml-d8bb46c-X]`
#   gives 2 pairs in one block — both sharing the 5.2.1-X baseline.
# =============================================================================
comparisons:
  # ---- Intra-version (flag effects) ----

  - label: "5.2.1 flag effects"
    a: ocaml-5.2.1
    b: [ocaml-5.2.1-fp, ocaml-5.2.1-flambda, ocaml-5.2.1-fp-flambda]

  - label: "5.4.1 flag effects"
    a: ocaml-5.4.1
    b: [ocaml-5.4.1-fp, ocaml-5.4.1-flambda, ocaml-5.4.1-fp-flambda]

  - label: "5.5-beta (d8bb46c) flag effects"
    a: ocaml-d8bb46c
    b: [ocaml-d8bb46c-fp, ocaml-d8bb46c-flambda, ocaml-d8bb46c-fp-flambda]

  # ---- Inter-version (5.2.1 baseline → 5.4.1 + 5.5-beta), per flag combo ----

  - label: "version effect: baseline (5.2.1 → 5.4.1, 5.5-beta)"
    a: ocaml-5.2.1
    b: [ocaml-5.4.1, ocaml-d8bb46c]

  - label: "version effect: -fp (5.2.1 → 5.4.1, 5.5-beta)"
    a: ocaml-5.2.1-fp
    b: [ocaml-5.4.1-fp, ocaml-d8bb46c-fp]

  - label: "version effect: -flambda (5.2.1 → 5.4.1, 5.5-beta)"
    a: ocaml-5.2.1-flambda
    b: [ocaml-5.4.1-flambda, ocaml-d8bb46c-flambda]

  - label: "version effect: -fp-flambda (5.2.1 → 5.4.1, 5.5-beta)"
    a: ocaml-5.2.1-fp-flambda
    b: [ocaml-5.4.1-fp-flambda, ocaml-d8bb46c-fp-flambda]
