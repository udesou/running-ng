# SMOKE: 1 iteration, ALL active macrobenchmarks (macro_base full set; merlin +
# lavyek stay disabled), new version cbc66e3. Purpose: confirm every bench
# BUILDS and RUNS under LXR + Bactrian + stock 5.5.0-rc1 before the real 5-iter
# run. Native contract emission comes from macro_base's schema_version.
includes:
  - "../base/ocaml/macro_base.yml"

# Full set inherited from macro_base (no benchmarks override). invocations via
# overrides (macro_base defines it as a top-level scalar, as it does
# schema_version — redeclaring either at top level is a combine() TypeError).
overrides:
  invocations: 1

maxheap: 8192
attempts: 2


runtimes:
  ocaml-mmtk-cbc66e3:
    type: OCamlMMTk
    repo: "https://github.com/fplaunchpad/ocaml-mmtk.git"
    commit: "cbc66e3efd8f9200f3e84f791a6b6dfc36efce8c"
  ocaml-5.5.0-rc1:
    type: OCaml
    commit: "4090d6db952ecae1cd0c3493c16d89cacc2bf8c6"

configs:
  - "ocaml-mmtk-cbc66e3|time_stats|plan-LXR"
  - "ocaml-mmtk-cbc66e3|time_stats|plan-Bactrian"
  - "ocaml-5.5.0-rc1|time_stats"
