# MMTk plan sweep on commit cbc66e3, over the 27 benches that run cleanly.
# Plans: GenImmix, Immix, Bactrian (RQ7: generational + concurrent), LXR
# (reference counting), vs stock 5.5.0-rc1. Dynamic heap, default GC threads,
# best-of-3. Excludes pplacer (SIGABRT) + sedlex_tokenize / devkit_htmlstream /
# liq_video_frames_pool (hang) so the run can't orphan hung children.
#
#   RUNNING_MACRO_BENCH_DIR=~/macro-benches \
#   CONFIG_FILE=src/running/config/experiments/mmtk_plan_sweep.yml \
#   LOG_DIR=/tmp/mmtk_plan_sweep bash run_ocaml_bench_gc_sweep.sh
includes:
  - "../base/ocaml/macro_base.yml"

overrides:
  invocations: 3
  benchmarks:
    macro-menhir-monorepo: [menhir_ocamly, menhir_sql_parser, menhir_sysver]
    macro-cpdf-monorepo: [cpdf_blacktext, cpdf_merge, cpdf_scale, cpdf_squeeze]
    macro-alt-ergo-monorepo: [alt_ergo_fill, alt_ergo_yyll, alt_ergo_unsat_smt2]
    macro-frama-c-monorepo: [frama_c_eva_t, frama_c_eva_sqlite]
    macro-goblint-monorepo: [goblint]
    macro-coq-monorepo: [coqc_corelib_stress]
    macro-devkit: [devkit_stre, devkit_network, devkit_gzip]
    macro-irmin: [irmin_mem_rw]
    macro-ocamlformat: [ocamlformat_rocq]
    macro-decompress: [test_decompress]
    macro-eio: [eio_fiber_stream]
    macro-yojson: [ydump_repeat]
    macro-zarith: [zarith_pi]
    macro-owl: [owl_gc]
    macro-ocamlc-self-compile: [ocamlc_self_compile]
    macro-liquidsoap-lang: [liq_parse_typecheck]
    macro-jsoo: [jsoo]

maxheap: 8192
attempts: 2


runtimes:
  ocaml-mmtk-cbc66e3:
    type: OCamlMMTk
    repo: "https://github.com/fplaunchpad/ocaml-mmtk.git"
    commit: "cbc66e3efd8f9200f3e84f791a6b6dfc36efce8c"
  ocaml-5.5.0-rc1:
    type: OCaml
    commit: "4090d6db952ecae1cd0c3493c16d89cacc2bf8c6"

configs:
  - "ocaml-mmtk-cbc66e3|time_stats|plan-GenImmix"
  - "ocaml-mmtk-cbc66e3|time_stats|plan-Immix"
  - "ocaml-mmtk-cbc66e3|time_stats|plan-Bactrian"
  - "ocaml-mmtk-cbc66e3|time_stats|plan-LXR"
  - "ocaml-5.5.0-rc1|time_stats"
