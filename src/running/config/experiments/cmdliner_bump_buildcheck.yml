# Build-check across 4 runtimes after bumping duniverse cmdliner to v2.1.1.
# Validates that (a) jsoo now builds, (b) no other benches regress.
#
# Usage:
#   cd ~/running-ng
#   export OLLY_DIR=~/runtime_events_tools
#   export RUNNING_MACRO_BENCH_DIR=~/macro-benches
#   eval $(opam env --switch=running-ng-tools --set-switch)
#   PYTHONPATH=src python3 -m running buildbms \
#     src/running/config/experiments/cmdliner_bump_buildcheck.yml

includes:
  - "../base/ocaml/macro_base.yml"

overrides:
  invocations: 1
  benchmarks.macro-lavyek-monorepo: []

runtimes:
  ocaml-trunk-cfb30145:
    type: OCaml
    commit: "cfb30145d9e6bbf99c15e875604d5d5fd320589e"
    olly_ref: "main"

  ocaml-gc-pacing:
    type: OCaml
    repo: "https://github.com/udesou/ocaml.git"
    commit: "gc-pacing-new+stdlib-events"
    olly_ref: "gc-pacing-compat"

  ocaml-5.4.1:
    type: OCaml
    version: "5.4.1"
    olly_ref: "main"

  ocaml-d8bb46c:
    type: OCaml
    commit: "d8bb46c39bf5fcafb513a8ba18e667d3f8c2600a"
    olly_ref: "main"

configs:
  - "ocaml-trunk-cfb30145|perf_grp1|re-25|md-2|re_par-22|md_par-8|pin_lavyek"
  - "ocaml-gc-pacing|perf_grp1|re-25|md-2|re_par-22|md_par-8|pin_lavyek"
  - "ocaml-5.4.1|perf_grp1|re-25|md-2|re_par-22|md_par-8|pin_lavyek"
  - "ocaml-d8bb46c|perf_grp1|re-25|md-2|re_par-22|md_par-8|pin_lavyek"
