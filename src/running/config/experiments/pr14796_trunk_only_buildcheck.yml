# =============================================================================
# Build-check: trunk-cfb30145 only, no gc-pacing
# =============================================================================
# Validates that the macro-benches monorepo builds cleanly against the PR
# merge-base (cfb30145, post 2026-05-22 rebase) with dune 3.23.1 —
# separating "does trunk build?" from "does gc-pacing build?".
#
# Usage:
#   cd ~/running-ng
#   export OLLY_DIR=~/runtime_events_tools
#   export RUNNING_MACRO_BENCH_DIR=~/macro-benches
#   eval $(opam env --switch=running-ng-tools --set-switch)
#   PYTHONPATH=src python3 -m running buildbms \
#     src/running/config/experiments/pr14796_trunk_only_buildcheck.yml
# =============================================================================

includes:
  - "../base/ocaml/macro_base.yml"

overrides:
  invocations: 1
  benchmarks.macro-lavyek-monorepo: []

runtimes:
  ocaml-trunk-cfb30145:
    type: OCaml
    commit: "cfb30145d9e6bbf99c15e875604d5d5fd320589e"
    olly_ref: "main"

configs:
  - "ocaml-trunk-cfb30145|perf_grp1|re-25|md-2|re_par-22|md_par-8|pin_lavyek"
