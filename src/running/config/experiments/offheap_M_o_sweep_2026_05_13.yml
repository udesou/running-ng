# =============================================================================
# Off-heap (M, o) parameter sweep — 5.4.1 vs d8bb46c (5.5-beta)
# 2026-05-13: wider M/o grid, focused on the liq_video_frames_pool variant
# =============================================================================
# Targets the 8 macrobenchmarks whose allocation pattern involves off-heap /
# custom-block allocators (Bigarray, Z.t, ffmpeg-style refcounted pools):
#
#   alt_ergo_fill           (zarith Z.t custom blocks)
#   cpdf_merge              (camlpdf Bigarray streams)
#   cpdf_scale              (camlpdf Bigarray streams)
#   cpdf_squeeze            (camlpdf Bigarray streams)
#   liq_video_frames_pool   (POOL=1, TOUCH=full    — refcounted-pool, #14533)
#   owl_gc                  (Bigarray-backed ndarray + finalisers)
#   pplacer_testsuite       (gsl + Bigarray matrices)
#   zarith_pi               (zarith Z.t custom blocks)
#
# Sweep grid (per user spec, 2026-05-13):
#   M ∈ {11, 22, 44, 100, 250}                      (1/4× → 5.7× default)
#   o ∈ {40, 80, 120, 150, 200}                     (1/3× → 1.67× default)
#   → 5 × 5 = 25 cells per (bench, runtime)
#
# Runtimes: 5.4.1 baseline + d8bb46c, no fp/flambda flag combos.
#
# Total invocations: 25 × 2 × 8 × 3 = 1200.
#
# Why this design (vs 5-11):
#   - The 5-11 (M, o) sweep used the default `liq_video_frames` wrapper, which
#     was POOL=0+TOUCH=full. The refcounted-pool variant (_pool, POOL=1) is
#     the toots/ocaml#14533 reproducer and was NOT swept. _pool is the only
#     variant we still carry — #14533 predicts that at large M it should show
#     CPU drop with no RSS cost.
#   - Wider o range (down to 40) extends the 5-11 coverage and gives the
#     zarith_pi `o`-only story room to settle.
#   - Coarser M (5 points vs 7) but reaches the same M=250 endpoint.
#
# OCaml runtime param defaults (verified in d8bb46c runtime/caml/config.h):
#   s = 262144  (Minor_heap_def)        — fixed at default
#   o = 120     (Percent_free_def)      — sweep
#   M = 44      (Custom_major_ratio_def) — sweep
#   m = 100     (Custom_minor_ratio_def) — fixed at default
#
# Usage:
#   RUNNING_MACRO_BENCH_DIR=~/macro-benches \
#   CONFIG_FILE=src/running/config/experiments/offheap_M_o_sweep_2026_05_13.yml \
#   LOG_DIR=$PWD/gc-sweep-logs-offheap-M-o-2026-05-13 \
#     bash run_ocaml_bench_gc_sweep.sh
# =============================================================================

includes:
  - "../base/ocaml/macro_base.yml"

plugins:
  zulip:
    type: Zulip
    request:
      type: private
      to: [361443]

overrides:
  invocations: 3
  benchmarks:
    macro-menhir-monorepo:     []
    macro-cpdf-monorepo:       [cpdf_merge, cpdf_scale, cpdf_squeeze]
    macro-alt-ergo-monorepo:   [alt_ergo_fill]
    macro-coq-monorepo:        []
    macro-devkit:              []
    macro-irmin:               []
    macro-ocamlformat:         []
    macro-decompress:          []
    macro-eio:                 []
    macro-sedlex:              []
    macro-yojson:              []
    macro-zarith:              [zarith_pi]
    macro-owl:                 [owl_gc]
    macro-ocamlc-self-compile: []
    macro-liquidsoap-lang:     []
    macro-merlin:              []
    macro-jsoo:                []
    macro-liq-video-frames:    [liq_video_frames_pool]
    macro-pplacer:             [pplacer_testsuite]
    macro-lavyek-monorepo:     []

# =============================================================================
# Runtimes — 5.4.1 baseline + d8bb46c, no flag combos
# =============================================================================
runtimes:
  ocaml-5.4.1:
    type: OCaml
    version: "5.4.1"
  ocaml-d8bb46c:
    type: OCaml
    commit: "d8bb46c39bf5fcafb513a8ba18e667d3f8c2600a"

# =============================================================================
# Modifiers — M and o swept; s and m left at default
# =============================================================================
modifiers:
  M:
    type: OCamlRunParam
    val: "M={0}"
  o:
    type: OCamlRunParam
    val: "o={0}"

# =============================================================================
# Configs — base config strings; config_sweep below cross-products (M, o)
# =============================================================================
configs:
  - "ocaml-5.4.1|perf_grp1|re-25|md-2"
  - "ocaml-d8bb46c|perf_grp1|re-25|md-2"

config_sweep:
  M: [11, 22, 44, 100, 250]
  o: [40, 80, 120, 150, 200]

# =============================================================================
# Comparisons — version effect at each (M, o) cell
# =============================================================================
comparisons:
  - label: "version effect (M, o) sweep — wide grid 2026-05-13"
    a: ocaml-5.4.1
    b: ocaml-d8bb46c
