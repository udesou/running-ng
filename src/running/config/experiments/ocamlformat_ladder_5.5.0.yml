# =============================================================================
# olly pass — ocamlformat 3-rung source-size ladder, OCaml 5.5.0 (1 inv)
# =============================================================================
# gc%/pause + max_rss_kb_excl_ring for the settled ocamlformat rungs. Size axis =
# source SIZE (# lines): rung inputs wl_{12,30,150}x.ml are generated by
# ocamlformat.build.sh (N-times concat of workload.ml) and gitignored.
# Rungs live in base/ocaml/macro_base.yml (suite macro-ocamlformat, timeout 600):
#   ocamlformat_rocq_small   12x  ~5s   0.6GB
#   ocamlformat_rocq_default 30x  ~13s  1.7GB
#   ocamlformat_rocq_large   150x ~90s  8.8GB
# (huge band deferred.) ocamlformat holds the whole AST + output doc in memory,
# so RSS/live-heap grow with N; promotion is a steady ~10%. re-25 ring is ample
# (~100k collections at large << ring).
#
# Usage:
#   cd ~/running-ng
#   OLLY_DIR=~/runtime_events_tools \
#   RUNNING_MACRO_BENCH_DIR=~/macro-benches \
#   CONFIG_FILE=src/running/config/experiments/ocamlformat_knob_a_5.5.0.yml \
#   LOG_DIR=/tmp/claude-1001/-home-udesou/0be6b255-53c7-455c-805e-9ca3aee89314/scratchpad/off_olly \
#     bash run_ocaml_bench_gc_sweep.sh
# =============================================================================

includes:
  - "../base/ocaml/macro_base.yml"

overrides:
  invocations: 1
  benchmarks:
    macro-ocamlformat:
      - ocamlformat_rocq_small
      - ocamlformat_rocq_default
      - ocamlformat_rocq_large

runtimes:
  ocaml-5.5.0:
    type: OCaml
    version: "5.5.0"
    olly_ref: "main"

configs:
  - "ocaml-5.5.0|perf_grp1|re-25|md-2"
