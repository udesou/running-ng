# Rerun of the 35 micro benchmarks whose data from the 2026-08-28 run was missing
# (29 crashed with "failed to allocate domain", 6 ran sub-second); the fixes are
# per-benchmark ocamlrunparam/args in micro_base.yml. Same runtimes and configs as
# micro_5.5.0_fp_flambda.yml so contract config_ids merge. Includes micro_base.yml.
# Run: RUNNING_BENCH_DIR=~/benches RUNNING_REUSE_SWITCHES=1 CONFIG_FILE=<this file> bash run_ocaml_bench_gc_sweep.sh

includes:
  - "../base/ocaml/micro_base.yml"

schema_version: "1.0"
remote_host: null
compress_logs: false
minheap_multiplier: 1.0
heap_range: 6
spread_factor: 1

plugins:
  zulip:
    type: Zulip
    request:
      type: private
      to: [361443]

overrides:
  invocations: 5
  benchmarks:
    sandmark-sequential:
      - weak_htbl
    sandmark-with-packages:
      - test_sched
    multicore-effects:
      - algorithmic_differentiation
      - effect_throughput_val
      - rec_seq_evenodd
    multicore-structures:
      - test_queue_parallel
      - test_stack_parallel
      - test_spsc_queue_sequential
      - test_spsc_queue_parallel
      - test_spsc_queue_pingpong_parallel
    multicore-numerical:
      - nbody_multicore
      - floyd_warshall_multicore
      - game_of_life_multicore
      - binarytrees5_multicore
      - spectralnorm2_multicore
      - fannkuchredux_multicore
      - quicksort_multicore
      - mergesort_multicore
      - matrix_multiplication_multicore
      - matrix_multiplication_tiling_multicore
      - LU_decomposition_multicore
      - nqueens_multicore
      - evolutionary_algorithm_multicore
    multicore-grammatrix:
      - grammatrix_multicore
    multicore-minilight:
      - minilight_multicore
    graph500par:
      - kernel1_run_multicore
    mpl:
      - primes
      - msort_ints
      - msort_strings
      - tokens
      - raytracer
    multicore-simple-tests:
      - alloc_multicore
      - pingpong_multicore
    multicore-gcroots:
      - globroots_mp
      - globroots_sp

runtimes:
  ocaml-5.5.0:
    type: OCaml
    version: "5.5.0"

  ocaml-5.5.0-fp:
    type: OCaml
    version: "5.5.0"
    configure_args: ["--enable-frame-pointers"]

  ocaml-5.5.0-flambda:
    type: OCaml
    version: "5.5.0"
    configure_args: ["--enable-flambda"]

  ocaml-5.5.0-fp-flambda:
    type: OCaml
    version: "5.5.0"
    configure_args: ["--enable-frame-pointers", "--enable-flambda"]

# Must stay identical to micro_5.5.0_fp_flambda.yml so config_ids match for the merge.
configs:
  - "ocaml-5.5.0|perf_grp1|re-25|md-2"
  - "ocaml-5.5.0-fp|perf_grp1|re-25|md-2"
  - "ocaml-5.5.0-flambda|perf_grp1|re-25|md-2"
  - "ocaml-5.5.0-fp-flambda|perf_grp1|re-25|md-2"

comparisons:
  - label: "5.5.0 micro: fp+flambda vs stock"
    a: ocaml-5.5.0
    b: [ocaml-5.5.0-fp, ocaml-5.5.0-flambda, ocaml-5.5.0-fp-flambda]
