# =============================================================================
# Rerun of the 35 micro benchmarks broken in monolith-2026-08-28-Fri-025606
# =============================================================================
# Companion to micro_5.5.0_fp_flambda.yml (same runtimes, configs, invocations,
# comparisons) narrowed to the benchmarks whose data from that run is missing
# or invalid, after the fixes in micro_base.yml:
#
#   - 29 parallel benchmarks crashed every invocation with
#     Failure("failed to allocate domain: domain_create"): the config-string
#     `md-2` (OCAMLRUNPARAM d=2) capped max_domains below what they spawn
#     (3-5). Each now carries a per-benchmark `ocamlrunparam: "d=N"` in
#     micro_base.yml, which overrides the config-string value key-by-key —
#     so the config strings here stay IDENTICAL to the completed run and the
#     contract config_ids line up for merging.
#   - 6 benchmarks ran sub-second (weak_htbl: ~6ms) — olly could never attach
#     and the numbers were meaningless. Their args are scaled to seconds in
#     micro_base.yml; minilight_multicore additionally never rendered at all
#     (missing num_domains argv → help path, 1ms exit).
#
# Merge with the completed run afterwards: the 29 have no contract rows to
# collide with; the 6 must have their old rows dropped (they measured the
# wrong workload). See merge_micro_runs.py next to the run dirs.
#
# Usage:
#   cd ~/running-ng
#   RUNNING_BENCH_DIR=~/benches \
#   RUNNING_REUSE_SWITCHES=1 \
#   CONFIG_FILE=src/running/config/experiments/micro_5.5.0_fp_flambda_rerun.yml \
#   LOG_DIR=~/running-ng/gc-sweep-logs-micro-5.5.0-fp-flambda-rerun-$(hostname -s)-$(date +%Y-%m-%d) \
#     bash run_ocaml_bench_gc_sweep.sh
#
# (running-ng-ocaml-5.5.0-fp was removed after an interrupted provisioning on
# 2026-08-28 and is rebuilt by this run, ~2 min. All binaries already exist,
# so the build phase is skip-checks only.)
# =============================================================================

includes:
  - "../base/ocaml/micro_base.yml"

schema_version: "1.0"
remote_host: null
compress_logs: false
minheap_multiplier: 1.0
heap_range: 6
spread_factor: 1

plugins:
  zulip:
    type: Zulip
    request:
      type: private
      to: [361443]

overrides:
  invocations: 5
  benchmarks:
    sandmark-sequential:
      - weak_htbl
    sandmark-with-packages:
      - test_sched
    multicore-effects:
      - algorithmic_differentiation
      - effect_throughput_val
      - rec_seq_evenodd
    multicore-structures:
      - test_queue_parallel
      - test_stack_parallel
      - test_spsc_queue_sequential
      - test_spsc_queue_parallel
      - test_spsc_queue_pingpong_parallel
    multicore-numerical:
      - nbody_multicore
      - floyd_warshall_multicore
      - game_of_life_multicore
      - binarytrees5_multicore
      - spectralnorm2_multicore
      - fannkuchredux_multicore
      - quicksort_multicore
      - mergesort_multicore
      - matrix_multiplication_multicore
      - matrix_multiplication_tiling_multicore
      - LU_decomposition_multicore
      - nqueens_multicore
      - evolutionary_algorithm_multicore
    multicore-grammatrix:
      - grammatrix_multicore
    multicore-minilight:
      - minilight_multicore
    graph500par:
      - kernel1_run_multicore
    mpl:
      - primes
      - msort_ints
      - msort_strings
      - tokens
      - raytracer
    multicore-simple-tests:
      - alloc_multicore
      - pingpong_multicore
    multicore-gcroots:
      - globroots_mp
      - globroots_sp

# =============================================================================
# Runtimes — identical to micro_5.5.0_fp_flambda.yml
# =============================================================================
runtimes:
  ocaml-5.5.0:
    type: OCaml
    version: "5.5.0"

  ocaml-5.5.0-fp:
    type: OCaml
    version: "5.5.0"
    configure_args: ["--enable-frame-pointers"]

  ocaml-5.5.0-flambda:
    type: OCaml
    version: "5.5.0"
    configure_args: ["--enable-flambda"]

  ocaml-5.5.0-fp-flambda:
    type: OCaml
    version: "5.5.0"
    configure_args: ["--enable-frame-pointers", "--enable-flambda"]

# =============================================================================
# Configs — MUST stay identical to micro_5.5.0_fp_flambda.yml so config_ids
# match for the merge (per-benchmark ocamlrunparam overrides md-2 where needed)
# =============================================================================
configs:
  - "ocaml-5.5.0|perf_grp1|re-25|md-2"
  - "ocaml-5.5.0-fp|perf_grp1|re-25|md-2"
  - "ocaml-5.5.0-flambda|perf_grp1|re-25|md-2"
  - "ocaml-5.5.0-fp-flambda|perf_grp1|re-25|md-2"

# =============================================================================
# Comparisons
# =============================================================================
comparisons:
  - label: "5.5.0 micro: fp+flambda vs stock"
    a: ocaml-5.5.0
    b: [ocaml-5.5.0-fp, ocaml-5.5.0-flambda, ocaml-5.5.0-fp-flambda]
