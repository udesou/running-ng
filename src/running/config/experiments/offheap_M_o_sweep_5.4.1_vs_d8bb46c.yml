# Off-heap (M, o) sweep, OCaml 5.4.1 vs d8bb46c (5.5-beta), over the macrobenchmarks
# dominated by custom-block/Bigarray allocation plus owl_gc and zarith_pi; 7x5 (M, o)
# grid, s and m at defaults. Includes macro_base.yml.
# Run: RUNNING_MACRO_BENCH_DIR=~/macro-benches CONFIG_FILE=<this file> bash run_ocaml_bench_gc_sweep.sh

includes:
  - "../base/ocaml/macro_base.yml"

plugins:
  zulip:
    type: Zulip
    request:
      type: private
      to: [361443]

overrides:
  invocations: 3
  benchmarks:
    macro-menhir-monorepo:     []
    macro-cpdf-monorepo:       [cpdf_merge, cpdf_scale, cpdf_squeeze]
    macro-alt-ergo-monorepo:   [alt_ergo_fill]
    macro-coq-monorepo:        []
    macro-devkit:              []
    macro-irmin:               []
    macro-ocamlformat:         []
    macro-decompress:          []
    macro-eio:                 []
    macro-sedlex:              []
    macro-yojson:              []
    macro-zarith:              [zarith_pi]
    macro-owl:                 [owl_gc]
    macro-ocamlc-self-compile: []
    macro-liquidsoap-lang:     []
    macro-merlin:              []
    macro-jsoo:                []
    macro-liq-video-frames:    [liq_video_frames_pool]
    macro-pplacer:             [pplacer_testsuite]

runtimes:
  ocaml-5.4.1:
    type: OCaml
    version: "5.4.1"
  ocaml-d8bb46c:
    type: OCaml
    commit: "d8bb46c39bf5fcafb513a8ba18e667d3f8c2600a"

modifiers:
  M:
    type: OCamlRunParam
    val: "M={0}"
  o:
    type: OCamlRunParam
    val: "o={0}"

configs:
  - "ocaml-5.4.1|perf_grp1|re-25|md-2|re_par-22|md_par-8|pin_lavyek"
  - "ocaml-d8bb46c|perf_grp1|re-25|md-2|re_par-22|md_par-8|pin_lavyek"

config_sweep:
  M: [11, 22, 44, 88, 125, 176, 250]
  o: [40, 80, 100, 120, 150]

comparisons:
  - label: "version effect (M, o) sweep"
    a: ocaml-5.4.1
    b: ocaml-d8bb46c
