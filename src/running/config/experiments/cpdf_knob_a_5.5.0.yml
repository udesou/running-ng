# Knob-A olly pass — cpdf 3-rung squeeze ladder, 5.5.0 (1 inv).
# Knob A = document working set: merge N copies of PDFReference16.pdf (whole
# parsed object graph resident; top_heap grows ~linearly with N) and recompress
# every stream (-squeeze), which supplies the CPU to reach the standard bands.
#   small 8 copies ~7s/0.88GB / default 24 ~18s/1.78GB / large 64 ~55s/3.16GB
includes:
  - "../base/ocaml/macro_base.yml"
overrides:
  invocations: 1
  benchmarks:
    macro-cpdf-monorepo:
      - cpdf_squeeze_small
      - cpdf_squeeze_default
      - cpdf_squeeze_large
runtimes:
  ocaml-5.5.0: { type: OCaml, version: "5.5.0", olly_ref: "main" }
configs:
  - "ocaml-5.5.0|perf_grp1|re-25|md-2"
