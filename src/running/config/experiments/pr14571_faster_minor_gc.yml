# ocaml/ocaml#14571 (faster minor GC, NickBarnes/faster-oldify-upstream) vs its trunk
# merge-base, default GC params, full macro suite. Pure runtime change, so stock olly
# decodes both sides (no olly_ref). If the PR is rebased, re-resolve both SHAs with
#   gh api repos/ocaml/ocaml/compare/trunk...NickBarnes:ocaml:faster-oldify-upstream
# Includes macro_base.yml. RUNNING_TAG is a runtime filter, not a config field:
# Run: RUNNING_MACRO_BENCH_DIR=~/macro-benches RUNNING_TAG=default_run,large_run \
#      CONFIG_FILE=<this file> LOG_DIR=... bash run_ocaml_bench_gc_sweep.sh

plugins:
  zulip:
    type: Zulip
    request:
      type: private
      to: [361443]

includes:
  - "../base/ocaml/macro_base.yml"

# Base scalars change through overrides:; a top-level redeclaration is a combine() TypeError.
overrides:
  invocations: 5

runtimes:
  ocaml-trunk-3b14dfbc:
    type: OCaml
    commit: "3b14dfbcca7c6c24803fc9bbbc5d4a8cc2e7f75b"

  ocaml-pr14571:
    type: OCaml
    repo: "https://github.com/NickBarnes/ocaml.git"
    commit: "16cc07f26ded44a3c2f85ba3c0c9a032e242912f"

configs:
  - "ocaml-trunk-3b14dfbc|perf_grp1"
  - "ocaml-pr14571|perf_grp1"

comparisons:
  - label: "faster minor GC PR vs trunk merge-base"
    a: ocaml-trunk-3b14dfbc
    b: [ocaml-pr14571]
