# ocaml/ocaml#14571 (faster minor GC) vs trunk merge-base: (s, M) sweep x glibc
# allocator default/pinned, owl_gc_default only. owl's +31% on the PR is glibc
# mmap/trim churn from a changed free() order, not GC work; pinning both
# MALLOC_*_THRESHOLD_ removes it (either alone makes both runtimes much worse).
# o is inert (tiny live major heap) and m never applies: dim=500 payloads (~2MB) exceed
# custom_minor_max_size n, so they go straight to the major heap. Includes macro_base.yml.
# Run: RUNNING_MACRO_BENCH_DIR=~/macro-benches RUNNING_REUSE_SWITCHES=1 \
#      CONFIG_FILE=<this file> LOG_DIR=... bash run_ocaml_bench_gc_sweep.sh
# owl is OpenBLAS-multithreaded: discard perf counters of any cell flagged perf_incomplete.

includes:
  - "../base/ocaml/macro_base.yml"

plugins:
  zulip:
    type: Zulip
    request:
      type: private
      to: [361443]

overrides:
  invocations: 5
  benchmarks.macro-owl:                 [owl_gc_default]
  benchmarks.macro-menhir-monorepo:     []
  benchmarks.macro-cpdf-monorepo:       []
  benchmarks.macro-alt-ergo-monorepo:   []
  benchmarks.macro-frama-c-monorepo:    []
  benchmarks.macro-goblint-monorepo:    []
  benchmarks.macro-coq-monorepo:        []
  benchmarks.macro-devkit:              []
  benchmarks.macro-irmin:               []
  benchmarks.macro-ocamlformat:         []
  benchmarks.macro-decompress:          []
  benchmarks.macro-eio:                 []
  benchmarks.macro-sedlex:              []
  benchmarks.macro-yojson:              []
  benchmarks.macro-zarith:              []
  benchmarks.macro-ocamlc-self-compile: []
  benchmarks.macro-liquidsoap-lang:     []
  benchmarks.macro-jsoo:                []
  benchmarks.macro-liq-video-frames:    []
  benchmarks.macro-pplacer:             []
  benchmarks.macro-merlin:              []
  benchmarks.macro-lavyek-monorepo:     []

# Same switches as the other pr14571 configs (RUNNING_REUSE_SWITCHES=1 avoids rebuilding).
runtimes:
  ocaml-trunk-3b14dfbc:
    type: OCaml
    commit: "3b14dfbcca7c6c24803fc9bbbc5d4a8cc2e7f75b"

  ocaml-pr14571:
    type: OCaml
    repo: "https://github.com/NickBarnes/ocaml.git"
    commit: "16cc07f26ded44a3c2f85ba3c0c9a032e242912f"

modifiers:
  s:
    type: OCamlRunParam
    val: "s={0}"
  M:
    type: OCamlRunParam
    val: "M={0}"
  # Allocator axis, applied in the second pair of config strings.
  malloc_mmap32m:
    type: EnvVar
    var: "MALLOC_MMAP_THRESHOLD_"
    val: "33554432"
  malloc_trim64m:
    type: EnvVar
    var: "MALLOC_TRIM_THRESHOLD_"
    val: "67108864"
  # Sweeping m needs n raised above the 2MB payload first (a different experiment):
  #   n: {type: OCamlRunParam, val: "n={0}"}
  #   m: {type: OCamlRunParam, val: "m={0}"}

configs:
  - "ocaml-trunk-3b14dfbc|perf_grp1"
  - "ocaml-pr14571|perf_grp1"
  - "ocaml-trunk-3b14dfbc|perf_grp1|malloc_mmap32m|malloc_trim64m"
  - "ocaml-pr14571|perf_grp1|malloc_mmap32m|malloc_trim64m"

comparisons:
  - label: "faster minor GC PR vs trunk merge-base (owl_gc_default)"
    a: ocaml-trunk-3b14dfbc
    b: [ocaml-pr14571]

config_sweep:
  s: [131072, 262144, 524288, 1048576, 2097152]
  M: [11, 22, 44, 88, 176]
