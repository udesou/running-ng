# =============================================================================
# Regression-targeted (s, o) sweep — 5.4.1 vs d8bb46c (5.5-beta)
# =============================================================================
# Targets the 13 macrobenchmarks that regressed (≥5% on any flag combo) in the
# 2026-05-12 monolith N=10 run (results/2026-05-12-fp-flambda-5.4.1-vs-d8bb46c-monolith-N10.md):
#
#   alt_ergo_fill, cpdf_merge, cpdf_scale, cpdf_squeeze, devkit_stre, jsoo,
#   liq_parse_typecheck, liq_video_frames_pool, menhir_sysver,
#   ocamlc_self_compile, ocamlformat_rocq, pplacer_testsuite, zarith_pi
#
# Note: liq_video_frames_pool was flagged only on -fp in the 5-12 run (other 3
# flag combos sub-5%) — likely sampling noise, but included here so it gets
# (s, o) coverage. _pool is also swept (M, o) in the companion off-heap config
# (it's the ocaml#14533 cell).
#
# Sweep grid (per user spec, 2026-05-13):
#   s ∈ {131072, 262144, 524288, 1048576, 2097152}   (1/2× → 8× default)
#   o ∈ {40, 80, 120, 150, 200}                       (1/3× → 1.67× default)
#   → 5 × 5 = 25 cells per (bench, runtime)
#
# Runtimes: 5.4.1 baseline + d8bb46c, no fp/flambda flag combos.
#
# Total invocations: 25 × 2 × 13 × 3 = 1950.
#
# OCaml runtime param defaults (verified in d8bb46c runtime/caml/config.h):
#   s = 262144  (Minor_heap_def)        — sweep
#   o = 120     (Percent_free_def)      — sweep
#   M = 44      (Custom_major_ratio_def) — fixed at default
#   m = 100     (Custom_minor_ratio_def) — fixed at default
#
# Usage:
#   RUNNING_MACRO_BENCH_DIR=~/macro-benches \
#   CONFIG_FILE=src/running/config/experiments/regression_s_o_sweep_2026_05_13.yml \
#   LOG_DIR=$PWD/gc-sweep-logs-regression-s-o-2026-05-13 \
#     bash run_ocaml_bench_gc_sweep.sh
# =============================================================================

includes:
  - "../base/ocaml/macro_base.yml"

plugins:
  zulip:
    type: Zulip
    request:
      type: private
      to: [361443]

overrides:
  invocations: 3
  benchmarks:
    macro-menhir-monorepo:     [menhir_sysver]
    macro-cpdf-monorepo:       [cpdf_merge, cpdf_scale, cpdf_squeeze]
    macro-alt-ergo-monorepo:   [alt_ergo_fill]
    macro-coq-monorepo:        []
    macro-devkit:              [devkit_stre]
    macro-irmin:               []
    macro-ocamlformat:         [ocamlformat_rocq]
    macro-decompress:          []
    macro-eio:                 []
    macro-sedlex:              []
    macro-yojson:              []
    macro-zarith:              [zarith_pi]
    macro-owl:                 []
    macro-ocamlc-self-compile: [ocamlc_self_compile]
    macro-liquidsoap-lang:     [liq_parse_typecheck]
    macro-merlin:              []
    macro-jsoo:                [jsoo]
    macro-liq-video-frames:    [liq_video_frames_pool]
    macro-pplacer:             [pplacer_testsuite]
    macro-lavyek-monorepo:     []

# =============================================================================
# Runtimes — 5.4.1 baseline + d8bb46c, no flag combos
# =============================================================================
runtimes:
  ocaml-5.4.1:
    type: OCaml
    version: "5.4.1"
  ocaml-d8bb46c:
    type: OCaml
    commit: "d8bb46c39bf5fcafb513a8ba18e667d3f8c2600a"

# =============================================================================
# Modifiers — s and o swept; M and m left at default
# =============================================================================
modifiers:
  s:
    type: OCamlRunParam
    val: "s={0}"
  o:
    type: OCamlRunParam
    val: "o={0}"

# =============================================================================
# Configs — base config strings; config_sweep below cross-products (s, o)
# =============================================================================
configs:
  - "ocaml-5.4.1|perf_grp1|re-25|md-2"
  - "ocaml-d8bb46c|perf_grp1|re-25|md-2"

config_sweep:
  s: [131072, 262144, 524288, 1048576, 2097152]
  o: [40, 80, 120, 150, 200]

# =============================================================================
# Comparisons — version effect at each (s, o) cell
# =============================================================================
comparisons:
  - label: "version effect (s, o) sweep"
    a: ocaml-5.4.1
    b: ocaml-d8bb46c
