# Real run: 5 iterations, ALL active macrobenchmarks (macro_base full set; merlin
# + lavyek stay disabled), new version cbc66e3. MMTk LXR + Bactrian vs stock
# OCaml 5.5.0-rc1 (4090d6db, the commit the fork is based upon) at default
# parameters. Dynamic heap, schema_version on (native contract emission).
#
# Launch ONLY after mmtk_smoke_cbc66e3.yml confirms build+run; exclude via a
# benchmarks: override any bench the smoke shows hangs/crashes under LXR/Bactrian.
includes:
  - "../base/ocaml/macro_base.yml"

schema_version: "1.0"

plugins:
  zulip:
    type: Zulip
    request:
      type: private
      to: [361443]

overrides:
  invocations: 5
  # Full active macro set MINUS the 4 the cbc66e3 smoke showed don't work under
  # LXR/Bactrian: goblint (build-fails), devkit_htmlstream / sedlex_tokenize /
  # liq_video_frames_pool (hang). pplacer IS kept — it runs under LXR/Bactrian
  # (it only SIGABRTs under GenImmix/Immix). => 27 benchmarks.
  benchmarks:
    macro-menhir-monorepo: [menhir_ocamly, menhir_sql_parser, menhir_sysver]
    macro-cpdf-monorepo: [cpdf_merge, cpdf_blacktext, cpdf_scale, cpdf_squeeze]
    macro-alt-ergo-monorepo: [alt_ergo_fill, alt_ergo_yyll, alt_ergo_unsat_smt2]
    macro-frama-c-monorepo: [frama_c_eva_t, frama_c_eva_sqlite]
    macro-coq-monorepo: [coqc_corelib_stress]
    macro-devkit: [devkit_stre, devkit_network, devkit_gzip]
    macro-irmin: [irmin_mem_rw]
    macro-ocamlformat: [ocamlformat_rocq]
    macro-decompress: [test_decompress]
    macro-eio: [eio_fiber_stream]
    macro-yojson: [ydump_repeat]
    macro-zarith: [zarith_pi]
    macro-owl: [owl_gc]
    macro-ocamlc-self-compile: [ocamlc_self_compile]
    macro-liquidsoap-lang: [liq_parse_typecheck]
    macro-jsoo: [jsoo]
    macro-pplacer: [pplacer_testsuite]

maxheap: 8192
attempts: 2


runtimes:
  ocaml-mmtk-cbc66e3:
    type: OCamlMMTk
    repo: "https://github.com/fplaunchpad/ocaml-mmtk.git"
    commit: "cbc66e3efd8f9200f3e84f791a6b6dfc36efce8c"
  ocaml-5.5.0-rc1:
    type: OCaml
    commit: "4090d6db952ecae1cd0c3493c16d89cacc2bf8c6"

configs:
  - "ocaml-mmtk-cbc66e3|time_stats|plan-LXR"
  - "ocaml-mmtk-cbc66e3|time_stats|plan-Bactrian"
  - "ocaml-5.5.0-rc1|time_stats"
