# =============================================================================
# Build-check: build EVERY macro-benchmark on 5.4.1 / 5.5-beta1 / trunk
# =============================================================================
# Build-only (no run): validates that every enabled benchmark in
# macro_base.yml compiles cleanly from the vendored monorepo against the
# three target runtimes.  Each program is built via its own build.sh — the
# authentic per-runtime build path — not just a representative dune target.
#
# Runtimes:
#   - ocaml-5.4.1            : released 5.4.1
#   - ocaml-d8bb46c          : 5.5.0~beta1 (fixed commit)
#   - ocaml-trunk-fb4f451    : trunk / 5.6 (fb4f451, 2026-06-16 — post Ctype.Unify fix; goblint builds)
#
# Builds all 19 active tools (30 programs), incl. frama-c (eva_t + eva_sqlite).
# merlin and lavyek stay disabled (upstream race / private repo).
#
# Usage:
#   cd ~/running-ng
#   export OLLY_DIR=~/runtime_events_tools
#   export RUNNING_MACRO_BENCH_DIR=~/macro-benches
#   eval $(opam env --switch=running-ng-tools --set-switch)
#   PYTHONPATH=src python3 -m running buildbms \
#     src/running/config/experiments/macrobenchmarks_buildcheck.yml
# =============================================================================

includes:
  - "../base/ocaml/macro_base.yml"

overrides:
  invocations: 1
  benchmarks.macro-lavyek-monorepo: []

runtimes:
  ocaml-5.4.1:
    type: OCaml
    version: "5.4.1"
    olly_ref: "main"

  ocaml-d8bb46c:
    type: OCaml
    commit: "d8bb46c39bf5fcafb513a8ba18e667d3f8c2600a"
    olly_ref: "main"

  ocaml-trunk-fb4f451:
    type: OCaml
    commit: "fb4f45126447ef0efbcdd82759bbb7a9f065cb21"
    olly_ref: "main"

configs:
  - "ocaml-5.4.1|perf_grp1|re-25|md-2|re_par-22|md_par-8|pin_lavyek"
  - "ocaml-d8bb46c|perf_grp1|re-25|md-2|re_par-22|md_par-8|pin_lavyek"
  - "ocaml-trunk-fb4f451|perf_grp1|re-25|md-2|re_par-22|md_par-8|pin_lavyek"
