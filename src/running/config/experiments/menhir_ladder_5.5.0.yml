# olly pass — menhir 3-rung automaton-scale ladder, OCaml 5.5.0 (1 inv).
# Monotone by footprint AND wall (single grammar family; menhir has no callable
# main to loop, so a bigger input is the only way to lengthen a run):
#   small=menhir_sysver           sysver --table                7.7s / 0.72GB
#   default=menhir_ocamly         ocaml --canonical --list-errors 12.7s / 2.76GB
#   large=menhir_sysver_canonical sysver --canonical            33s  / 4.0GB
includes:
  - "../base/ocaml/macro_base.yml"
overrides:
  invocations: 1
  benchmarks:
    macro-menhir-monorepo:
      - menhir_sysver
      - menhir_ocamly
      - menhir_sysver_canonical
runtimes:
  ocaml-5.5.0:
    type: OCaml
    version: "5.5.0"
    olly_ref: "main"
configs:
  - "ocaml-5.5.0|perf_grp1|re-25|md-2"
