# =============================================================================
# OCaml 5.5.0: stock vs -fp / -flambda / both — MICRO benchmarks, default GC
# =============================================================================
# The micro-benchmark counterpart of macro_5.5.0_fp_flambda.yml: the same four
# builds of the 5.5.0 release, at the compiler's own default GC params (no
# `config_sweep:`), over the full ~/benches suite. Where the macro run asks
# "did real programs get slower under fp/flambda", this one asks which part of
# the runtime moved: allocation rate, mark/sweep, effect dispatch, weak tables,
# domain synchronisation, the OCaml->C boundary.
#
#   - ocaml-5.5.0             stock release
#   - ocaml-5.5.0-fp          --enable-frame-pointers
#   - ocaml-5.5.0-flambda     --enable-flambda
#   - ocaml-5.5.0-fp-flambda  both
#
# Suites, benchmarks and modifiers come from micro_base.yml — the full
# selection, all 195 non-OxCaml programs (`oxcaml_prefetch` is deselected via
# `overrides:` below: its suite raises at build time on a plain OCaml runtime).
# Micro configs still carry the global `re-25|md-2` ring sizing in the config
# strings (#15 moved it to suite/benchmark `ocamlrunparam:` for MACRO only;
# micro_base has no per-suite values yet).
#
# All four switches (running-ng-ocaml-5.5.0{,-fp,-flambda,-fp-flambda}) exist
# on this machine, so pass RUNNING_REUSE_SWITCHES=1 unless you want the four
# compilers rebuilt from source (~10-20 min each).
#
# ---------------------------------------------------------------------------
# Usage:
#
#   cd ~/running-ng
#   RUNNING_BENCH_DIR=~/benches \
#   RUNNING_REUSE_SWITCHES=1 \
#   CONFIG_FILE=src/running/config/experiments/micro_5.5.0_fp_flambda.yml \
#   LOG_DIR=~/running-ng/gc-sweep-logs-micro-5.5.0-fp-flambda-$(hostname -s)-$(date +%Y-%m-%d) \
#     bash run_ocaml_bench_gc_sweep.sh
#
# 4 runtimes x 195 programs x N=5 = 3900 invocations.
# =============================================================================

includes:
  - "../base/ocaml/micro_base.yml"

schema_version: "1.0"
remote_host: null
compress_logs: false
minheap_multiplier: 1.0
heap_range: 6
spread_factor: 1

plugins:
  zulip:
    type: Zulip
    request:
      type: private
      to: [361443]

overrides:
  invocations: 5
  # oxcaml_prefetch needs a `type: OxCaml` runtime (OCamlOxcamlBenchmarkSuite
  # raises at build time otherwise); none of the four runtimes here is one.
  benchmarks.oxcaml-prefetch: []

# =============================================================================
# Runtimes
# =============================================================================
runtimes:
  ocaml-5.5.0:
    type: OCaml
    version: "5.5.0"

  ocaml-5.5.0-fp:
    type: OCaml
    version: "5.5.0"
    configure_args: ["--enable-frame-pointers"]

  ocaml-5.5.0-flambda:
    type: OCaml
    version: "5.5.0"
    configure_args: ["--enable-flambda"]

  ocaml-5.5.0-fp-flambda:
    type: OCaml
    version: "5.5.0"
    configure_args: ["--enable-frame-pointers", "--enable-flambda"]

# =============================================================================
# Configs — default GC settings, no sweep
# =============================================================================
configs:
  - "ocaml-5.5.0|perf_grp1|re-25|md-2"
  - "ocaml-5.5.0-fp|perf_grp1|re-25|md-2"
  - "ocaml-5.5.0-flambda|perf_grp1|re-25|md-2"
  - "ocaml-5.5.0-fp-flambda|perf_grp1|re-25|md-2"

# =============================================================================
# Comparisons — consumed by notebooks A/B via load_comparisons()
# =============================================================================
comparisons:
  - label: "5.5.0 micro: fp+flambda vs stock"
    a: ocaml-5.5.0
    b: [ocaml-5.5.0-fp, ocaml-5.5.0-flambda, ocaml-5.5.0-fp-flambda]
