# OCaml 5.5.0 stock vs -fp / -flambda / -fp-flambda on the full micro suite (195
# non-OxCaml programs), default GC params. Includes micro_base.yml.
# Run: RUNNING_BENCH_DIR=~/benches RUNNING_REUSE_SWITCHES=1 CONFIG_FILE=<this file> \
#      LOG_DIR=... bash run_ocaml_bench_gc_sweep.sh
# Micro config strings still carry re-25|md-2: micro_base has no per-suite ring values.

includes:
  - "../base/ocaml/micro_base.yml"

schema_version: "1.0"
remote_host: null
compress_logs: false
minheap_multiplier: 1.0
heap_range: 6
spread_factor: 1

plugins:
  zulip:
    type: Zulip
    request:
      type: private
      to: [361443]

overrides:
  invocations: 5
  # OCamlOxcamlBenchmarkSuite raises at build time on a non-OxCaml runtime.
  benchmarks.oxcaml-prefetch: []

runtimes:
  ocaml-5.5.0:
    type: OCaml
    version: "5.5.0"

  ocaml-5.5.0-fp:
    type: OCaml
    version: "5.5.0"
    configure_args: ["--enable-frame-pointers"]

  ocaml-5.5.0-flambda:
    type: OCaml
    version: "5.5.0"
    configure_args: ["--enable-flambda"]

  ocaml-5.5.0-fp-flambda:
    type: OCaml
    version: "5.5.0"
    configure_args: ["--enable-frame-pointers", "--enable-flambda"]

configs:
  - "ocaml-5.5.0|perf_grp1|re-25|md-2"
  - "ocaml-5.5.0-fp|perf_grp1|re-25|md-2"
  - "ocaml-5.5.0-flambda|perf_grp1|re-25|md-2"
  - "ocaml-5.5.0-fp-flambda|perf_grp1|re-25|md-2"

comparisons:
  - label: "5.5.0 micro: fp+flambda vs stock"
    a: ocaml-5.5.0
    b: [ocaml-5.5.0-fp, ocaml-5.5.0-flambda, ocaml-5.5.0-fp-flambda]
