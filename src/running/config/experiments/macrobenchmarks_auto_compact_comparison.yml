# =============================================================================
# Macro-benchmarks — automatic compaction comparison
# =============================================================================
# Compares four compiler variants:
#   - ocaml-4.14          : OCaml 4.14.3 (runtime 4, mark-and-compact GC)
#   - ocaml-5.5           : OCaml 5.5.0 (runtime 5, chunk-based compactor, no auto-compact)
#   - oxcaml              : OxCaml trunk (runtime 5, poll insertion, multidomain)
#   - socaml-auto-compact : OCaml 5.5 + chunk-based compactor + automatic compaction
#                           (branch: new_compactor @ 34988cfd7b5d9baf66bbf2f1657c6f11013c68f2)
#
# Experiment focus: GC compaction behavior across runtime generations and the
# effect of enabling automatic compaction (caml_max_percent_free, OCAMLRUNPARAM O=).
# High-signal benchmarks: owl (bigarrays + major GC), liq-video-frames (off-heap
# accounting), alt-ergo (weak hash-consing), zarith/coq (custom blocks + finalisation),
# menhir/cpdf (allocation-heavy compilation workloads).
#
# Note: macro-eio is disabled — Eio requires OCaml >= 5.2 (algebraic effects).
# All other suites support OCaml 4.13+ including macro-jsoo (vendored ocaml-5.6
# branch of js_of_ocaml supports 4.13 ≤ x < 5.7).
# macro-lavyek-monorepo and macro-merlin remain disabled (upstream: private repo
# and upstream race respectively — see macro_base.yml).
#
# Setup for socaml-auto-compact (pre-built executable mode):
#   The runtime points to an existing opam switch. Dune and ocamlfind must be
#   present in that switch's bin for benchmark builds:
#
#     opam install dune ocamlfind \
#       --switch socaml-auto-compact-20260629-131142 --yes
# =============================================================================

includes:
  - "../base/ocaml/macro_base.yml"

overrides:
  invocations: 3
  suites.macro-coq-monorepo.timeout: 300
  # macro-eio requires OCaml >= 5.2 (Eio uses algebraic effects). Disabled to
  # avoid build failures on the ocaml-4.14 runtime.
  benchmarks.macro-eio: []

# =============================================================================
# Runtimes
# =============================================================================
runtimes:
  ocaml-4.14:
    type: OCaml
    version: "4.14.3"

  ocaml-5.5:
    type: OCaml
    version: "5.5.0"

  oxcaml:
    type: OxCaml
    commit: "068b25529286862035eaf827230f7ffa86659c49"
    configure_args: ["--enable-poll-insertion", "--enable-multidomain"]

  # Pre-built opam switch: OCaml 5.5 + chunk-based pool compactor + automatic
  # compaction (Compaction_auto mode, caml_max_percent_free default 500%).
  # See setup note above before running.
  socaml-auto-compact:
    type: OCaml
    executable: "/home/curche/.opam/socaml-auto-compact-20260629-131142/bin/ocaml"

# =============================================================================
# Configs — baseline comparison at default GC settings
# =============================================================================
# re-25 gives a 256 MB per-domain ring buffer — required for owl_gc which
# overflows the default 8 MB ring at >= 5 loop iterations and produces corrupt
# wall_time values. md-2 is the minimum domain count for sequential workloads.
# Lavyek is disabled (private repo) so the re_par/md_par/pin_lavyek parallel
# modifiers from macrobenchmarks_monorepo.yml are not needed here.
configs:
  - "ocaml-4.14|perf_grp1|re-25|md-2"
  - "ocaml-5.5|perf_grp1|re-25|md-2"
  - "oxcaml|perf_grp1|re-25|md-2"
  - "socaml-auto-compact|perf_grp1|re-25|md-2"

# =============================================================================
# Comparisons
# =============================================================================
comparisons:
  - label: "runtime generation (4.14 vs 5.5)"
    a: ocaml-4.14
    b: ocaml-5.5

  - label: "automatic compaction effect (5.5 vs socaml-auto-compact)"
    a: ocaml-5.5
    b: socaml-auto-compact

  - label: "oxcaml vs stock 5.5"
    a: ocaml-5.5
    b: oxcaml

  - label: "oxcaml vs socaml-auto-compact"
    a: oxcaml
    b: socaml-auto-compact
