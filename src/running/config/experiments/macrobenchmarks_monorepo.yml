# Macro-benchmark baseline: OCaml 5.4.1 vs trunk vs OxCaml trunk on the vendored
# ~/macro-benches monorepo (each runtime builds into its own _build-<runtime>).
# Includes macro_base.yml.
# Run: RUNNING_MACRO_BENCH_DIR=~/macro-benches CONFIG_FILE=<this file> bash run_ocaml_bench_gc_sweep.sh

includes:
  - "../base/ocaml/macro_base.yml"

overrides:
  invocations: 1
  suites.macro-coq-monorepo.timeout: 300

runtimes:
  ocaml-5.4.1:
    type: OCaml
    version: "5.4.1"
  ocaml-trunk:
    type: OCaml
    commit: "02ee646ee1f40eb19f4942f50a4a607b52b3ab39"
  oxcaml-trunk:
    type: OxCaml
    commit: "068b25529286862035eaf827230f7ffa86659c49"
    configure_args: ["--enable-poll-insertion", "--enable-multidomain"]

configs:
  - "ocaml-5.4.1|perf_grp1|re_par-22|md_par-8|pin_lavyek"
  - "ocaml-trunk|perf_grp1|re_par-22|md_par-8|pin_lavyek"
  - "oxcaml-trunk|perf_grp1|re_par-22|md_par-8|pin_lavyek"
