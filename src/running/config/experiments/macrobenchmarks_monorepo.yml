# =============================================================================
# Macro-benchmarks — monorepo build (no opam at build time)
# =============================================================================
# Builds real-world OCaml tools (menhir, cpdf, alt-ergo, coq, ...) from vendored
# source in ~/macro-benches.  All dependencies are pre-locked and vendored via
# opam-monorepo, so identical source code is compiled by every runtime.
#
# How it works:
#   1. running-ng builds the compiler (via opam compiler create)
#   2. Build scripts call `dune build` in the macro-benches monorepo using
#      the runtime compiler on PATH
#   3. Each runtime gets its own _build-<runtime> directory for isolation
#
# Prerequisites (see macrobenchmarks_base.yml for full setup notes):
#   - ~/macro-benches/duniverse/ populated (opam monorepo pull)
#   - ~/macro-benches/vendor/{camlpdf,cpdf-source,zarith} populated
#   - Input files in ~/macro-benches/benchmarks/<tool>/
#
# Usage:
#   RUNNING_MACRO_BENCH_DIR=~/macro-benches \
#   CONFIG_FILE=src/running/config/macrobenchmarks_monorepo.yml \
#     bash run_ocaml_bench_gc_sweep.sh
# =============================================================================

includes:
  - "./macrobenchmarks_base.yml"

# Baseline-comparison run: 1 invocation, and coq's faster 300s timeout.
overrides:
  invocations: 1
  suites.macro-coq-monorepo.timeout: 300

# =============================================================================
# Runtimes
# =============================================================================
runtimes:
  ocaml-5.4.1:
    type: OCaml
    version: "5.4.1"
  ocaml-trunk:
    type: OCaml
    commit: "02ee646ee1f40eb19f4942f50a4a607b52b3ab39"
  oxcaml-trunk:
    type: OxCaml
    commit: "068b25529286862035eaf827230f7ffa86659c49"
    configure_args: ["--enable-poll-insertion", "--enable-multidomain"]

# =============================================================================
# Configs — no sweep, baseline comparison at default GC settings
# =============================================================================
configs:
  - "ocaml-5.4.1|perf_grp1"
  - "ocaml-trunk|perf_grp1"
  - "oxcaml-trunk|perf_grp1"
