# olly pass — eio 3-rung concurrency ladder, 5.5.0 (1 inv).
# Size axis = concurrency degree: eio_conc_bench runs n_pairs (argv.1) independent
# producer/consumer fiber pairs, each on its own bounded stream, so the live set
# (parked fibers' effect continuations + data buffered across all streams) grows
# ~linearly. Per-fiber work fixed at 20000 items. Live-set ladder (promotion ~0.85).
#   small 3000 ~5.5s/0.69GB / default 9000 ~16s/2.1GB / large 21000 ~39s/5.1GB
includes:
  - "../base/ocaml/macro_base.yml"
overrides:
  invocations: 1
  benchmarks:
    macro-eio:
      - eio_conc_small
      - eio_conc_default
      - eio_conc_large
runtimes:
  ocaml-5.5.0: { type: OCaml, version: "5.5.0", olly_ref: "main" }
configs:
  - "ocaml-5.5.0|perf_grp1|re-25|md-2"
