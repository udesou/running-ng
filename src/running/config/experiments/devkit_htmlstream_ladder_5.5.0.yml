# olly pass — devkit_htmlstream 3-rung content-size ladder, 5.5.0 (1 inv).
# Size axis = per-document content size: devkit_htmlstream is a synthetic 8-part
# HtmlStream GC-stress suite; the arg is a scale factor (argv.1) multiplying the
# per-document content counts (elements generated + structures retained) while
# keeping the outer document repetition fixed. Both allocation churn and working
# set grow ~linearly; arg=1 is the frozen benchmark.
#   small x1 ~7s/365MB / default x3 ~20s/1.09GB / large x8 ~51s/2.57GB
includes:
  - "../base/ocaml/macro_base.yml"
overrides:
  invocations: 1
  benchmarks:
    macro-devkit:
      - devkit_htmlstream_small
      - devkit_htmlstream_default
      - devkit_htmlstream_large
runtimes:
  ocaml-5.5.0: { type: OCaml, version: "5.5.0", olly_ref: "main" }
configs:
  - "ocaml-5.5.0|perf_grp1|re-25|md-2"
