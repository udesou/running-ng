# olly pass — alt-ergo 3-rung congruence-chain ladder, 5.5.0 (1 inv).
# Size axis = single-solve problem size (N): one goal asserting a(0)=0 and
# a(i)=a(i-1)+1 for i in 1..N, proving a(N)=N. alt-ergo builds an N-term
# congruence/arithmetic structure in one solve; wall and live heap scale ~N^2.2.
#   small N=4000 ~4s/0.6GB / default 7000 ~13s/1.9GB / large 10500 ~32s/5.0GB
includes:
  - "../base/ocaml/macro_base.yml"
overrides:
  invocations: 1
  benchmarks:
    macro-alt-ergo-monorepo:
      - alt_ergo_chain_small
      - alt_ergo_chain_default
      - alt_ergo_chain_large
runtimes:
  ocaml-5.5.0: { type: OCaml, version: "5.5.0", olly_ref: "main" }
configs:
  - "ocaml-5.5.0|perf_grp1|re-25|md-2"
