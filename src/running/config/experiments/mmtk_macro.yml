# MMTk macro-benches: fplaunchpad/ocaml-mmtk (plans GenImmix/Immix/Bactrian/LXR via
# the plan-<Plan> modifier) vs the stock 5.5.0-rc1 commit it forks from. Includes
# macro_base.yml. Dynamic heap unless MMTK_HEAP_SIZE_MB (mmtk_heap) is set; every
# MMTk process runs under `setarch -R`; no olly GC counters (use MMTK_VERBOSE=1).
# With RUNNING_MACRO_BENCH_DIR=~/macro-benches CONFIG_FILE=<this file>:
#   build:   bash build_ocaml_binaries_gc_sweep.sh
#   run:     LOG_DIR=... bash run_ocaml_bench_gc_sweep.sh
#   minheap: PYTHONPATH=src python3 -m running minheap <this file> /tmp/mmtk_minheap.yml -a 2

includes:
  - "../base/ocaml/macro_base.yml"

overrides:
  invocations: 3

# Bounds for `minheap` (ignored by runbms/buildbms).
maxheap: 8192
attempts: 2

modifiers:
  # Fixed heap for minheap / repro only; the run configs below use the dynamic heap.
  mmtk_heap:
    type: EnvVar
    var: "MMTK_HEAP_SIZE_MB"
    val: "16384"

runtimes:
  ocaml-mmtk-cbc66e3:
    type: OCamlMMTk
    repo: "https://github.com/fplaunchpad/ocaml-mmtk.git"
    commit: "cbc66e3efd8f9200f3e84f791a6b6dfc36efce8c"
  ocaml-5.5.0-rc1:
    type: OCaml
    commit: "4090d6db952ecae1cd0c3493c16d89cacc2bf8c6"

configs:
  - "ocaml-mmtk-cbc66e3|time_stats|plan-GenImmix"
  - "ocaml-mmtk-cbc66e3|time_stats|plan-Immix"
  - "ocaml-mmtk-cbc66e3|time_stats|plan-Bactrian"
  - "ocaml-mmtk-cbc66e3|time_stats|plan-LXR"
  - "ocaml-5.5.0-rc1|time_stats"
