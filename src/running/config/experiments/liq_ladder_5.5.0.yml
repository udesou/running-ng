# olly pass — liq_parse_typecheck 3-rung script-size ladder, 5.5.0 (1 inv).
# Size axis = script size (argv.2 = generated unit count); iterations pinned 1.
#   small 4000u ~5s 261MB / default 6500u ~14s 410MB / large 12000u ~65s 757MB
includes:
  - "../base/ocaml/macro_base.yml"
overrides:
  invocations: 1
  benchmarks:
    macro-liquidsoap-lang:
      - liq_parse_typecheck_small
      - liq_parse_typecheck_default
      - liq_parse_typecheck_large
runtimes:
  ocaml-5.5.0: { type: OCaml, version: "5.5.0", olly_ref: "main" }
configs:
  - "ocaml-5.5.0|perf_grp1|re-25|md-2"
