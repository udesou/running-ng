# End-to-end pipeline check: OCaml 5.5.0 vs pinned trunk over the full macro suite,
# 1 invocation per cell (plumbing, not a measurement). Includes macro_base.yml.
# Run: RUNNING_MACRO_BENCH_DIR=~/macro-benches CONFIG_FILE=<this file> \
#      LOG_DIR=~/running-ng/gc-sweep-logs-e2e bash run_ocaml_bench_gc_sweep.sh
# Then run `running adapt` over the run dir and diff it against the inline contract/.

includes:
  - "../base/ocaml/macro_base.yml"

# Base scalars change through overrides:; a top-level redeclaration is a combine() TypeError.
overrides:
  invocations: 1

runtimes:
  # Release tag; named for the exact version so the switch running-ng-ocaml-5.5.0 is shared with memtrace_poc.yml.
  ocaml-5.5.0:
    type: OCaml
    version: "5.5.0"

  # ocaml/ocaml trunk HEAD as of 2026-07-31.
  ocaml-trunk-15a9de75:
    type: OCaml
    commit: "15a9de755d2ccae5ee25c3c12022a1740db9d84d"

configs:
  - "ocaml-5.5.0|perf_grp1"
  - "ocaml-trunk-15a9de75|perf_grp1"

comparisons:
  - label: "5.5.0 -> trunk"
    a: ocaml-5.5.0
    b: [ocaml-trunk-15a9de75]
