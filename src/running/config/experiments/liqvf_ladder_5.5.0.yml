# olly pass — liq_video_frames resolution ladder, 5.5.0 (1 inv).
# Size axis = frame resolution (15000 frames; POOL=1 pacer regime).
#   small 1080p ~5.6s / default 4K ~22s / large 8K ~101s
includes:
  - "../base/ocaml/macro_base.yml"
overrides:
  invocations: 1
  benchmarks:
    macro-liq-video-frames:
      - liq_video_frames_pool_small
      - liq_video_frames_pool_default
      - liq_video_frames_pool_large
runtimes:
  ocaml-5.5.0: { type: OCaml, version: "5.5.0", olly_ref: "main" }
configs:
  - "ocaml-5.5.0|perf_grp1|re-25|md-2"
