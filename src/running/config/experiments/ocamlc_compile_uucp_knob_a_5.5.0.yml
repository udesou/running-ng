# olly pass — ocamlc_compile_uucp 3-rung input-size ladder, 5.5.0 (1 inv).
# Compiling N replicas of the uucp Unicode library. uucp is data/constant-heavy
# with a COLLECTED heap, so scaling it keeps RSS ~flat (~90-120MB) while major-GC
# cycles + promotion scale linearly — a cheap major-GC-throughput ladder (the
# counterpart to ocamlc_self_compile's memory-bound monotonic-heap compilation).
#   small N=3 ~6s/87MB/377 major / default N=8 ~17s/96MB/771 / large N=25 ~58s/120MB/1582
includes:
  - "../base/ocaml/macro_base.yml"
overrides:
  invocations: 1
  benchmarks:
    macro-ocamlc-self-compile:
      - ocamlc_compile_uucp_small
      - ocamlc_compile_uucp_default
      - ocamlc_compile_uucp_large
runtimes:
  ocaml-5.5.0: { type: OCaml, version: "5.5.0", olly_ref: "main" }
configs:
  - "ocaml-5.5.0|perf_grp1|re-25|md-2"
