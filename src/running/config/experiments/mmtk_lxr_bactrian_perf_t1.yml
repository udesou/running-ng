# Rerun: MMTK_THREADS=1 + perf/olly attach (perf_grp1) for dashboard-feedable
# stats. LXR + Bactrian vs stock 5.5.0-rc1, cbc66e3, dynamic heap, 5 iters,
# schema_version on (emits contract/measurements/{olly,perf}.ndjson).
# Under MMTk: olly gives wall/cpu/max_rss (GC counters empty); perf gives
# instructions/cycles/task_clock. Same 27-bench set as mmtk_lxr_bactrian_5iter.
includes:
  - "../base/ocaml/macro_base.yml"

schema_version: "1.0"

plugins:
  zulip:
    type: Zulip
    request:
      type: private
      to: [361443]

overrides:
  invocations: 5
  benchmarks:
    macro-menhir-monorepo: [menhir_ocamly, menhir_sql_parser, menhir_sysver]
    macro-cpdf-monorepo: [cpdf_merge, cpdf_blacktext, cpdf_scale, cpdf_squeeze]
    macro-alt-ergo-monorepo: [alt_ergo_fill, alt_ergo_yyll, alt_ergo_unsat_smt2]
    macro-frama-c-monorepo: [frama_c_eva_t, frama_c_eva_sqlite]
    macro-coq-monorepo: [coqc_corelib_stress]
    macro-devkit: [devkit_stre, devkit_network, devkit_gzip]
    macro-irmin: [irmin_mem_rw]
    macro-ocamlformat: [ocamlformat_rocq]
    macro-decompress: [test_decompress]
    macro-eio: [eio_fiber_stream]
    macro-yojson: [ydump_repeat]
    macro-zarith: [zarith_pi]
    macro-owl: [owl_gc]
    macro-ocamlc-self-compile: [ocamlc_self_compile]
    macro-liquidsoap-lang: [liq_parse_typecheck]
    macro-jsoo: [jsoo]
    macro-pplacer: [pplacer_testsuite]

maxheap: 8192
attempts: 2

# plan-<Plan> / threads-<N> modifiers come from macro_base — they record
# gc_plan / gc_threads dimensions so each plan gets a distinct config_id
# (Bactrian vs LXR plot as separate series in the dashboard).

runtimes:
  ocaml-mmtk-cbc66e3:
    type: OCamlMMTk
    repo: "https://github.com/fplaunchpad/ocaml-mmtk.git"
    commit: "cbc66e3efd8f9200f3e84f791a6b6dfc36efce8c"
  ocaml-5.5.0-rc1:
    type: OCaml
    commit: "4090d6db952ecae1cd0c3493c16d89cacc2bf8c6"

configs:
  - "ocaml-mmtk-cbc66e3|perf_grp1|plan-LXR|threads-1"
  - "ocaml-mmtk-cbc66e3|perf_grp1|plan-Bactrian|threads-1"
  - "ocaml-5.5.0-rc1|perf_grp1"
