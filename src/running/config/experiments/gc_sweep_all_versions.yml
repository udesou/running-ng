invocations: 1
remote_host: null
compress_logs: false
minheap_multiplier: 1.0
heap_range: 6
spread_factor: 1


# Suites, modifiers, and benchmarks come from base/ocaml/micro_base.yml.
includes:
  - "../base/ocaml/micro_base.yml"

# =============================================================================
# GC Parameter Sweep — 5 OCaml versions × 49 (s,o) combinations
# =============================================================================
# Runtimes:
#   - OCaml 4.14.3        (last pre-multicore release)
#   - OCaml 5.1.0         (early OCaml 5)
#   - OCaml 5.4.1         (latest stable)
#   - OCaml trunk         (development head)
#   - OxCaml trunk        (Jane Street fork)
#
# Sweep: s × o = 7 × 7 = 49 configs per runtime = 245 total configs.
# Each config runs all compatible benchmarks for its runtime.
#
# Expected build failures (handled gracefully):
#   - OCaml 4.14.3: multicore + OxCaml suites (OCaml >= 5 required)
#   - OxCaml: 5 benchmarks with locality type errors (lwt, yojson, mandelbrot6_multicore)
#   - Non-OxCaml runtimes: oxcaml_prefetch (OxCaml-only)

# =============================================================================
# Runtimes
# =============================================================================
runtimes:
  ocaml-4.14.3:
    type: OCaml
    version: "4.14.3"
  ocaml-5.1.0:
    type: OCaml
    version: "5.1.0"
  ocaml-5.4.1:
    type: OCaml
    version: "5.4.1"
  ocaml-trunk:
    type: OCaml
    commit: "02ee646ee1f40eb19f4942f50a4a607b52b3ab39"
  oxcaml-trunk:
    type: OxCaml
    commit: "068b25529286862035eaf827230f7ffa86659c49"
    configure_args: ["--enable-poll-insertion", "--enable-multidomain"]

# Configs & Sweep — 5 runtimes × 49 (s,o) combinations = 245 total
# =============================================================================
# Base configs (one per runtime). GC stats + timing come from olly --json,
# hardware counters from perf stat --json.
# The sweep appends s-{val}|o-{val} to each, generating 49 variants per base.

configs:
  - "ocaml-4.14.3|perf_grp1"
  - "ocaml-5.1.0|perf_grp1"
  - "ocaml-5.4.1|perf_grp1"
  - "ocaml-trunk|perf_grp1"
  - "oxcaml-trunk|perf_grp1|re-25|md-9"

config_sweep:
  s: [32768, 65536, 131072, 262144, 524288, 1048576, 2097152]
  o: [40, 60, 80, 100, 120, 150, 200]
