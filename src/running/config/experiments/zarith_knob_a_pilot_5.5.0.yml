# =============================================================================
# Knob-A pilot — zarith 4-rung ladder on OCaml 5.5.0 (single invocation)
# =============================================================================
# Characterisation + harness de-risk for the macro-bench input refactor.
# Runs the four settled zarith rungs (digit-count = Knob A) once each under
# 5.5.0, capturing gc%/pauses via olly (perf_grp1) + re-25 ring.
# NOT a regression comparison — single runtime, invocations:1.
#
# Rungs (measured wall on Ryzen 9950X): small 5.2s / default 15.9s /
# large 120s / huge 351s. timeout 900 > huge.
#
# Usage:
#   cd ~/running-ng
#   OLLY_DIR=~/runtime_events_tools \
#   RUNNING_MACRO_BENCH_DIR=~/macro-benches \
#   CONFIG_FILE=src/running/config/experiments/zarith_knob_a_pilot_5.5.0.yml \
#   LOG_DIR=/tmp/claude-1001/-home-udesou/eb1fb310-3bac-4167-9c72-485ebd3c2bd6/scratchpad/zarith_olly \
#     bash run_ocaml_bench_gc_sweep.sh
# =============================================================================

includes:
  - "../base/ocaml/macro_base.yml"

overrides:
  invocations: 1
  # Replace the whole benchmarks selection: only the four zarith rungs run.
  benchmarks:
    macro-zarith:
      - zarith_pi_small
      - zarith_pi_default
      - zarith_pi_large
      - zarith_pi_huge

# Top-level suites combine() into the base via dict .update(): this replaces the
# base's macro-zarith suite (single zarith_pi args:15000) with the 4-rung ladder.
suites:
  macro-zarith:
    type: OCamlBenchmarkSuite
    timeout: 900
    programs:
      # Kept only so the base's tag refs (off_heap_accounting / custom_block_
      # finalisation / ffi_bulk -> zarith_pi) still validate. NOT in the run
      # list below, so it does not execute. (Persist step must retarget those
      # tags to the rung names.)
      zarith_pi:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/zarith"
        build_script: "zarith.build.sh"
        args: "15000"
      zarith_pi_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/zarith"
        build_script: "zarith.build.sh"
        args: "22000"
      zarith_pi_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/zarith"
        build_script: "zarith.build.sh"
        args: "38000"
      zarith_pi_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/zarith"
        build_script: "zarith.build.sh"
        args: "106000"
      zarith_pi_huge:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/zarith"
        build_script: "zarith.build.sh"
        args: "180000"

runtimes:
  ocaml-5.5.0:
    type: OCaml
    version: "5.5.0"
    olly_ref: "main"

configs:
  - "ocaml-5.5.0|perf_grp1|re-25|md-2"
