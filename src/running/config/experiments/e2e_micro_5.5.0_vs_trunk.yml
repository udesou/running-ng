# End-to-end pipeline check on the full micro suite: OCaml 5.5.0 vs pinned trunk, 1
# invocation per cell (plumbing, not a measurement). Includes micro_base.yml.
# Cheap gate first: bash ~/benches/scripts/test-runtimes.sh 5.5.0 trunk-c0f8c8ce
# Run: RUNNING_BENCH_DIR=~/benches CONFIG_FILE=<this file> \
#      LOG_DIR=~/running-ng/gc-sweep-logs-e2e-micro bash run_ocaml_bench_gc_sweep.sh

includes:
  - "../base/ocaml/micro_base.yml"

schema_version: "1.0"
remote_host: null
compress_logs: false
minheap_multiplier: 1.0
heap_range: 6
spread_factor: 1

plugins:
  zulip:
    type: Zulip
    request:
      type: private
      to: [361443]

overrides:
  invocations: 1

runtimes:
  # Release tag; switch running-ng-ocaml-5.5.0.
  ocaml-5.5.0:
    type: OCaml
    version: "5.5.0"

  # ocaml/ocaml trunk HEAD as of 2026-08-05, the commit the macro e2e config pins.
  ocaml-trunk-c0f8c8ce:
    type: OCaml
    commit: "c0f8c8ceef751fb3a99652d3d52399db3d1c2aae"

configs:
  - "ocaml-5.5.0|perf_grp1|re-25|md-2"
  - "ocaml-trunk-c0f8c8ce|perf_grp1|re-25|md-2"

comparisons:
  - label: "5.5.0 -> trunk"
    a: ocaml-5.5.0
    b: [ocaml-trunk-c0f8c8ce]
