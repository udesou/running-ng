# FP x Flambda sweep on macrobenchmarks: four builds of OCaml 5.4.1 (stock, -fp,
# -flambda, -fp-flambda) at default GC params. Includes macro_base.yml.
# Run: RUNNING_MACRO_BENCH_DIR=~/macro-benches CONFIG_FILE=<this file> bash run_ocaml_bench_gc_sweep.sh

includes:
  - "../base/ocaml/macro_base.yml"

runtimes:
  ocaml-5.4.1:
    type: OCaml
    version: "5.4.1"
  ocaml-5.4.1-fp:
    type: OCaml
    version: "5.4.1"
    configure_args: ["--enable-frame-pointers"]
  ocaml-5.4.1-flambda:
    type: OCaml
    version: "5.4.1"
    configure_args: ["--enable-flambda"]
  ocaml-5.4.1-fp-flambda:
    type: OCaml
    version: "5.4.1"
    configure_args: ["--enable-frame-pointers", "--enable-flambda"]

configs:
  - "ocaml-5.4.1|perf_grp1|re_par-22|md_par-8|pin_lavyek"
  - "ocaml-5.4.1-fp|perf_grp1|re_par-22|md_par-8|pin_lavyek"
  - "ocaml-5.4.1-flambda|perf_grp1|re_par-22|md_par-8|pin_lavyek"
  - "ocaml-5.4.1-fp-flambda|perf_grp1|re_par-22|md_par-8|pin_lavyek"
