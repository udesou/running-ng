# olly pass — coq 3-rung numeral ladder, OCaml 5.5.0 (1 inv).
# Size axis = make_tree depth (unary-nat kernel reduction). Rungs in macro_base.yml
# (suite macro-coq-monorepo, timeout 900):
#   coqc_tree_small   D=17  ~5s   0.6GB
#   coqc_tree_default D=18  ~19s  1.03GB
#   coqc_tree_large   D=19  ~68s  1.98GB
includes:
  - "../base/ocaml/macro_base.yml"
overrides:
  invocations: 1
  benchmarks:
    macro-coq-monorepo:
      - coqc_tree_small
      - coqc_tree_default
      - coqc_tree_large
runtimes:
  ocaml-5.5.0:
    type: OCaml
    version: "5.5.0"
    olly_ref: "main"
configs:
  - "ocaml-5.5.0|perf_grp1|re-25|md-2"
