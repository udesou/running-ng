# =============================================================================
# Knob-A olly pass — frama-c 3-rung precision ladder on OCaml 5.5.0 (single inv)
# =============================================================================
# gc%/pause + max_rss_kb_excl_ring capture for the settled frama-c rungs
# (Knob A = -eva-precision on the sqlite workload, passed as the 2nd wrapper
# arg "sqlite N").  NOT a regression comparison — single runtime, invocations:1.
#
# Rungs already live in base/ocaml/macro_base.yml (suite macro-frama-c-monorepo,
# timeout 600):
#   frama_c_eva_sqlite_small   (precision 0)  ~7s   / 457MB
#   frama_c_eva_sqlite_default (precision 2)  ~18s  / 641MB
#   frama_c_eva_sqlite_large   (precision 3)  ~124s / 695MB   (timeout 600 > large)
# No huge rung — precision saturates ~730MB and no EVA knob reaches >5min
# (see docs/benchmarks/frama-c.md). t.c / legacy sqlite excluded from this run.
#
# Usage:
#   cd ~/running-ng
#   OLLY_DIR=~/runtime_events_tools \
#   RUNNING_MACRO_BENCH_DIR=~/macro-benches \
#   CONFIG_FILE=src/running/config/experiments/frama_c_knob_a_5.5.0.yml \
#   LOG_DIR=/tmp/claude-1001/-home-udesou/0be6b255-53c7-455c-805e-9ca3aee89314/scratchpad/framac_olly \
#     bash run_ocaml_bench_gc_sweep.sh
# =============================================================================

includes:
  - "../base/ocaml/macro_base.yml"

overrides:
  invocations: 1
  # Replaces the whole benchmarks selection: only the three frama-c rungs run.
  benchmarks:
    macro-frama-c-monorepo:
      - frama_c_eva_sqlite_small
      - frama_c_eva_sqlite_default
      - frama_c_eva_sqlite_large

runtimes:
  ocaml-5.5.0:
    type: OCaml
    version: "5.5.0"
    olly_ref: "main"

configs:
  - "ocaml-5.5.0|perf_grp1|re-25|md-2"
