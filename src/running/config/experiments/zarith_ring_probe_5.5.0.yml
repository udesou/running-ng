# Ring-size probe: does olly max_rss scale with the runtime_events ring (e=N)?
# Runs zarith small (22000 digits, ~5.5s) under default ring + e=24/25/26,
# capturing olly max_rss, lost events, gc%. Compare against /usr/bin/time
# footprint (~8.7 MB, ring-free).
#   cd ~/running-ng
#   OLLY_DIR=~/runtime_events_tools RUNNING_MACRO_BENCH_DIR=~/macro-benches \
#   CONFIG_FILE=src/running/config/experiments/zarith_ring_probe_5.5.0.yml \
#   LOG_DIR=/tmp/claude-1001/-home-udesou/eb1fb310-3bac-4167-9c72-485ebd3c2bd6/scratchpad/zarith_ring \
#     bash run_ocaml_bench_gc_sweep.sh
includes:
  - "../base/ocaml/macro_base.yml"

overrides:
  invocations: 1
  benchmarks:
    macro-zarith:
      - zarith_pi_small

runtimes:
  ocaml-5.5.0:
    type: OCaml
    version: "5.5.0"
    olly_ref: "main"

configs:
  - "ocaml-5.5.0|perf_grp1|md-2"        # default ring (no re; olly/OCaml default)
  - "ocaml-5.5.0|perf_grp1|re-24|md-2"  # 2^24
  - "ocaml-5.5.0|perf_grp1|re-25|md-2"  # 2^25 (our standard)
  - "ocaml-5.5.0|perf_grp1|re-26|md-2"  # 2^26
