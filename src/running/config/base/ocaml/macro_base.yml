# Macrobenchmark base: shared suites, modifiers, benchmark lists and tags for every
# OCaml macrobenchmark experiment. Experiments include it with
#   includes: ["../base/ocaml/macro_base.yml"]
# and supply their own `runtimes` and `configs`; change base scalars via `overrides:`.
# Run: running-env/bin/python -m running runbms LOG_DIR <experiment>.yml
#
# Needs ~/macro-benches populated (duniverse/, vendor/, benchmarks/<tool>/ inputs) and
# RUNNING_MACRO_BENCH_DIR set.
#
# A config that enables macro-lavyek-monorepo (disabled below) must add
# `|re_par-22|md_par-8|pin_lavyek` to every config string; see the lavyek suite and
# the re_par/md_par modifiers.

# Applied to every config before its own modifiers; naming one again is harmless.
default_modifiers:
  - pin_bench
  - pin_bench_mc

# Inherited by every including config; a top-level redeclaration in an experiment is
# a combine() TypeError, use overrides:.
# schema_version emits contract/{manifest.json,measurements/} inline during runbms.
# compress_logs must stay false: absent it defaults to true and gzips every sidecar.
invocations: 3
schema_version: "1.0"
compress_logs: false

# No plugins here: they would force every including config to install the plugin deps.

# Suites
suites:
  macro-menhir-monorepo:
    type: OCamlBenchmarkSuite
    # Event rate overflows olly's default runtime_events ring. d=2 is load-bearing:
    # the ring is max_domains * 2^e, so e=25 at the default d=128 needs ~4GB and
    # aborts ("olly internal error"); d=2 bounds it to ~64MB.
    ocamlrunparam: "e=25,d=2"
    timeout: 600
    programs:
      menhir_ocamly:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir"
        build_script: "menhir.build.sh"
        # --canonical (full LR(1)) is ~80x the LALR work; sql_parser/sysver use other algorithms.
        args: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir/ocaml.mly --list-errors --no-stdlib --canonical"
      menhir_sql_parser:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir"
        build_script: "menhir.build.sh"
        args: "-v -t ${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir/keywords.mly ${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir/sql-parser.mly --base sql-parser"
      menhir_sysver:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir"
        build_script: "menhir.build.sh"
        args: "-v --table ${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir/sysver.mly"
      # Size ladder: small=menhir_sysver, default=menhir_ocamly, large=menhir_sysver_canonical.
      # menhir has no in-process loop, so input size is the only knob.
      menhir_sysver_canonical:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir"
        build_script: "menhir.build.sh"
        args: "--canonical --table ${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir/sysver.mly"

  macro-cpdf-monorepo:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      cpdf_merge:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf"
        build_script: "cpdf.build.sh"
        args: "-merge ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig -o /dev/null"
      cpdf_blacktext:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf"
        build_script: "cpdf.build.sh"
        args: "-blacktext ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig -o /dev/null"
      cpdf_scale:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf"
        build_script: "cpdf.build.sh"
        args: "scale-to-fit a4landscape -twoup ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig -o /dev/null"
      cpdf_squeeze:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf"
        build_script: "cpdf.build.sh"
        args: "-squeeze ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig -o /dev/null"
      # Squeeze ladder: arg = number of input-PDF copies merged then recompressed (wrapper from cpdf.build.sh).
      cpdf_squeeze_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf"
        build_script: "cpdf.build.sh"
        args: "8"
      cpdf_squeeze_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf"
        build_script: "cpdf.build.sh"
        args: "24"
      cpdf_squeeze_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf"
        build_script: "cpdf.build.sh"
        args: "64"

  macro-alt-ergo-monorepo:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      alt_ergo_fill:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo"
        build_script: "alt-ergo.build.sh"
        # fill_x100.why is generated by alt-ergo.build.sh (fill.why's goal replicated 100 times).
        args: "--input native ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/fill_x100.why"
      alt_ergo_yyll:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo"
        build_script: "alt-ergo.build.sh"
        args: "--input native ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/yyll.why"
      # Chain ladder: alt-ergo.build.sh generates alt_ergo_chain_<rung>.why, one N-term
      # congruence chain solved in a single goal (cost ~N^2.2).
      alt_ergo_chain_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo"
        build_script: "alt-ergo.build.sh"
        args: "--input native ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/alt_ergo_chain_small.why"
      alt_ergo_chain_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo"
        build_script: "alt-ergo.build.sh"
        args: "--input native ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/alt_ergo_chain_default.why"
      alt_ergo_chain_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo"
        build_script: "alt-ergo.build.sh"
        args: "--input native ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/alt_ergo_chain_large.why"
      alt_ergo_unsat_smt2:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo"
        build_script: "alt-ergo.build.sh"
        args: "--timelimit 15 ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/unsat.smt2"
        # --timelimit kills the process with SIGVTALRM every run (exit 142) by design;
        # without expected_exit the runner counts it as a crash and the contract emitter
        # drops the invocation. Keep in sync with macro-benches benchmarks/manifest.yml.
        expected_exit: 142

  # Wrapper arg selects the workload: "t" (zlib t.c) or "sqlite [precision]" (SQLite
  # amalgamation, the ocaml#11733 ephemeron reproducer). Ladder axis is -eva-precision;
  # -eva-slevel measured flat. Bare "sqlite" == precision 0 == the _small rung.
  macro-frama-c-monorepo:
    type: OCamlBenchmarkSuite
    timeout: 600
    programs:
      frama_c_eva_t:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/frama-c"
        build_script: "frama-c.build.sh"
        args: "t"
      frama_c_eva_sqlite:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/frama-c"
        build_script: "frama-c.build.sh"
        args: "sqlite"
      frama_c_eva_sqlite_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/frama-c"
        build_script: "frama-c.build.sh"
        args: "sqlite 0"
      frama_c_eva_sqlite_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/frama-c"
        build_script: "frama-c.build.sh"
        args: "sqlite 2"
      frama_c_eva_sqlite_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/frama-c"
        build_script: "frama-c.build.sh"
        args: "sqlite 3"

  macro-goblint-monorepo:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      goblint:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/goblint"
        build_script: "goblint.build.sh"
        args: ""
      # goblint is the frozen ocaml#13733 reproducer. goblint_gen_* analyse a generated
      # Btor2C-style state machine; goblint.build.sh bakes N per rung, hence no args.
      goblint_gen_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/goblint"
        build_script: "goblint.build.sh"
        args: ""
      goblint_gen_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/goblint"
        build_script: "goblint.build.sh"
        args: ""
      goblint_gen_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/goblint"
        build_script: "goblint.build.sh"
        args: ""

  macro-infer-monorepo:
    type: OCamlBenchmarkSuite
    timeout: 600
    programs:
      # Rung (roots_<rung>.idx) is baked into the wrapper by infer.build.sh; INFER_JOBS
      # sets the --multicore domain count (default 12). ocamlrunparam overrides re/md:
      # d=2 fails Domain.spawn ("failed to allocate domain"), e>=22 segfaults the
      # multi-domain process on 5.5.0, e<18 loses olly events on the large rung.
      infer_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/infer"
        build_script: "infer.build.sh"
        args: ""
        ocamlrunparam: "e=18,d=128"
      infer_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/infer"
        build_script: "infer.build.sh"
        args: ""
        ocamlrunparam: "e=18,d=128"
      infer_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/infer"
        build_script: "infer.build.sh"
        args: ""
        ocamlrunparam: "e=18,d=128"

  # coqc_tree_* reduce a 2^D-deep unary nat (D=17/18/19); work roughly doubles per step.
  macro-coq-monorepo:
    type: OCamlBenchmarkSuite
    ocamlrunparam: "e=25,d=2"   # ring overflows under olly; see macro-menhir-monorepo
    timeout: 900
    programs:
      coqc_corelib_stress:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq"
        build_script: "coq.build.sh"
        args: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq/coq_corelib_stress.v"
      coqc_tree_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq"
        build_script: "coq.build.sh"
        args: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq/coq_tree_small.v"
      coqc_tree_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq"
        build_script: "coq.build.sh"
        args: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq/coq_tree_default.v"
      coqc_tree_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq"
        build_script: "coq.build.sh"
        args: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq/coq_tree_large.v"

  macro-devkit:
    type: OCamlBenchmarkSuite
    timeout: 600
    programs:
      devkit_htmlstream:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ahrefs-devkit"
        build_script: "ahrefs-devkit.build.sh"
        args: ""
      # devkit_htmlstream_*: arg scales per-document content; arg=1 == the frozen devkit_htmlstream.
      devkit_htmlstream_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ahrefs-devkit"
        build_script: "ahrefs-devkit.build.sh"
        args: "1"
      devkit_htmlstream_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ahrefs-devkit"
        build_script: "ahrefs-devkit.build.sh"
        args: "3"
      devkit_htmlstream_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ahrefs-devkit"
        build_script: "ahrefs-devkit.build.sh"
        args: "8"
      devkit_stre:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ahrefs-devkit"
        build_script: "ahrefs-devkit.build.sh"
        # arg = in-process loop count (Sys.argv.(1)).
        args: "30"
      devkit_network:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ahrefs-devkit"
        build_script: "ahrefs-devkit.build.sh"
        # arg = in-process loop count.
        args: "4"
      devkit_gzip:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ahrefs-devkit"
        build_script: "ahrefs-devkit.build.sh"
        # arg = in-process loop count.
        args: "5"

  macro-irmin:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      # args = "n_keys n_ops read_pct total_ops". irmin_mem_rw_* scale n_keys (the write
      # phase is O(n_keys^2) on the flat root node); a churn ladder, RSS stays <100MB.
      irmin_mem_rw:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/irmin"
        build_script: "irmin.build.sh"
        args: "3000 10000 80 20000"
      irmin_mem_rw_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/irmin"
        build_script: "irmin.build.sh"
        args: "6000 0 50 1000"
      irmin_mem_rw_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/irmin"
        build_script: "irmin.build.sh"
        args: "10000 0 50 1000"
      irmin_mem_rw_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/irmin"
        build_script: "irmin.build.sh"
        args: "18000 0 50 1000"

  # wl_<N>x.ml inputs are generated (gitignored) by ocamlformat.build.sh: workload.ml x N.
  macro-ocamlformat:
    type: OCamlBenchmarkSuite
    timeout: 600
    programs:
      ocamlformat_rocq:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlformat"
        build_script: "ocamlformat.build.sh"
        args: "--impl ${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlformat/workload_5x.ml -o /dev/null"
      ocamlformat_rocq_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlformat"
        build_script: "ocamlformat.build.sh"
        args: "--impl ${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlformat/wl_12x.ml -o /dev/null"
      ocamlformat_rocq_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlformat"
        build_script: "ocamlformat.build.sh"
        args: "--impl ${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlformat/wl_30x.ml -o /dev/null"
      ocamlformat_rocq_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlformat"
        build_script: "ocamlformat.build.sh"
        args: "--impl ${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlformat/wl_150x.ml -o /dev/null"

  # args = "$ITERATIONS $DATA_SIZE" (payload bytes, random data).
  macro-decompress:
    type: OCamlBenchmarkSuite
    ocamlrunparam: "e=25,d=2"   # ring overflows under olly; see macro-menhir-monorepo
    timeout: 300
    programs:
      test_decompress:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/decompress"
        build_script: "decompress.build.sh"
        args: "64 524288"
      test_decompress_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/decompress"
        build_script: "decompress.build.sh"
        args: "1 83886080"
      test_decompress_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/decompress"
        build_script: "decompress.build.sh"
        args: "1 268435456"
      test_decompress_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/decompress"
        build_script: "decompress.build.sh"
        args: "1 1073741824"

  # Requires OCaml >= 5.2.
  macro-eio:
    type: OCamlBenchmarkSuite
    ocamlrunparam: "e=25,d=2"   # ring overflows under olly; see macro-menhir-monorepo
    # Sized for the slowest fleet machine (obelisk, 5-9x slower than the 9950X reference).
    timeout: 300
    programs:
      eio_fiber_stream:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/eio"
        build_script: "eio.build.sh"
        args: ""
      # eio_conc_*: arg = producer/consumer fiber pairs (eio.build.sh picks the driver by
      # output name); the live set grows with it.
      eio_conc_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/eio"
        build_script: "eio.build.sh"
        args: "3000"
      eio_conc_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/eio"
        build_script: "eio.build.sh"
        args: "9000"
      eio_conc_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/eio"
        build_script: "eio.build.sh"
        args: "21000"

  # arg = generated line count; the token list is retained, so RSS grows ~linearly (28GB at 20M).
  macro-sedlex:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      sedlex_tokenize:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/sedlex"
        build_script: "sedlex.build.sh"
        args: "700000"
      sedlex_tokenize_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/sedlex"
        build_script: "sedlex.build.sh"
        args: "2000000"
      sedlex_tokenize_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/sedlex"
        build_script: "sedlex.build.sh"
        args: "6000000"
      sedlex_tokenize_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/sedlex"
        build_script: "sedlex.build.sh"
        args: "20000000"

  # args = "$ITERATIONS $DOC"; $DOC is a file path or an integer record count generated
  # in-process. The large rung needs ~20GB RAM.
  macro-yojson:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      ydump_repeat:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/yojson"
        build_script: "yojson.build.sh"
        args: "1000 ${RUNNING_MACRO_BENCH_DIR}/benchmarks/yojson/sample.json"
      ydump_repeat_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/yojson"
        build_script: "yojson.build.sh"
        args: "1 2000000"
      ydump_repeat_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/yojson"
        build_script: "yojson.build.sh"
        args: "1 6000000"
      ydump_repeat_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/yojson"
        build_script: "yojson.build.sh"
        args: "1 12000000"

  macro-zarith:
    type: OCamlBenchmarkSuite
    ocamlrunparam: "e=25,d=2"   # heaviest ring user; see macro-menhir-monorepo
    timeout: 900   # for the huge rung
    programs:
      # Legacy input; tag references resolve to it.
      zarith_pi:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/zarith"
        build_script: "zarith.build.sh"
        args: "15000"
      # arg = digits of pi.
      zarith_pi_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/zarith"
        build_script: "zarith.build.sh"
        args: "22000"
      zarith_pi_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/zarith"
        build_script: "zarith.build.sh"
        args: "38000"
      zarith_pi_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/zarith"
        build_script: "zarith.build.sh"
        args: "106000"
      zarith_pi_huge:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/zarith"
        build_script: "zarith.build.sh"
        args: "180000"

  # Wrapper args = "$LOOP $DIM". owl_gc_* use loop=1 and scale the matrix dim; the live
  # set is off-heap Bigarrays, so read RSS not top_heap. Wall is BLAS-thread-bound.
  macro-owl:
    type: OCamlBenchmarkSuite
    timeout: 900
    programs:
      owl_gc:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/owl"
        build_script: "owl.build.sh"
        # arg = in-process loop count. Needs a ring >= re-25: re-23 overflows on 5+
        # iterations, olly loses events and wall_time is corrupted.
        args: "6"
      # Rung walls are from the 9950X; obelisk is 11-23x slower on owl, so size timeouts
      # from a measurement on the target machine.
      owl_gc_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/owl"
        build_script: "owl.build.sh"
        args: "1 300"
      owl_gc_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/owl"
        build_script: "owl.build.sh"
        args: "1 500"
      owl_gc_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/owl"
        build_script: "owl.build.sh"
        args: "1 1500"
      owl_gc_huge:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/owl"
        build_script: "owl.build.sh"
        args: "1 2400"

  # Runs the variant's own ocamlc on a generated ~400k-line workload. Bytecode rather
  # than ocamlopt so the workload is identical across flambda/non-flambda variants.
  macro-ocamlc-self-compile:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      # REPLICAS default 30; OCAMLC_SELF_COMPILE_REPLICAS=130 at build time gives the ~15s/4GB rung.
      ocamlc_self_compile:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlc-self-compile"
        build_script: "ocamlc-self-compile.build.sh"
        args: ""
      # ocamlc compiling uucp: small collected heap, active major GC (the opposite of ocamlc_self_compile).
      ocamlc_compile_uucp:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlc-compile-uucp"
        build_script: "ocamlc-compile-uucp.build.sh"
        args: ""
      # Replica count (3/8/25) is baked per rung by ocamlc-compile-uucp.build.sh, hence no args.
      ocamlc_compile_uucp_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlc-compile-uucp"
        build_script: "ocamlc-compile-uucp.build.sh"
        args: ""
      ocamlc_compile_uucp_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlc-compile-uucp"
        build_script: "ocamlc-compile-uucp.build.sh"
        args: ""
      ocamlc_compile_uucp_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlc-compile-uucp"
        build_script: "ocamlc-compile-uucp.build.sh"
        args: ""

  # args = "$ITERATIONS [$UNITS]"; the ladder runs 1 iteration of a generated $UNITS-unit
  # script (super-quadratic in units).
  macro-liquidsoap-lang:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      liq_parse_typecheck:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/liquidsoap-lang"
        build_script: "liquidsoap-lang.build.sh"
        args: "50000"
      liq_parse_typecheck_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/liquidsoap-lang"
        build_script: "liquidsoap-lang.build.sh"
        args: "1 4000"
      liq_parse_typecheck_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/liquidsoap-lang"
        build_script: "liquidsoap-lang.build.sh"
        args: "1 6500"
      liq_parse_typecheck_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/liquidsoap-lang"
        build_script: "liquidsoap-lang.build.sh"
        args: "1 12000"

  # In-process replica of merlin's cram bench (7 IDE queries, main + typer domain);
  # arg = loop count. Requires OCaml 5.5+: the merlin-domains vendored typer asserts on
  # 5.4.1 and earlier, so set `benchmarks.macro-merlin: []` in multi-version sweeps.
  macro-merlin:
    type: OCamlBenchmarkSuite
    timeout: 180
    programs:
      merlin_bench:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/merlin"
        build_script: "merlin.build.sh"
        args: "4"

  # Compiles the runtime's own ocamlc.byte (arg "") or a generated per-runtime .byte
  # (arg small/default/large, built by jsoo.build.sh). Vendored from jsoo's `ocaml-5.6`
  # branch (ocsigen/js_of_ocaml#2227): 6.2.0 rejects OCaml >= 5.5. Needs Cmdliner 2.0+.
  macro-jsoo:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      jsoo:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/js_of_ocaml"
        build_script: "jsoo.build.sh"
        args: ""
      jsoo_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/js_of_ocaml"
        build_script: "jsoo.build.sh"
        args: "small"
      jsoo_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/js_of_ocaml"
        build_script: "jsoo.build.sh"
        args: "default"
      jsoo_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/js_of_ocaml"
        build_script: "jsoo.build.sh"
        args: "large"

  # Reproducer for the ocaml/ocaml#13123 / #14533 pacer pattern (custom_major_ratio):
  # pooled off-heap YUV420 Bigarray frames plus LIQ_DW_MB of heap deadweight. Env knobs
  # (LIQ_POOL, LIQ_CHURN, LIQ_PACE_FPS) are documented in liq_video_frames.ml.
  macro-liq-video-frames:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      # args = "n_frames [width height]"; the ladder fixes 15000 frames and scales the
      # resolution. Off-heap: read major-cycle counts, not RSS/top_heap.
      liq_video_frames_pool:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/liq-video-frames"
        build_script: "liq-video-frames.build.sh"
        args: "30000"
      liq_video_frames_pool_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/liq-video-frames"
        build_script: "liq-video-frames.build.sh"
        args: "15000 1920 1080"
      liq_video_frames_pool_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/liq-video-frames"
        build_script: "liq-video-frames.build.sh"
        args: "15000 3840 2160"
      liq_video_frames_pool_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/liq-video-frames"
        build_script: "liq-video-frames.build.sh"
        args: "15000 7680 4320"

  macro-pplacer:
    type: OCamlBenchmarkSuite
    # Sized for obelisk (~9x slower than the 9950X reference).
    timeout: 600
    programs:
      pplacer_testsuite:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/pplacer"
        build_script: "pplacer.build.sh"
        # arg = loop count (PPLACER_TEST_LOOP); the whole suite runs in one process.
        args: "5"
      # arg = alignment replication factor. Likelihood vectors are off-heap (GSL), so read
      # RSS/allocated_words rather than top_heap.
      pplacer_like_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/pplacer"
        build_script: "pplacer.build.sh"
        args: "8"
      pplacer_like_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/pplacer"
        build_script: "pplacer.build.sh"
        args: "25"
      pplacer_like_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/pplacer"
        build_script: "pplacer.build.sh"
        args: "85"

  # Multi-domain KV store (Eio + io_uring); all cells share one 10M-op budget. Worker
  # domains pin themselves via ocaml-processor; pin_lavyek fences the helper threads.
  # Enabling it needs |re_par-22|md_par-8|pin_lavyek in every config string (bare
  # re_par/md_par render `e={0}`/`d={0}` and break OCAMLRUNPARAM), else the default
  # ring overflows and wall_time goes negative. required_modifiers is documentation
  # only; running-ng does not check it.
  macro-lavyek-monorepo:
    type: OCamlBenchmarkSuite
    timeout: 120
    required_modifiers: [re_par, md_par, pin_lavyek]
    programs:
      lavyek_kv_1d:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek"
        build_script: "lavyek.build.sh"
        args: "1 100 10000000 ${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek/wal/lavyek_wal_1d"
      lavyek_kv_2d:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek"
        build_script: "lavyek.build.sh"
        args: "2 100 10000000 ${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek/wal/lavyek_wal_2d"
      lavyek_kv_4d:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek"
        build_script: "lavyek.build.sh"
        args: "4 100 10000000 ${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek/wal/lavyek_wal_4d"
      lavyek_kv_8d:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek"
        build_script: "lavyek.build.sh"
        args: "8 100 10000000 ${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek/wal/lavyek_wal_8d"

# Modifiers
modifiers:
  time_stats:
    type: Wrapper
    val: "/usr/bin/time -f \"%Uuser %Ssystem %eelapsed %PCPU (%Xavgtext+%Davgdata %Mmaxresident)k\""
  gc_verbose:
    type: OCamlRunParam
    val: "v=0x400"
  # runtime_events ring: e = log2 words per domain, d = max domains; file size is
  # d * 2^e * 8 bytes. re/md apply to sequential suites, re_par/md_par to lavyek only
  # (routed by the shared excludes anchors). re-25|md-2 is 512MB; lavyek uses
  # re-22|md-8 (md-8|re-25 would be 2GB, at the ftruncate boundary).
  re:
    type: OCamlRunParam
    val: "e={0}"
    excludes: &lavyek_only_excludes
      macro-lavyek-monorepo:
        - lavyek_kv_1d
        - lavyek_kv_2d
        - lavyek_kv_4d
        - lavyek_kv_8d
  md:
    type: OCamlRunParam
    val: "d={0}"
    excludes: *lavyek_only_excludes
  # Name-value modifiers so gc_plan/gc_threads reach the contract and each plan gets
  # its own config_id (the old flag modifiers mmtk_bactrian/mmtk_lxr do not).
  plan:
    type: EnvVar
    var: "MMTK_PLAN"
    val: "{0}"
  threads:
    type: EnvVar
    var: "MMTK_THREADS"
    val: "{0}"
  # Lavyek-only counterparts of re/md.
  re_par:
    type: OCamlRunParam
    val: "e={0}"
    excludes: &non_lavyek_excludes
      macro-menhir-monorepo: [menhir_ocamly, menhir_sql_parser, menhir_sysver]
      macro-cpdf-monorepo: [cpdf_merge, cpdf_blacktext, cpdf_scale, cpdf_squeeze]
      macro-alt-ergo-monorepo: [alt_ergo_fill, alt_ergo_yyll, alt_ergo_unsat_smt2]
      macro-coq-monorepo: [coqc_corelib_stress]
      macro-devkit: [devkit_htmlstream, devkit_stre, devkit_network, devkit_gzip]
      macro-irmin: [irmin_mem_rw]
      macro-ocamlformat: [ocamlformat_rocq]
      macro-decompress: [test_decompress]
      macro-eio: [eio_fiber_stream]
      macro-sedlex: [sedlex_tokenize]
      macro-yojson: [ydump_repeat]
      macro-zarith: [zarith_pi]
      macro-owl: [owl_gc]
      macro-ocamlc-self-compile: [ocamlc_self_compile]
      macro-liquidsoap-lang: [liq_parse_typecheck]
      macro-merlin: [merlin_bench]
      macro-jsoo: [jsoo]
      macro-liq-video-frames: [liq_video_frames_pool]
      macro-pplacer: [pplacer_testsuite]
  md_par:
    type: OCamlRunParam
    val: "d={0}"
    excludes: *non_lavyek_excludes
  # Confines lavyek's helper threads (spawned before the bench pins its own domains) to
  # the worker cores. CpuPin derives CPUs from the machine: one hardware thread per
  # physical core, taskset -c on Linux, cpuset -l on FreeBSD. val = physical cores
  # taken from the benchmark for olly and the counter tool (0: they get the SMT
  # siblings); changing it changes the measurement. one_node: one NUMA node (no-op
  # on a single socket).
  pin_lavyek:
    type: CpuPin
    val: "0"
    one_node: true
    excludes: *non_lavyek_excludes
  # Pins a single-threaded benchmark to one core of the benchmark set (the isolcpus=
  # set where the machine isolates cores, else CpuPin's topology policy); one named
  # core makes placement identical across runs (sedlex spread 26s -> 0.3s). Not for
  # multi-domain benchmarks: the scheduler does not balance among isolated CPUs, so an
  # unpinned multi-domain process collapses onto one (infer: 72% slower). lavyek and
  # infer use pin_lavyek / pin_bench_mc instead.
  pin_bench:
    type: CpuPin
    bench_cores: "1"
    excludes: &unpinnable_excludes
      macro-lavyek-monorepo:
        - lavyek_kv_1d
        - lavyek_kv_2d
        - lavyek_kv_4d
        - lavyek_kv_8d
      macro-infer-monorepo:
        - infer_small
        - infer_default
        - infer_large
  # Whole benchmark core set, for benchmarks that place their own domains from the
  # inherited mask (infer: vendor-infer.sh patches DomainPool.child). Uses `includes`
  # to avoid a second copy of non_lavyek_excludes. lavyek pins from the machine
  # topology instead, so it goes through pin_lavyek.
  pin_bench_mc:
    type: CpuPin
    includes:
      macro-infer-monorepo:
        - infer_small
        - infer_default
        - infer_large
  perf_grp1:
    type: PerfAndOllyAttach
    val: "task-clock,page-faults,cycles,instructions"
    # hwpmc event names, used instead of val on FreeBSD.
    val_freebsd: "instructions,unhalted-cycles,PAGE_FAULT.ALL"
  perf_grp2:
    type: PerfAndOllyAttach
    val: "task-clock,cycles,stalled-cycles-frontend,stalled-cycles-backend"
    val_freebsd: "instructions,unhalted-cycles,idq_uops_not_delivered.core,resource_stalls.any"
  perf_grp3:
    type: PerfAndOllyAttach
    val: "task-clock,cycles,cache-misses,LLC-load-misses,dTLB-load-misses,iTLB-load-misses"
    val_freebsd: "instructions,unhalted-cycles,longest_lat_cache.miss,mem_load_uops_retired.l3_miss,dtlb_load_misses.walk_completed,itlb_misses.walk_completed"
  # FreeBSD groups: pmcstat is all-or-nothing (one unresolvable name exits 71 with no
  # output) and only `instructions` of the Linux names resolves, so separate groups
  # keep the config string honest about what ran. Ceiling is 7 events (3 fixed + 4
  # programmable with SMT on) and hwpmc never multiplexes, it fails instead.
  # task-clock has no exact equivalent and is dropped (olly cpu_time covers it);
  # page-faults maps to the soft PMC PAGE_FAULT.ALL, which costs no hardware counter.
  # PmcStatBackend.EVENT_ALIASES canonicalises `unhalted-cycles` to `cycles`.
  perf_grp1_freebsd:
    type: PerfAndOllyAttach
    val: "instructions,unhalted-cycles,PAGE_FAULT.ALL"
  # Approximations of perf's stalled-cycles-*; not comparable with Linux numbers.
  perf_grp2_freebsd:
    type: PerfAndOllyAttach
    val: "instructions,unhalted-cycles,idq_uops_not_delivered.core,resource_stalls.any"
  # mem_load_uops_retired.l3_miss counts retired load uops, not requests: not comparable
  # with Linux LLC-load-misses. Do not add llc-misses: same counter as
  # longest_lat_cache.miss and it would burn one of four programmable slots (group is at the ceiling).
  perf_grp3_freebsd:
    type: PerfAndOllyAttach
    val: "instructions,unhalted-cycles,longest_lat_cache.miss,mem_load_uops_retired.l3_miss,dtlb_load_misses.walk_completed,itlb_misses.walk_completed"
  # Needs the binary to call Memtrace.trace_if_requested (); macro-benches patches only
  # test_decompress. excludes is not a guard: an unpatched benchmark silently produces
  # no trace (runbms warns "memtrace was requested but the benchmark produced no trace").
  # Keep the list in sync when patching more benchmarks.
  memtrace_grp1:
    type: MemtraceAttach
    excludes: &non_decompress_excludes
      macro-menhir-monorepo: [menhir_ocamly, menhir_sql_parser, menhir_sysver]
      macro-cpdf-monorepo: [cpdf_merge, cpdf_blacktext, cpdf_scale, cpdf_squeeze]
      macro-alt-ergo-monorepo: [alt_ergo_fill, alt_ergo_yyll, alt_ergo_unsat_smt2]
      macro-frama-c-monorepo: [frama_c_eva_t, frama_c_eva_sqlite]
      macro-goblint-monorepo: [goblint]
      macro-infer-monorepo: [infer_small, infer_default, infer_large]
      macro-coq-monorepo: [coqc_corelib_stress]
      macro-devkit: [devkit_htmlstream, devkit_stre, devkit_network, devkit_gzip]
      macro-irmin: [irmin_mem_rw]
      macro-ocamlformat: [ocamlformat_rocq]
      macro-eio: [eio_fiber_stream]
      macro-sedlex: [sedlex_tokenize]
      macro-yojson: [ydump_repeat]
      macro-zarith: [zarith_pi]
      macro-owl: [owl_gc]
      macro-ocamlc-self-compile: [ocamlc_self_compile]
      macro-liquidsoap-lang: [liq_parse_typecheck]
      macro-merlin: [merlin_bench]
      macro-jsoo: [jsoo]
      macro-liq-video-frames: [liq_video_frames_pool]
      macro-pplacer: [pplacer_testsuite]
      macro-lavyek-monorepo: [lavyek_kv_1d, lavyek_kv_2d, lavyek_kv_4d, lavyek_kv_8d]

# Benchmarks. Per-program timeouts use the dict form {name, bm_name, timeout}; a
# `timeout:` inside a suite's programs: entry is silently dropped. Large-rung timeouts
# are sized for obelisk (Xeon E5-2667 v2, 5-9x slower than the 9950X reference); a
# timed-out invocation shows a negative wall_time in the olly sidecar.
benchmarks:
  macro-menhir-monorepo:
    - menhir_ocamly
    - menhir_sql_parser
    - menhir_sysver
    - {name: menhir_sysver_canonical, bm_name: menhir_sysver_canonical, timeout: 1200}

  macro-cpdf-monorepo:
    - cpdf_merge
    - cpdf_blacktext
    - cpdf_scale
    - cpdf_squeeze
    - cpdf_squeeze_small
    - cpdf_squeeze_default
    - {name: cpdf_squeeze_large, bm_name: cpdf_squeeze_large, timeout: 900}

  macro-alt-ergo-monorepo:
    - alt_ergo_fill
    - alt_ergo_yyll
    - alt_ergo_unsat_smt2
    - alt_ergo_chain_small
    - alt_ergo_chain_default
    - alt_ergo_chain_large

  macro-frama-c-monorepo:
    - frama_c_eva_t
    - frama_c_eva_sqlite
    - frama_c_eva_sqlite_small
    - frama_c_eva_sqlite_default
    - {name: frama_c_eva_sqlite_large, bm_name: frama_c_eva_sqlite_large, timeout: 2400}

  macro-goblint-monorepo:
    - goblint
    - goblint_gen_small
    - goblint_gen_default
    - {name: goblint_gen_large, bm_name: goblint_gen_large, timeout: 900}

  macro-infer-monorepo:
    - infer_small
    - infer_default
    - infer_large

  macro-coq-monorepo:
    - coqc_corelib_stress
    - coqc_tree_small
    - coqc_tree_default
    - coqc_tree_large

  macro-devkit:
    - devkit_htmlstream
    - devkit_stre
    - devkit_network
    - devkit_gzip
    - devkit_htmlstream_small
    - devkit_htmlstream_default
    - devkit_htmlstream_large

  macro-irmin:
    - irmin_mem_rw
    - irmin_mem_rw_small
    - irmin_mem_rw_default
    - {name: irmin_mem_rw_large, bm_name: irmin_mem_rw_large, timeout: 900}

  macro-ocamlformat:
    - ocamlformat_rocq
    - ocamlformat_rocq_small
    - ocamlformat_rocq_default
    - {name: ocamlformat_rocq_large, bm_name: ocamlformat_rocq_large, timeout: 1200}

  macro-decompress:
    - test_decompress
    - test_decompress_small
    - test_decompress_default
    - {name: test_decompress_large, bm_name: test_decompress_large, timeout: 1200}

  macro-eio:
    - eio_fiber_stream
    - eio_conc_small
    - eio_conc_default
    - {name: eio_conc_large, bm_name: eio_conc_large, timeout: 600}

  macro-sedlex:
    - sedlex_tokenize
    - sedlex_tokenize_small
    - sedlex_tokenize_default
    - {name: sedlex_tokenize_large, bm_name: sedlex_tokenize_large, timeout: 900}

  macro-yojson:
    - ydump_repeat
    - ydump_repeat_small
    - ydump_repeat_default
    - ydump_repeat_large

  macro-zarith:
    - zarith_pi
    - zarith_pi_small
    - zarith_pi_default
    - zarith_pi_large
    - zarith_pi_huge

  macro-owl:
    - owl_gc
    - owl_gc_small
    - owl_gc_default
    - {name: owl_gc_large, bm_name: owl_gc_large, timeout: 7200}
    - owl_gc_huge

  macro-ocamlc-self-compile:
    - ocamlc_self_compile
    - ocamlc_compile_uucp
    - ocamlc_compile_uucp_small
    - ocamlc_compile_uucp_default
    - {name: ocamlc_compile_uucp_large, bm_name: ocamlc_compile_uucp_large, timeout: 900}

  macro-liquidsoap-lang:
    - liq_parse_typecheck
    - liq_parse_typecheck_small
    - liq_parse_typecheck_default
    - {name: liq_parse_typecheck_large, bm_name: liq_parse_typecheck_large, timeout: 1200}

  # Disabled: merlin-domains typer race (`Invalid -> assert false` in Types.rev_log at
  # N>=2 iterations); see benchmarks/merlin/UPSTREAM_BUG.md.
  macro-merlin: []
    # - merlin_bench

  macro-jsoo:
    - jsoo
    - jsoo_small
    - jsoo_default
    - jsoo_large

  macro-liq-video-frames:
    - liq_video_frames_pool
    - liq_video_frames_pool_small
    - liq_video_frames_pool_default
    - {name: liq_video_frames_pool_large, bm_name: liq_video_frames_pool_large, timeout: 1200}

  macro-pplacer:
    - pplacer_testsuite
    - pplacer_like_small
    - pplacer_like_default
    - {name: pplacer_like_large, bm_name: pplacer_like_large, timeout: 1200}

  # Disabled: lavyek is a private repo (github.com/tarides/lavyek). Re-enabling also
  # needs the clone in macro-benches setup-monorepo.sh and |re_par-22|md_par-8|pin_lavyek
  # in every config string.
  macro-lavyek-monorepo: []
    # - lavyek_kv_1d
    # - lavyek_kv_2d
    # - lavyek_kv_4d
    # - lavyek_kv_8d

# Tags: runtime-feature classification, selected with RUNNING_TAG=<tag>[,<tag>] (union,
# intersected with benchmarks:). A bare run applies default_run. Per tag: description,
# exercised_by (hot path, selected), cold (doc only), verified_at (source citations),
# gap (required when exercised_by is empty; makes RUNNING_TAG fail loudly).
tags:

  # Input-size ladder tags
  default_run:
    description: |
      Input-size ladder — the DEFAULT rung of every tool. This is the tag a bare run
      (no RUNNING_TAG) falls back to, so `default_run` is the standard suite.
    exercised_by:
      macro-menhir-monorepo:
        - menhir_ocamly
      macro-cpdf-monorepo:
        - cpdf_squeeze_default
      macro-alt-ergo-monorepo:
        - alt_ergo_chain_default
      macro-frama-c-monorepo:
        - frama_c_eva_sqlite_default
      macro-goblint-monorepo:
        - goblint_gen_default
      macro-infer-monorepo:
        - infer_default
      macro-coq-monorepo:
        - coqc_tree_default
      macro-devkit:
        - devkit_htmlstream_default
      macro-irmin:
        - irmin_mem_rw_default
      macro-ocamlformat:
        - ocamlformat_rocq_default
      macro-decompress:
        - test_decompress_default
      macro-eio:
        - eio_conc_default
      macro-sedlex:
        - sedlex_tokenize_default
      macro-yojson:
        - ydump_repeat_default
      macro-zarith:
        - zarith_pi_default
      macro-owl:
        - owl_gc_default
      macro-ocamlc-self-compile:
        - ocamlc_compile_uucp_default
      macro-liquidsoap-lang:
        - liq_parse_typecheck_default
      macro-jsoo:
        - jsoo_default
      macro-liq-video-frames:
        - liq_video_frames_pool_default
      macro-pplacer:
        - pplacer_like_default

  small_run:
    description: |
      Input-size ladder — the SMALL rung of every tool (fast, correctness-oriented).
      This is what macro-benches CI runs. Applied automatically? No — the CI passes it
      explicitly; a bare run defaults to `default_run`.
    exercised_by:
      macro-menhir-monorepo:
        - menhir_sysver
      macro-cpdf-monorepo:
        - cpdf_squeeze_small
      macro-alt-ergo-monorepo:
        - alt_ergo_chain_small
      macro-frama-c-monorepo:
        - frama_c_eva_sqlite_small
      macro-goblint-monorepo:
        - goblint_gen_small
      macro-infer-monorepo:
        - infer_small
      macro-coq-monorepo:
        - coqc_tree_small
      macro-devkit:
        - devkit_htmlstream_small
      macro-irmin:
        - irmin_mem_rw_small
      macro-ocamlformat:
        - ocamlformat_rocq_small
      macro-decompress:
        - test_decompress_small
      macro-eio:
        - eio_conc_small
      macro-sedlex:
        - sedlex_tokenize_small
      macro-yojson:
        - ydump_repeat_small
      macro-zarith:
        - zarith_pi_small
      macro-owl:
        - owl_gc_small
      macro-ocamlc-self-compile:
