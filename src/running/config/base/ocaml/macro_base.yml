# =============================================================================
# Macrobenchmarks — BASE config
# =============================================================================
# Shared suites / benchmarks / modifiers for all macrobenchmark runs.
# Intended to be pulled in by other configs via:
#
#   includes:
#     - "./macrobenchmarks_base.yml"
#
# The base file deliberately does NOT define `runtimes` or `configs` — those
# are specific to each experiment and must be supplied by the including file.
#
# Prerequisites (monorepo):
#   - ~/macro-benches/duniverse/ populated (opam monorepo pull)
#   - ~/macro-benches/vendor/{camlpdf,cpdf-source,zarith} populated
#   - Input files in ~/macro-benches/benchmarks/<tool>/
#
# Env vars referenced by ${RUNNING_MACRO_BENCH_DIR} must be set before running.
#
# -----------------------------------------------------------------------------
# REQUIRED modifier set when including the lavyek (multi-domain) suite
# -----------------------------------------------------------------------------
# If your config's `benchmarks:` block enables `macro-lavyek-monorepo` (it is
# enabled by default in this base — opt out by setting `macro-lavyek-monorepo: []`
# in your derived config), the config-string entries MUST include the parallel
# modifier triple `|re_par-22|md_par-8|pin_lavyek` in addition to the sequential
# `|re-<N>|md-<M>` you use for everything else.
#
# Canonical full-suite config-string template:
#
#   configs:
#     - "<runtime>|perf_grp1|re-25|md-2|re_par-22|md_par-8|pin_lavyek"
#
# Note: `re_par` and `md_par` REQUIRE explicit values (`-22`, `-8`). The bare
# tokens `re_par|md_par` render to the literal string `e={0}` / `d={0}` and
# break OCAMLRUNPARAM at runtime. `pin_lavyek` takes no value (Wrapper-type
# modifier with a fixed `taskset -c 0-15` payload).
#
# Reason: `re`/`md` are scoped to non-lavyek programs via `excludes`, and `re_par`/
# `md_par`/`pin_lavyek` are scoped to lavyek-only. Omitting the parallel triple
# means lavyek runs with olly's default 8 MB per-domain ring (e=23), which
# overflows on the 10M-op workload across 8 domains and silently drops events
# — the per-domain wall-time then falls back to `now - boot_time`, producing
# garbage wall_time values (commonly observed as ~ -4.7M seconds, the system
# uptime). See `2026-05-16-full-s-o-sweep-monolith.md` §Methodology for the
# observed-in-the-wild failure.
#
# Suites that need this set their `required_modifiers:` field (see
# `macro-lavyek-monorepo` below). running-ng silently accepts the field today;
# it's a documented contract for config authors and a future validation hook.
# =============================================================================

invocations: 3
remote_host: null
compress_logs: false
minheap_multiplier: 1.0
heap_range: 6
spread_factor: 1

# Emit the data-contract natively during runbms (inline
# <log_dir>/contract/{manifest.json, measurements/*.ndjson}), so every derived
# experiment is dashboard-ready without a post-hoc `adapt` step. Inherited by
# all including configs; do NOT re-declare at top level in an experiment (a
# top-level scalar in both base and experiment is a combine() TypeError) —
# override it via `overrides:` if you ever need a different value.
schema_version: "1.0"

# Note: plugins (e.g. Zulip notifications) are NOT defined here — they are a
# per-experiment concern, and requiring them here would force every including
# config to have the plugin's Python deps installed (`pip install running-ng[zulip]`
# for Zulip).  Add a `plugins:` block in your derived config if you want them.

# =============================================================================
# Suites — monorepo builds (OCamlBenchmarkSuite)
# =============================================================================
suites:
  macro-menhir-monorepo:
    type: OCamlBenchmarkSuite
    # Suite-level runtime_events ring. This suite's event rate overflows the
    # default ring under olly (measured lost events at the default ring; see the
    # per-benchmark ring probe). The `d=2` is load-bearing, not just a domain cap:
    # OCaml sizes the ring as max_domains * 2^e, so e=25 at the default
    # max_domains(128) demands ~4GB and aborts (SIGABRT + "olly internal error");
    # d=2 bounds it to ~64MB. Together e=25,d=2 == the retired global re-25|md-2,
    # proven through running-ng; declared per-suite so configs carry no re/md.
    ocamlrunparam: "e=25,d=2"
    timeout: 600
    programs:
      menhir_ocamly:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir"
        build_script: "menhir.build.sh"
        # `--canonical` builds the full canonical LR(1) automaton (vs the
        # smaller LALR tables in `--lalr`). For the OCaml grammar this is
        # ~80× more work — brings wall time from 0.4s to ~33s on this
        # machine and uses ~2.7 GB RSS for the state table. The other two
        # menhir benchmarks (sql_parser, sysver) use different algorithms
        # already; switching ocamly to canonical gives the suite three
        # distinct menhir workloads.
        args: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir/ocaml.mly --list-errors --no-stdlib --canonical"
      menhir_sql_parser:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir"
        build_script: "menhir.build.sh"
        args: "-v -t ${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir/keywords.mly ${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir/sql-parser.mly --base sql-parser"
      menhir_sysver:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir"
        build_script: "menhir.build.sh"
        args: "-v --table ${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir/sysver.mly"
      # Input-size ladder (automaton scale, monotone by footprint AND wall on current
      # hardware): small=menhir_sysver (sysver --table, 7.7s/0.72GB), default=
      # menhir_ocamly (ocaml --canonical --list-errors, 12.7s/2.76GB), large=
      # menhir_sysver_canonical (sysver --canonical, 33s/4.0GB). All single-run —
      # menhir has no callable main to loop in-process (its main.ml is init-time
      # side effects), so a bigger input is the only way to lengthen a run.
      # menhir_sql_parser (LALR, 1.2s) stays as a fast standalone, not a ladder rung.
      menhir_sysver_canonical:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir"
        build_script: "menhir.build.sh"
        args: "--canonical --table ${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir/sysver.mly"

  macro-cpdf-monorepo:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      cpdf_merge:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf"
        build_script: "cpdf.build.sh"
        args: "-merge ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig -o /dev/null"
      cpdf_blacktext:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf"
        build_script: "cpdf.build.sh"
        args: "-blacktext ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig -o /dev/null"
      cpdf_scale:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf"
        build_script: "cpdf.build.sh"
        args: "scale-to-fit a4landscape -twoup ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig -o /dev/null"
      cpdf_squeeze:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf"
        build_script: "cpdf.build.sh"
        args: "-squeeze ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig -o /dev/null"
      # Input-size squeeze ladder (working set = document size). cpdf.build.sh emits a
      # wrapper for these cpdf_squeeze_* outputs that merges argv.1 copies of the
      # input PDF (the whole parsed object graph stays resident → top_heap grows
      # ~linearly with N) and recompresses every stream. Recompression is the CPU
      # that lifts wall into the standard bands (merge alone is memory-bound and
      # tops out ~17s). Measured 5.5.0 / Ryzen 9 9950X: 8 copies ~7s/0.88GB/top_heap
      # 110M w, 24 ~18s/1.78GB/225M w, 64 ~55s/3.16GB/405M w (major GC 38→45→56,
      # promo ~0.42-0.46). The single arg is the copy count.
      cpdf_squeeze_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf"
        build_script: "cpdf.build.sh"
        args: "8"
      cpdf_squeeze_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf"
        build_script: "cpdf.build.sh"
        args: "24"
      cpdf_squeeze_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf"
        build_script: "cpdf.build.sh"
        args: "64"

  macro-alt-ergo-monorepo:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      alt_ergo_fill:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo"
        build_script: "alt-ergo.build.sh"
        # fill_x100.why is generated at build time by alt-ergo.build.sh —
        # it replicates the original `fill_assert_39` goal 100 times so
        # alt-ergo solves each independently. Scales work linearly: ~14s
        # wall on this machine, vs 0.18s for the single-goal fill.why.
        # See ~/macro-benches/README.md §"Iteration counts".
        args: "--input native ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/fill_x100.why"
      alt_ergo_yyll:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo"
        build_script: "alt-ergo.build.sh"
        args: "--input native ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/yyll.why"
      # Input-size congruence-chain ladder (working set = single-solve problem size).
      # alt-ergo.build.sh generates alt_ergo_chain_<rung>.why: one goal asserting
      # a(0)=0 and a(i)=a(i-1)+1 for i in 1..N, proving a(N)=N, so alt-ergo builds
      # an N-term congruence/arithmetic structure in ONE solve (unlike fill_x100,
      # which is 100 independent copies = repetition, constant peak working set). This
      # is fill.why's array-cell reasoning parameterised. Super-linear (~N^2.2 in
      # wall and live heap). Measured 5.5.0 / Ryzen 9 9950X: N=4000 ~4s/0.6GB/
      # top_heap 76M w, 7000 ~13s/1.9GB/244M w, 10500 ~32s/5.0GB/638M w (minor GC
      # 3.7k->25k, major 16->24, promo 0.09->0.14). Input file selects the rung.
      alt_ergo_chain_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo"
        build_script: "alt-ergo.build.sh"
        args: "--input native ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/alt_ergo_chain_small.why"
      alt_ergo_chain_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo"
        build_script: "alt-ergo.build.sh"
        args: "--input native ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/alt_ergo_chain_default.why"
      alt_ergo_chain_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo"
        build_script: "alt-ergo.build.sh"
        args: "--input native ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/alt_ergo_chain_large.why"
      alt_ergo_unsat_smt2:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo"
        build_script: "alt-ergo.build.sh"
        args: "--timelimit 15 ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/unsat.smt2"
        # The workload IS "solve for 15 seconds": --timelimit arms SIGVTALRM, the
        # goal never closes, alt-ergo prints `unknown / (error "timeout")` and the
        # process dies of the signal — 128+14 = 142, every run, by design.
        # Without this the runner calls it a crash and the native contract
        # emitter drops the invocation, so the benchmark silently never reaches
        # the dashboard (while the legacy adapter, reading the sidecars, keeps
        # it). Matches `expected_exit: 142` in macro-benches'
        # benchmarks/manifest.yml — keep the two in sync.
        expected_exit: 142

  # Frama-C EVA (value/abstract-interpretation).  Static-linked kernel+EVA
  # (vendored 32.1); the build script's wrapper sets DUNE_DIR_LOCATIONS and
  # -no-autoload-plugins.  The wrapper selects the workload by its single
  # arg: "t" (zlib t.c) or "sqlite" (258k-line SQLite amalgamation — the
  # ocaml#11733 weak/ephemeron hash-consing reproducer, ~460MB RSS).
  # Input-size ladder (2026-07-24): the axis is EVA precision (-eva-precision N),
  # passed as the wrapper's 2nd arg ("sqlite N").  NOT -eva-slevel — measured
  # flat 0..2000 at every config (EVA merges states without loop-unrolling).
  # Precision changes shape (P0->P2: RSS 457->641MB, live 53->77M words, minor
  # GC 11k->31k) but saturates ~730MB; there is no >5min "huge" rung reachable
  # via any EVA knob (would need a bigger C amalgamation) -- deferred honestly.
  # frama_c_eva_sqlite (bare "sqlite" == precision 0) is kept as the legacy /
  # tag anchor and equals the _small rung.
  macro-frama-c-monorepo:
    type: OCamlBenchmarkSuite
    timeout: 600
    programs:
      frama_c_eva_t:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/frama-c"
        build_script: "frama-c.build.sh"
        args: "t"
      frama_c_eva_sqlite:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/frama-c"
        build_script: "frama-c.build.sh"
        args: "sqlite"
      # ladder rungs (precision N); see block comment above
      frama_c_eva_sqlite_small:      # P0: ~7s, 457MB, 11k minor GC (== legacy sqlite)
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/frama-c"
        build_script: "frama-c.build.sh"
        args: "sqlite 0"
      frama_c_eva_sqlite_default:    # P2: ~18s, 641MB, 31k minor GC, live 77M
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/frama-c"
        build_script: "frama-c.build.sh"
        args: "sqlite 2"
      frama_c_eva_sqlite_large:      # P3: ~124s, 695MB, 182k minor GC, 48G alloc (max ephemeron churn)
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/frama-c"
        build_script: "frama-c.build.sh"
        args: "sqlite 3"

  macro-goblint-monorepo:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      goblint:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/goblint"
        build_script: "goblint.build.sh"
        args: ""
      # Input-size ladder (working set = analysed-program size). The frozen `goblint`
      # runs the fixed #13733 reproducer (~0.2s — too short). goblint.build.sh
      # generates a synthetic Btor2C-style bit-vector state machine with N state
      # vars (goblint_gen_<rung>.c) and emits a wrapper that analyses it with the
      # same svcomp.json/apron config. A bigger N grows the interval+octagon
      # constraint system, scaling goblint's signature #13733 behaviour: massive
      # minor-GC allocation churn with a small live set (octagon is O(N^2), so
      # wall+allocation are super-linear). No args — the C file is baked per rung.
      # Measured 5.5.0 / Ryzen 9 9950X (all `SV-COMP result: true`): N=100 ~4.3s/
      # 3.8G alloc-words/77MB, 165 ~16s/14G/120MB, 240 ~47s/40G/186MB (minor GC
      # 15k->151k, major 41->97, top_heap 5.9->19.5M). Read by allocated_words.
      goblint_gen_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/goblint"
        build_script: "goblint.build.sh"
        args: ""
      goblint_gen_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/goblint"
        build_script: "goblint.build.sh"
        args: ""
      goblint_gen_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/goblint"
        build_script: "goblint.build.sh"
        args: ""

  macro-infer-monorepo:
    type: OCamlBenchmarkSuite
    timeout: 600
    programs:
      # Input-size ladder (working set = #classes analysed). infer.build.sh selects
      # roots_<rung>.idx by output name and execs `infer analyze --multicore` on that
      # subset of the shared per-runtime capture. More roots = more procedures = more
      # shared-heap allocation + multicore GC, at a flat capture footprint. Infer is
      # manually vendored + a per-runtime javalib/sawja prefix (the goblint/apron
      # model), not opam-monorepo-built. Measured warm -j12, 32-core, 5.5.0: small 72
      # roots ~9s, default 215 ~16s, large 542 ~44s (cold first run ~2-2.5x). No args:
      # the rung is baked into the wrapper. The suite's first --multicore (multi-domain
      # shared-heap) workload; INFER_JOBS sets the domain count (default 12).
      #
      # `ocamlrunparam: "e=18,d=128"` — per-benchmark override of the global re/md
      # (see Benchmark.attach_modifiers). infer's --multicore needs both because the
      # global `re-25|md-2` breaks it: (1) d=2 caps max-domains below the 12-domain
      # pool -> Domain.spawn "failed to allocate domain", so d=128 lifts it; (2) a
      # large runtime_events ring segfaults the multi-domain process (e>=22 SIGSEGVs
      # on 5.5.0 — a runtime bug), while too small drops olly events. e=18 is the
      # smallest ring clean for BOTH rungs (measured -j12: small needs >=16, large
      # >=18; the default ~16 ring loses ~97k events on large) and sits under the
      # e=22 segfault wall. Machine-relative; re-probe if the farm differs.
      infer_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/infer"
        build_script: "infer.build.sh"
        args: ""
        ocamlrunparam: "e=18,d=128"
      infer_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/infer"
        build_script: "infer.build.sh"
        args: ""
        ocamlrunparam: "e=18,d=128"
      infer_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/infer"
        build_script: "infer.build.sh"
        args: ""
        ocamlrunparam: "e=18,d=128"

  # Size axis = numeral size (unary-nat kernel reduction). coqc_corelib_stress is
  # the legacy mixed workload (fib/ack/tree). The coqc_tree_* rungs are a clean
  # single-knob ladder: `Compute tree_size (make_tree D)` reduces a 2^D-deep
  # unary nat, so coqc's kernel does exponential allocation-heavy reduction and
  # RSS/live grow with D (each +1 depth ~doubles+ the work). Vendored .v files.
  # Measured 5.5.0 / Ryzen 9950X (wall / RSS / live):
  #   small   D=17  5.3s   0.60GB  62M words
  #   default D=18  18.6s  1.03GB  104M words
  #   large   D=19  68s    1.98GB  204M words
  # (huge D>=20 deferred — exponential, D=21 already >200s.)
  macro-coq-monorepo:
    type: OCamlBenchmarkSuite
    ocamlrunparam: "e=25,d=2"   # overflows the default runtime_events ring under olly (see macro-menhir note)
    timeout: 900
    programs:
      coqc_corelib_stress:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq"
        build_script: "coq.build.sh"
        args: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq/coq_corelib_stress.v"
      coqc_tree_small:      # make_tree 17: ~5s, 0.6GB
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq"
        build_script: "coq.build.sh"
        args: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq/coq_tree_small.v"
      coqc_tree_default:    # make_tree 18: ~19s, 1.03GB
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq"
        build_script: "coq.build.sh"
        args: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq/coq_tree_default.v"
      coqc_tree_large:      # make_tree 19: ~68s, 1.98GB
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq"
        build_script: "coq.build.sh"
        args: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq/coq_tree_large.v"

  macro-devkit:
    type: OCamlBenchmarkSuite
    timeout: 600
    programs:
      devkit_htmlstream:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ahrefs-devkit"
        build_script: "ahrefs-devkit.build.sh"
        args: ""
      # Input-size ladder (working set = per-document content size). devkit_htmlstream
      # is a synthetic 8-part HtmlStream GC-stress suite; the arg is a scale factor
      # (argv.1) that multiplies the per-document content counts (elements
      # generated + structures retained) while keeping the outer document
      # repetition fixed. Bigger factor => bigger HTML parsed and bigger live set:
      # both allocation churn AND working set grow ~linearly (only the bounded
      # linear loops are scaled). arg=1 is the frozen devkit_htmlstream. Measured
      # 5.5.0 / Ryzen 9 9950X: 1 ~7s/365MB/1.6G-words, 3 ~20s/1.09GB/4.8G, 8 ~51s/
      # 2.57GB/12.3G (top_heap peak 633MB->4.57GB, minor GC 3.8k->28k, major 255->342).
      devkit_htmlstream_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ahrefs-devkit"
        build_script: "ahrefs-devkit.build.sh"
        args: "1"
      devkit_htmlstream_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ahrefs-devkit"
        build_script: "ahrefs-devkit.build.sh"
        args: "3"
      devkit_htmlstream_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ahrefs-devkit"
        build_script: "ahrefs-devkit.build.sh"
        args: "8"
      devkit_stre:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ahrefs-devkit"
        build_script: "ahrefs-devkit.build.sh"
        # arg = in-process loop count, read by stre_bench.ml as Sys.argv.(1).
        # Each iteration is ~0.47s on this machine (full 8 sub-benches),
        # so arg=30 → ~14s wall.
        # See ~/macro-benches/README.md §"Iteration counts".
        args: "30"
      devkit_network:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ahrefs-devkit"
        build_script: "ahrefs-devkit.build.sh"
        # arg = in-process loop count. Each iteration ~4.3s, so arg=4 → ~17s.
        args: "4"
      devkit_gzip:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ahrefs-devkit"
        build_script: "ahrefs-devkit.build.sh"
        # arg = in-process loop count. Each iteration ~2.7s, so arg=5 → ~14s.
        # gc_overhead ≈ 1% — gzip is compute-bound, GC isn't the story here.
        # Candidate for `tag: compute-bound` once tags are wired up.
        args: "5"

  macro-irmin:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      # args = "n_keys n_ops read_pct total_ops".
      #   irmin_mem_rw   = repetition: 3000-key store, 20000 mixed ops (80% read).
      #   irmin_mem_rw_* = size ladder: store SIZE (n_keys), few extra ops. Every
      #     set_exn commits a new revision and re-hashes the flat "root" node
      #     (all keys in one directory), so the write phase is O(n_keys^2) in
      #     the persistent-hash-tree / Hashtbl churn — allocation volume, major
      #     cycles and the live store all grow with n_keys (RSS stays modest
      #     <100MB; this is a churn/throughput ladder, not a footprint one).
      #     Measured 5.5.0 / Ryzen 9950X:
      #       small   6000 keys   5.4s   30MB   9k minorGC / 295 majorGC
      #       default 10000 keys  15s    44MB   24k / 674
      #       large   18000 keys  52s    71MB   74k / 1522
      #   (huge deferred — quadratic.)
      irmin_mem_rw:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/irmin"
        build_script: "irmin.build.sh"
        args: "3000 10000 80 20000"
      irmin_mem_rw_small:      # 6000-key store: ~5s, 30MB
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/irmin"
        build_script: "irmin.build.sh"
        args: "6000 0 50 1000"
      irmin_mem_rw_default:    # 10000-key store: ~15s, 44MB
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/irmin"
        build_script: "irmin.build.sh"
        args: "10000 0 50 1000"
      irmin_mem_rw_large:      # 18000-key store: ~52s, 71MB
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/irmin"
        build_script: "irmin.build.sh"
        args: "18000 0 50 1000"

  # Size axis = source SIZE (# lines). The rung inputs wl_{12,30,150,450}x.ml are
  # generated by ocamlformat.build.sh (N-times concatenation of workload.ml,
  # ~3.3k lines of Rocq source) and gitignored. ocamlformat holds the whole AST
  # + output doc in memory, so RSS/live-heap grow ~linearly with N (a genuine
  # footprint+throughput ladder — NOT shape-invariant like the compiler benches).
  # Measured 5.5.0 / Ryzen 9950X (wall / RSS / live-heap):
  #   small   12x   4.7s   0.6GB   75M words
  #   default 30x   13s    1.7GB   213M words
  #   large   150x  90s    8.8GB   1.1G words
  # (huge band ~450x / ~26 GB RSS deferred — tracked separately.) Legacy
  # ocamlformat_rocq (workload_5x, ~1.8s) kept as the anchor.
  macro-ocamlformat:
    type: OCamlBenchmarkSuite
    timeout: 600
    programs:
      ocamlformat_rocq:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlformat"
        build_script: "ocamlformat.build.sh"
        args: "--impl ${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlformat/workload_5x.ml -o /dev/null"
      ocamlformat_rocq_small:      # 12x ~40k lines: ~5s, 0.6GB
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlformat"
        build_script: "ocamlformat.build.sh"
        args: "--impl ${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlformat/wl_12x.ml -o /dev/null"
      ocamlformat_rocq_default:    # 30x ~100k lines: ~13s, 1.7GB
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlformat"
        build_script: "ocamlformat.build.sh"
        args: "--impl ${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlformat/wl_30x.ml -o /dev/null"
      ocamlformat_rocq_large:      # 150x ~500k lines: ~90s, 8.8GB
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlformat"
        build_script: "ocamlformat.build.sh"
        args: "--impl ${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlformat/wl_150x.ml -o /dev/null"

  # Two knobs (args "$ITERATIONS $DATA_SIZE"):
  #   test_decompress   = repetition: 64 iterations of a fixed 512 KB payload (legacy anchor).
  #   test_decompress_* = size ladder: 1 iteration, payload SIZE (argv.2, bytes) grows the
  #                       input string + compress/uncompress buffers, so RSS/live-heap
  #                       grow ~linearly. Compute + Bigstring-alloc bench (low gc%,
  #                       ~0 promotion; major-GC count pinned by the fixed-size Bigstring
  #                       io buffers, not by payload). Measured 5.5.0 / Ryzen 9950X:
  #                         small   80 MB  ~5s   0.5GB    large  1 GB  ~63s  5.7GB
  #                         default 256 MB ~16s  1.4GB
  #   (huge band deferred.) Data is random (incompressible) as in the original bench.
  macro-decompress:
    type: OCamlBenchmarkSuite
    ocamlrunparam: "e=25,d=2"   # overflows the default runtime_events ring under olly (see macro-menhir note)
    timeout: 300
    programs:
      test_decompress:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/decompress"
        build_script: "decompress.build.sh"
        args: "64 524288"
      test_decompress_small:      # 1 iter, 80MB payload: ~5s, 0.5GB
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/decompress"
        build_script: "decompress.build.sh"
        args: "1 83886080"
      test_decompress_default:    # 1 iter, 256MB payload: ~16s, 1.4GB
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/decompress"
        build_script: "decompress.build.sh"
        args: "1 268435456"
      test_decompress_large:      # 1 iter, 1GB payload: ~63s, 5.7GB
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/decompress"
        build_script: "decompress.build.sh"
        args: "1 1073741824"

  # Eio: OCaml 5 effect-based concurrency (requires OCaml >= 5.2)
  macro-eio:
    type: OCamlBenchmarkSuite
    ocamlrunparam: "e=25,d=2"   # overflows the default runtime_events ring under olly (see macro-menhir note)
    timeout: 120
    programs:
      eio_fiber_stream:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/eio"
        build_script: "eio.build.sh"
        args: ""
      # Input-size ladder (working set = concurrency degree). eio_fiber_stream is a
      # throughput bench (few fibers, one shared stream, tiny constant live set);
      # eio_conc_bench scales the other axis — the number of independent
      # producer/consumer fiber pairs (argv.1), each on its own bounded stream —
      # so the live set (parked fibers' effect continuations + data buffered
      # across all the streams) grows ~linearly. eio.build.sh selects this driver
      # by the eio_conc_* output name; per-fiber work is fixed at 20000 items.
      # Measured 5.5.0 / Ryzen 9 9950X: 3000 pairs ~5.5s/0.69GB, 9000 ~16s/2.1GB,
      # 21000 ~39s/5.1GB (top_heap 84->619M words, promotion ~0.85 — a live-set
      # ladder). Arg = n_pairs.
      eio_conc_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/eio"
        build_script: "eio.build.sh"
        args: "3000"
      eio_conc_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/eio"
        build_script: "eio.build.sh"
        args: "9000"
      eio_conc_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/eio"
        build_script: "eio.build.sh"
        args: "21000"

  # Size axis = input SIZE (argv.1 = generated # lines). The driver generates the
  # pseudo-code in-process and RETAINS the whole token list, so the live set +
  # RSS grow ~linearly with the input (a footprint ladder). Tokenising is cheap,
  # so wall is ~linear and reaching the time bands needs big inputs / much RAM.
  # Measured 5.5.0 / Ryzen 9950X (wall / RSS / live-heap; promo steady ~0.17):
  #   small   2M   4.6s   2.8GB   379M words
  #   default 6M   14s    8.5GB   1.14G words
  #   large   20M  46s    28GB    3.83G words   (RAM-capped just under the 1-3min band)
  # (huge band deferred.) Legacy sedlex_tokenize (700k, ~1.5s) kept as anchor.
  macro-sedlex:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      sedlex_tokenize:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/sedlex"
        build_script: "sedlex.build.sh"
        args: "700000"
      sedlex_tokenize_small:      # 2M lines: ~4.6s, 2.8GB
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/sedlex"
        build_script: "sedlex.build.sh"
        args: "2000000"
      sedlex_tokenize_default:    # 6M lines: ~14s, 8.5GB
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/sedlex"
        build_script: "sedlex.build.sh"
        args: "6000000"
      sedlex_tokenize_large:      # 20M lines: ~46s, 28GB
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/sedlex"
        build_script: "sedlex.build.sh"
        args: "20000000"

  # Two knobs (args "$ITERATIONS $DOC"). $DOC is a file path (read, legacy) OR
  # an integer RECORD COUNT (generated in-process — see ydump_repeat.ml):
  #   ydump_repeat   = repetition: 1000 iterations of sample.json (687KB) — repetition.
  #   ydump_repeat_* = size ladder: 1 iteration, doc SIZE via generated record count.
  #                    Parse builds a memory-heavy Yojson tree (~28% promoted to the
  #                    major heap), so RSS/live grow ~linearly (a promotion-heavy
  #                    footprint ladder). Measured 5.5.0 / Ryzen 9950X:
  #                      small   2M recs  257MB  ~5.5s  3.25GB
  #                      default 6M recs  771MB  ~16s   10GB
  #                      large   12M recs 1.54GB ~33s   20GB   (RAM-capped, under 1-3min band)
  #   (huge band deferred.) No generated files — the count arg produces the JSON in-process.
  macro-yojson:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      ydump_repeat:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/yojson"
        build_script: "yojson.build.sh"
        args: "1000 ${RUNNING_MACRO_BENCH_DIR}/benchmarks/yojson/sample.json"
      ydump_repeat_small:      # 1 iter, 2M records (~257MB): ~5.5s, 3.25GB
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/yojson"
        build_script: "yojson.build.sh"
        args: "1 2000000"
      ydump_repeat_default:    # 1 iter, 6M records (~771MB): ~16s, 10GB
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/yojson"
        build_script: "yojson.build.sh"
        args: "1 6000000"
      ydump_repeat_large:      # 1 iter, 12M records (~1.54GB): ~33s, 20GB
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/yojson"
        build_script: "yojson.build.sh"
        args: "1 12000000"

  macro-zarith:
    type: OCamlBenchmarkSuite
    ocamlrunparam: "e=25,d=2"   # heaviest ring user (~290M events dropped at default); see macro-menhir note
    timeout: 900   # raised from 120 for the `huge` rung (~358s on Ryzen 9950X)
    programs:
      # Legacy single input; kept so existing configs + the off_heap_accounting /
      # custom_block_finalisation / ffi_bulk tag refs keep resolving.
      zarith_pi:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/zarith"
        build_script: "zarith.build.sh"
        args: "15000"
      # Input-size ladder (digit count = working set). Measured wall on
      # Ryzen 9950X / OCaml 5.5.0: small 5.5s, default 16.7s, large 123s, huge 358s.
      # zarith is an allocation-churn / promotion-pressure bench (GMP custom-block
      # off-heap path): gc% FALLS with size (19%->8%, more mutator compute) while
      # tail pauses GROW (40->253ms). small/default = GC-throughput signal;
      # large/huge = GC-latency signal. See docs/benchmarks/zarith.md.
      zarith_pi_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/zarith"
        build_script: "zarith.build.sh"
        args: "22000"
      zarith_pi_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/zarith"
        build_script: "zarith.build.sh"
        args: "38000"
      zarith_pi_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/zarith"
        build_script: "zarith.build.sh"
        args: "106000"
      zarith_pi_huge:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/zarith"
        build_script: "zarith.build.sh"
        args: "180000"

  # Two knobs (wrapper args "$LOOP $DIM"):
  #   owl_gc      = repetition: loop=6, dim=100 (legacy ~16s steady-state).
  #   owl_gc_*    = size ladder (working set): loop=1, dim scales the matrix size, so the
  #                 off-heap Bigarray live set = 100 * dim^2 * 8 bytes grows RSS
  #                 ~quadratically (a footprint ladder). top_heap_words is FLAT
  #                 (off-heap under-reports) -> read RSS + allocated_words, not top_heap.
  #                 Measured 5.5.0 / Ryzen 9950X (wall is BLAS-thread-bound so it is
  #                 secondary; RSS is the stable shape signal):
  #                   small   dim 300  ~4s    95 MB
  #                   default dim 500  ~11s   230 MB
  #                   large   dim 1500 ~124s  1.9 GB
  #                   huge    dim 2400 ~320s  ~4.6 GB
  #   Ring: re-25 (32 MB) as for owl_gc — event volume (~25-30k collections) is
  #   similar across rungs since the grid (num_sample_pts=100) is fixed.
  macro-owl:
    type: OCamlBenchmarkSuite
    timeout: 900
    programs:
      owl_gc:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/owl"
        build_script: "owl.build.sh"
        # arg = in-process loop count, read by owl_gc.ml as Sys.argv.(1).
        # Each iteration is ~2.6s on this machine (full O(n²) GW pass),
        # so arg=6 → ~16s wall.
        # Requires runtime_events ring `re-25` (32 MB) or larger in the
        # config string — `re-23` (8 MB default) overflows on 5+
        # iterations and olly reports lost events plus a corrupted
        # wall_time.
        # See ~/macro-benches/README.md §"Iteration counts".
        args: "6"
      owl_gc_small:      # dim 300: ~4s, 95MB off-heap live set
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/owl"
        build_script: "owl.build.sh"
        args: "1 300"
      owl_gc_default:    # dim 500: ~11s, 230MB
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/owl"
        build_script: "owl.build.sh"
        args: "1 500"
      owl_gc_large:      # dim 1500: ~124s, 1.9GB
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/owl"
        build_script: "owl.build.sh"
        args: "1 1500"
      owl_gc_huge:       # dim 2400: ~320s, ~4.6GB
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/owl"
        build_script: "owl.build.sh"
        args: "1 2400"

  # ocamlc-self-compile: invoke the variant's own ocamlc on a generated
  # ~400k-line OCaml workload (concatenated JSOO benchmark sources × 30
  # replicas, each in a unique module). Single observable OCaml process —
  # the runtime under test executes ocamlc's code, exercising the
  # ephemeron tables in typing/btype.ml, Hashtbl, AST allocation, and
  # Marshal (.cmi writing). Bytecode (`ocamlc`) chosen over native
  # (`ocamlopt`) so the workload is uniform across flambda/non-flambda
  # variants — cross-variant deltas reflect runtime perf only.
  # See ~/macro-benches/README.md §"Benchmark characteristics".
  macro-ocamlc-self-compile:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      # JSOO numeric programs x REPLICAS. Legacy default REPLICAS=30 (~5s, ~1GB
      # heap) kept for continuity; the refactor "default" rung is REPLICAS=130
      # (~15s, ~4GB heap) — set OCAMLC_SELF_COMPILE_REPLICAS=130 at build time.
      # Large monotonic heap, minor-GC-dominated, major GC barely runs.
      ocamlc_self_compile:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlc-self-compile"
        build_script: "ocamlc-self-compile.build.sh"
        args: ""
      # Companion different-CHARACTER real workload: ocamlc compiling the real
      # uucp (Unicode) library (~2s, ~78MB heap). Data/constant-heavy -> small
      # COLLECTED heap, ACTIVE major GC (154 cycles vs ~13 for JSOO). Opposite
      # end of the collector from ocamlc_self_compile; see docs/benchmarks/.
      ocamlc_compile_uucp:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlc-compile-uucp"
        build_script: "ocamlc-compile-uucp.build.sh"
        args: ""
      # Input-size ladder (compiling N replicas of the uucp Unicode library). uucp
      # is data/constant-heavy with a COLLECTED heap, so scaling it keeps RSS ~flat
      # (~90-120MB) while major-GC cycles + promotion scale linearly — a cheap
      # major-GC-throughput ladder, the counterpart to ocamlc_self_compile's
      # memory-bound (monotonic-heap) compilation. ocamlc-compile-uucp.build.sh
      # bakes the replica count per rung by output name (N=3/8/25). Measured 5.5.0
      # / Ryzen 9 9950X: 6s/87MB/377 major, 17s/96MB/771 major, 58s/120MB/1582 major
      # (promotion 144M->1.36G words). No args.
      ocamlc_compile_uucp_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlc-compile-uucp"
        build_script: "ocamlc-compile-uucp.build.sh"
        args: ""
      ocamlc_compile_uucp_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlc-compile-uucp"
        build_script: "ocamlc-compile-uucp.build.sh"
        args: ""
      ocamlc_compile_uucp_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlc-compile-uucp"
        build_script: "ocamlc-compile-uucp.build.sh"
        args: ""

  # liquidsoap-lang: parse + typecheck liquidsoap scripts (DSL compiler).
  # Two knobs (args "$ITERATIONS $UNITS"):
  #   liq_parse_typecheck   = repetition: 50000 iterations of one fixed ~90-line script.
  #   liq_parse_typecheck_* = size ladder: 1 iteration, script SIZE via generated unit
  #     count (argv.2). Each unit is a self-contained recursion+higher-order+list
  #     block, so the parser builds a bigger AST and the typechecker a bigger type
  #     environment; RSS/live grow with the count and wall is super-quadratic (the
  #     env grows and each unit unifies against it). Measured 5.5.0 / Ryzen 9950X:
  #       small   4000 units   4.7s   261MB   37M words
  #       default 6500 units   14s    410MB   61M words
  #       large   12000 units  65s    757MB   113M words
  #   (huge deferred.) In-process generation — no vendored/generated files.
  macro-liquidsoap-lang:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      liq_parse_typecheck:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/liquidsoap-lang"
        build_script: "liquidsoap-lang.build.sh"
        args: "50000"
      liq_parse_typecheck_small:      # 1 iter, 4000 units: ~5s, 261MB
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/liquidsoap-lang"
        build_script: "liquidsoap-lang.build.sh"
        args: "1 4000"
      liq_parse_typecheck_default:    # 1 iter, 6500 units: ~14s, 410MB
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/liquidsoap-lang"
        build_script: "liquidsoap-lang.build.sh"
        args: "1 6500"
      liq_parse_typecheck_large:      # 1 iter, 12000 units: ~65s, 757MB
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/liquidsoap-lang"
        build_script: "liquidsoap-lang.build.sh"
        args: "1 12000"

  # merlin: in-process driver replicating merlin's cram bench (the 7
  # canonical IDE queries against a 51 319-line file). Spawns a typer
  # domain alongside the main domain — the merlin-domains branch's
  # parallel-typer feature using OCaml 5 domains and effects. Same
  # Domain.spawn dance ocamlmerlin_server does in single mode, so we
  # exercise the production code path. Two domains exactly: main +
  # typer.
  # arg = in-process loop count, read by merlin_bench.ml as
  # Sys.argv.(1). Each iteration runs all 7 queries once. arg=4 → ~16s
  # wall on obelisk after the first iteration's typer warmup.
  #
  # Requires OCaml 5.5+. The merlin-domains branch ships its own copy
  # of OCaml's typer (src/ocaml/typing/) targeted at OCaml_5_5_0; on
  # 5.4.1 and earlier the vendored typer trips an internal assertion
  # because data-structure invariants differ across compiler
  # versions. For multi-version sweeps, the user should override
  # `benchmarks.macro-merlin: []` when 5.4 / earlier is in the matrix
  # to avoid known-failing cells.
  macro-merlin:
    type: OCamlBenchmarkSuite
    timeout: 180
    programs:
      merlin_bench:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/merlin"
        build_script: "merlin.build.sh"
        args: "4"

  # js_of_ocaml: compile the runtime's ocamlc.byte (~3.5 MB of bytecode,
  # version-matched per runtime by construction) to JavaScript. Exercises
  # jsoo's bytecode parser, SSA / IR pipeline, optimisation passes, and
  # JS output. Wall ~8-10s per invocation.
  #
  # Vendored from the `ocaml-5.6` branch of jsoo (PR ocsigen/js_of_ocaml#2227)
  # rather than the 6.2.0 release, because 6.2.0 hard-rejects OCaml >= 5.5.
  # The branch supports 4.13 ≤ x < 5.7 — covers all our matrix runtimes.
  # Requires Cmdliner 2.0+ (vendored via setup-monorepo.sh as v2.1.0).
  # Size axis = input BYTECODE size. jsoo is a whole-program compiler (holds the
  # whole IR in memory), so RSS/live grow with the input — a genuine footprint
  # ladder (unlike the per-module compiler benches). But cost tracks program
  # STRUCTURE not raw bytes (thousands of tiny closures are pathological), so
  # the rung inputs are REAL code: the 20 JSOO benchmark sources wrapped in
  # modules × R replicas, compiled to a per-runtime .byte by jsoo.build.sh
  # (generated + gitignored). The rung arg (small/default/large) selects the
  # workload; empty = legacy ocamlc.byte. Measured 5.5.0 / Ryzen 9950X:
  #   jsoo (ocamlc.byte 3.66MB) ~3.7s  0.27GB   (legacy anchor, repetition-ish)
  #   small   30 reps  5.6MB  ~5s   0.5GB
  #   default 80 reps  14MB   ~16s  1.7GB
  #   large   200 reps 36MB   ~50s  7.8GB
  # (huge deferred.)
  macro-jsoo:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      jsoo:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/js_of_ocaml"
        build_script: "jsoo.build.sh"
        args: ""
      jsoo_small:      # 30 reps, 5.6MB bytecode: ~5s, 0.5GB
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/js_of_ocaml"
        build_script: "jsoo.build.sh"
        args: "small"
      jsoo_default:    # 80 reps, 14MB bytecode: ~16s, 1.7GB
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/js_of_ocaml"
        build_script: "jsoo.build.sh"
        args: "default"
      jsoo_large:      # 200 reps, 36MB bytecode: ~50s, 7.8GB
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/js_of_ocaml"
        build_script: "jsoo.build.sh"
        args: "large"

  # liq-video-frames: synthetic reproduction of the GC-pacer / heap-growth
  # pattern from ocaml/ocaml#13123 + #14533 (custom_major_ratio regression).
  # Allocates three Bigarrays per iteration (Y/U/V planes at 1280×720 YUV420,
  # ~1.32 MiB total) matching mm/Image.YUV420.create. Persistent OCaml-heap
  # "deadweight" simulates liquidsoap's loaded stdlib + script graph
  # (LIQ_DW_MB, default 100). Headline metrics are max_rss_kb and
  # minor:major collection counts; wall_time captures the GC-pacer effect.
  #
  # POOL=1 + TOUCH=full: AVFrame-style refcounted-pool semantics — the
  # canonical reproduction of toots' ocaml#14533 free-lunch shape. Under
  # M=250 this variant shows the dramatic CPU drop with no RSS growth.
  # See ~/macro-benches/benchmarks/liq-video-frames/liq_video_frames.ml
  # for the full env-knob catalogue (LIQ_POOL, LIQ_CHURN, LIQ_PACE_FPS).
  # arg = number of iterations; arg=30000 ≈ 4–20s wall.
  macro-liq-video-frames:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      # args = "n_frames [width height]".
      #   liq_video_frames_pool   = the frozen #14533 repro: 30000 720p frames.
      #   liq_video_frames_pool_* = size ladder: frame RESOLUTION (width/height) at a
      #     fixed 15000 frames. A bigger frame scales the per-frame off-heap
      #     Bigarray, so caml_alloc_custom_mem tells the pacer about more off-heap
      #     bytes and forces proportionally MORE major cycles (the #14533 pacer
      #     regime) — major-cycle count and wall grow ~with pixels^2. RSS grows
      #     only modestly (shared pool buffer; off-heap not counted in RSS/top_heap
      #     — lean on the collection counts). Measured 5.5.0 / Ryzen 9950X:
      #       small   1080p  5.6s   108MB   1104 majorGC
      #       default 4K     22s    118MB   4413 majorGC
      #       large   8K     101s   154MB   16837 majorGC
      #   (huge deferred.)
      liq_video_frames_pool:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/liq-video-frames"
        build_script: "liq-video-frames.build.sh"
        args: "30000"
      liq_video_frames_pool_small:      # 15000 frames, 1080p: ~5.6s, 1104 majorGC
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/liq-video-frames"
        build_script: "liq-video-frames.build.sh"
        args: "15000 1920 1080"
      liq_video_frames_pool_default:    # 15000 frames, 4K: ~22s, 4413 majorGC
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/liq-video-frames"
        build_script: "liq-video-frames.build.sh"
        args: "15000 3840 2160"
      liq_video_frames_pool_large:      # 15000 frames, 8K: ~101s, 16837 majorGC
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/liq-video-frames"
        build_script: "liq-video-frames.build.sh"
        args: "15000 7680 4320"

  # pplacer: phylogenetic placement (bioinformatics).
  macro-pplacer:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      pplacer_testsuite:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/pplacer"
        build_script: "pplacer.build.sh"
        # arg = in-process loop count, passed to tests.exe as
        # PPLACER_TEST_LOOP. The whole suite runs in one OCaml process so
        # olly observes everything. Each iteration is ~3.5s on this machine,
        # so arg ≈ N × 3.5s wall. arg=5 → ~17s (well in envelope on slower
        # hardware; comfortably above noise floor on faster CI machines).
        # See ~/macro-benches/README.md §"Iteration counts" for the pattern.
        args: "5"
      # Input-size likelihood ladder (working set = alignment length, n_sites).
      # pplacer.build.sh builds like_bench.exe (pplacer's Felsenstein likelihood
      # hot path) and emits a wrapper that replicates the reference alignment's
      # columns argv.1 times and runs a fixed 40-point ML pendant-branch scan per
      # edge. The larger inputs grow the generalized likelihood vectors (Glv, GSL-backed
      # OFF-HEAP Bigarrays): top_heap stays ~2-8 MB while RSS spans 0.2-2.2 GB, so
      # read this ladder by RSS/allocated_words (off-heap caveat), like owl. The
      # per-edge scan lifts wall to owl-like bands. Measured 5.5.0 / Ryzen 9
      # 9950X: mult 8 ~4.7s/0.22GB, 25 ~15s/0.65GB, 85 ~50s/2.2GB (allocated_words
      # 2.1->22.4G, minor GC 8k->86k, major 147->646). argv.1 = replication factor.
      pplacer_like_small:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/pplacer"
        build_script: "pplacer.build.sh"
        args: "8"
      pplacer_like_default:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/pplacer"
        build_script: "pplacer.build.sh"
        args: "25"
      pplacer_like_large:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/pplacer"
        build_script: "pplacer.build.sh"
        args: "85"

  # lavyek: multicore key-value store on Eio + kcas + io_uring (single
  # OCaml process, multi-domain).  DaCapo-style fixed-work driver; the
  # 4-domain cell is the calibrated target (~8s wall on monolith).  All
  # 4 cells share the same nb=10_000_000 op budget so wall times reflect
  # parallel scaling rather than work-budget differences.  Per-domain
  # measurements on monolith with nb=10M:
  #     1d ~25s   2d ~14s   4d ~8s   8d ~6s
  # WAL files live under benchmarks/lavyek/wal/<name>/ and the driver
  # cleans up after each invocation; an interrupted run may leave
  # leftovers, so wal/ is gitignored.
  #
  # CPU pinning: lavyek_bench.ml pins each worker domain to its own
  # physical core via `ocaml-processor` (Processor.Affinity.set_cpus
  # → pthread_setaffinity_np), keyed off id_domain.  This is what
  # makes the 1d/2d/4d/8d wall times comparable run-to-run — without
  # it the kernel migrates domains within whatever mask was inherited.
  # The pin_lavyek modifier wraps the process in `taskset -c 0-15` to
  # also fence the few helper threads (first iou-wrk + Eio setup) that
  # spawn before pinning runs.  See benchmarks/lavyek/lavyek_bench.ml.
  #
  # Requires md=8 and a smaller per-domain ring (re=22).  Wired via
  # the re_par / md_par modifiers — see the modifiers section below.
  #
  # *** REQUIRED CONFIG-STRING MODIFIERS ***
  # Any config that enables this suite MUST add `|re_par-22|md_par-8|pin_lavyek`
  # to its config-string entries (the values are required — bare `re_par|md_par`
  # tokens render to the literal `e={0}` / `d={0}` and break OCAMLRUNPARAM).
  # Without these, lavyek runs with olly's default 8 MB per-domain ring, which
  # overflows on the 10M-op multi-domain workload and silently drops
  # runtime_events.  Lost begin events make olly fall back to `now - boot_time`
  # for the per-domain wall, producing negative top-level wall_time on the
  # order of -4.7M seconds.  See the file-header note.
  #
  # The `required_modifiers:` field below is documentation today (running-ng
  # ignores unknown suite kwargs); leaving it machine-readable so a future
  # config-validator can pick it up.
  macro-lavyek-monorepo:
    type: OCamlBenchmarkSuite
    timeout: 120
    required_modifiers: [re_par, md_par, pin_lavyek]
    programs:
      lavyek_kv_1d:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek"
        build_script: "lavyek.build.sh"
        args: "1 100 10000000 ${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek/wal/lavyek_wal_1d"
      lavyek_kv_2d:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek"
        build_script: "lavyek.build.sh"
        args: "2 100 10000000 ${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek/wal/lavyek_wal_2d"
      lavyek_kv_4d:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek"
        build_script: "lavyek.build.sh"
        args: "4 100 10000000 ${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek/wal/lavyek_wal_4d"
      lavyek_kv_8d:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek"
        build_script: "lavyek.build.sh"
        args: "8 100 10000000 ${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek/wal/lavyek_wal_8d"

# =============================================================================
# Modifiers
# =============================================================================
modifiers:
  time_stats:
    type: Wrapper
    val: "/usr/bin/time -f \"%Uuser %Ssystem %eelapsed %PCPU (%Xavgtext+%Davgdata %Mmaxresident)k\""
  gc_verbose:
    type: OCamlRunParam
    val: "v=0x400"
  # Runtime events ring buffer size (log2 words per domain).  Bigger ring
  # reduces "Lost N events" from olly on GC-heavy workloads.
  #
  # Two separate (re, md) pairs — sequential macros vs the parallel
  # lavyek suite — because md must be >= the actual domain count and the
  # events file size = md * 2^e * 8 bytes:
  #   - sequential: re-25|md-2  -> 512 MB file, 256 MB/domain ring
  #     (owl needs >= re-25 — see owl_gc comment; re-23 already overflows)
  #   - lavyek:     re-22|md-8  -> 256 MB file,  32 MB/domain ring
  #     (md-8|re-25 would be 2 GB, right at the ftruncate boundary)
  # Routing is via `excludes`: re/md skip lavyek; re_par/md_par skip
  # everything else.  The anchor &non_lavyek_excludes is shared by
  # re_par and md_par so the long suite list lives in one place.
  #
  # *** Including configs MUST list all five of re-N|md-M|re_par-22|md_par-8|
  #     pin_lavyek when lavyek is enabled. ***  re/md alone leaves lavyek with
  #     olly's default 8 MB ring; the resulting event loss surfaces as negative
  #     top-level wall_time (~ -4.7M s, system uptime).  The `_par` modifiers
  #     REQUIRE explicit values (`re_par-22`, `md_par-8`) — the bare token
  #     `re_par` renders to the literal `e={0}` and breaks OCAMLRUNPARAM.
  #     `pin_lavyek` is a Wrapper with no value.  See file-header note and
  #     2026-05-16-full-s-o-sweep-monolith.md §Methodology.
  re:
    type: OCamlRunParam
    val: "e={0}"
    excludes: &lavyek_only_excludes
      macro-lavyek-monorepo:
        - lavyek_kv_1d
        - lavyek_kv_2d
        - lavyek_kv_4d
        - lavyek_kv_8d
  md:
    type: OCamlRunParam
    val: "d={0}"
    excludes: *lavyek_only_excludes
  # MMTk plan / GC-thread count as NAME-VALUE modifiers (plan-Bactrian, threads-1)
  # so the contract records gc_plan / gc_threads dimensions and each plan gets a
  # distinct config_id — Bactrian vs LXR vs GenImmix plot as separate series.
  # (Prefer these over the old flag modifiers mmtk_bactrian/mmtk_lxr, which the
  # config_id drops.)
  plan:
    type: EnvVar
    var: "MMTK_PLAN"
    val: "{0}"
  threads:
    type: EnvVar
    var: "MMTK_THREADS"
    val: "{0}"
  # Parallel-suite counterparts: only applied to lavyek programs.
  re_par:
    type: OCamlRunParam
    val: "e={0}"
    excludes: &non_lavyek_excludes
      macro-menhir-monorepo: [menhir_ocamly, menhir_sql_parser, menhir_sysver]
      macro-cpdf-monorepo: [cpdf_merge, cpdf_blacktext, cpdf_scale, cpdf_squeeze]
      macro-alt-ergo-monorepo: [alt_ergo_fill, alt_ergo_yyll, alt_ergo_unsat_smt2]
      macro-coq-monorepo: [coqc_corelib_stress]
      macro-devkit: [devkit_htmlstream, devkit_stre, devkit_network, devkit_gzip]
      macro-irmin: [irmin_mem_rw]
      macro-ocamlformat: [ocamlformat_rocq]
      macro-decompress: [test_decompress]
      macro-eio: [eio_fiber_stream]
      macro-sedlex: [sedlex_tokenize]
      macro-yojson: [ydump_repeat]
      macro-zarith: [zarith_pi]
      macro-owl: [owl_gc]
      macro-ocamlc-self-compile: [ocamlc_self_compile]
      macro-liquidsoap-lang: [liq_parse_typecheck]
      macro-merlin: [merlin_bench]
      macro-jsoo: [jsoo]
      macro-liq-video-frames: [liq_video_frames_pool]
      macro-pplacer: [pplacer_testsuite]
  md_par:
    type: OCamlRunParam
    val: "d={0}"
    excludes: *non_lavyek_excludes
  # Process-level CPU mask for the lavyek suite — belt-and-braces on top
  # of the per-domain pinning that lavyek_bench.ml does internally via
  # ocaml-processor (each worker domain locks itself to a distinct
  # physical core, cores 0..N-1).  A handful of Eio/io_uring helper
  # threads spawn before the bench's pinning runs and would otherwise
  # inherit the process default mask (every logical CPU); this wrapper
  # confines them to the same physical-core set the workers use.
  #
  # Assumption: cores 0-15 are physical (smt=0).  This holds on the
  # AMD Ryzen 9 9950X box where the suite is calibrated; on Intel
  # SMT-enabled hardware where logical CPUs alternate physical/sibling,
  # adjust the mask per-machine in the experiment file.  Lavyek-only
  # via the shared anchor; sequential macros stay unmasked.
  pin_lavyek:
    type: Wrapper
    val: "taskset -c 0-15"
    excludes: *non_lavyek_excludes
  perf_grp1:
    type: PerfAndOllyAttach
    val: "task-clock,page-faults,cycles,instructions"
  perf_grp2:
    type: PerfAndOllyAttach
    val: "task-clock,cycles,stalled-cycles-frontend,stalled-cycles-backend"
  perf_grp3:
    type: PerfAndOllyAttach
    val: "task-clock,cycles,cache-misses,LLC-load-misses,dTLB-load-misses,iTLB-load-misses"
  # memtrace: unlike perf/olly, this requires the traced binary to call
  # Memtrace.trace_if_requested () at startup — macro-benches only patches
  # this in for test_decompress today (see macro-benches commit adding
  # memtrace to macro-bench-decompress). Scoped to that one benchmark via
  # excludes (Modifier.excludes is exclusion-only — there's no allowlist
  # mechanism).
  #
  # Note this list is belt-and-braces, not a guard: excludes makes
  # attach_modifiers skip the modifier silently, so adding memtrace_grp1 to an
  # unpatched benchmark is NOT an error — it just exports MEMTRACE to a binary
  # that ignores it and produces no trace. runbms warns when that happens
  # ("memtrace was requested but the benchmark produced no trace"), which is
  # the real safety net; a benchmark added to a *new* suite won't be in this
  # list at all. Keep the list in sync when patching more benchmarks.
  memtrace_grp1:
    type: MemtraceAttach
    excludes: &non_decompress_excludes
      macro-menhir-monorepo: [menhir_ocamly, menhir_sql_parser, menhir_sysver]
      macro-cpdf-monorepo: [cpdf_merge, cpdf_blacktext, cpdf_scale, cpdf_squeeze]
      macro-alt-ergo-monorepo: [alt_ergo_fill, alt_ergo_yyll, alt_ergo_unsat_smt2]
      macro-frama-c-monorepo: [frama_c_eva_t, frama_c_eva_sqlite]
      macro-goblint-monorepo: [goblint]
      macro-infer-monorepo: [infer_small, infer_default, infer_large]
      macro-coq-monorepo: [coqc_corelib_stress]
      macro-devkit: [devkit_htmlstream, devkit_stre, devkit_network, devkit_gzip]
      macro-irmin: [irmin_mem_rw]
      macro-ocamlformat: [ocamlformat_rocq]
      macro-eio: [eio_fiber_stream]
      macro-sedlex: [sedlex_tokenize]
      macro-yojson: [ydump_repeat]
      macro-zarith: [zarith_pi]
      macro-owl: [owl_gc]
      macro-ocamlc-self-compile: [ocamlc_self_compile]
      macro-liquidsoap-lang: [liq_parse_typecheck]
      macro-merlin: [merlin_bench]
      macro-jsoo: [jsoo]
      macro-liq-video-frames: [liq_video_frames_pool]
      macro-pplacer: [pplacer_testsuite]
      macro-lavyek-monorepo: [lavyek_kv_1d, lavyek_kv_2d, lavyek_kv_4d, lavyek_kv_8d]

