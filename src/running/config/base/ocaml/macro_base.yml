# =============================================================================
# Tags — runtime-feature classification of benchmarks
# =============================================================================
# Tags map each benchmark to the specific OCaml runtime mechanism(s) it
# exercises on the *hot path* of its workload.  Source-grounded: every
# `exercised_by:` claim is backed by a file:line citation under
# `verified_at:` from the vendored sources (~/macro-benches/duniverse/,
# vendor/) or from the OCaml compiler-libs.  See macro-benches/README.md
# §"Runtime-feature coverage matrix" for the prose version.
#
# Schema (per tag):
#   <tag-name>:
#     description: <one-paragraph explanation of the runtime mechanism>
#     exercised_by:                # hot-path programs (selected by RUNNING_TAG)
#       <suite-name>: [<programs>]
#     cold:                        # optional — present-but-cold uses (doc only;
#       <suite-name>: [<programs>] # NOT selected by RUNNING_TAG)
#     verified_at:                 # source citations
#       - <repo-relative path>:<line> — <brief note>
#     gap:                         # optional — required if exercised_by is empty
#       <text explaining why no benchmark exercises this>
#
# Usage:
#   # run only the benchmarks that exercise Weak.Make on the hot path:
#   RUNNING_TAG=weak_refs \
#     CONFIG_FILE=src/running/config/experiments/macrobenchmarks_monorepo.yml \
#     bash run_ocaml_bench_gc_sweep.sh
#
#   # union of two tags (any program with either tag):
#   RUNNING_TAG=weak_refs,effects ...
#
# Filter semantics: union across the named tags, intersected with the
# experiment's `benchmarks:` block (so disabled benches like
# macro-merlin stay disabled).  Coverage-gap tags (empty `exercised_by:`)
# fail loudly — `RUNNING_TAG=ephemerons` exits with a `gap:` message
# rather than silently running nothing.
# =============================================================================
tags:

  # ---------------------------------------------------------------------
  # Input-size ladder tags — select which rung of each tool to run.
  # A bare run (no RUNNING_TAG) auto-applies `default_run`. Other sizes,
  # the legacy benches, and everything-at-once are opt-in via RUNNING_TAG.
  # ---------------------------------------------------------------------
  default_run:
    description: |
      Input-size ladder — the DEFAULT rung of every tool. This is the tag a bare run
      (no RUNNING_TAG) falls back to, so `default_run` is the standard suite.
    exercised_by:
      macro-menhir-monorepo:
        - menhir_ocamly
      macro-cpdf-monorepo:
        - cpdf_squeeze_default
      macro-alt-ergo-monorepo:
        - alt_ergo_chain_default
      macro-frama-c-monorepo:
        - frama_c_eva_sqlite_default
      macro-goblint-monorepo:
        - goblint_gen_default
      macro-infer-monorepo:
        - infer_default
      macro-coq-monorepo:
        - coqc_tree_default
      macro-devkit:
        - devkit_htmlstream_default
      macro-irmin:
        - irmin_mem_rw_default
      macro-ocamlformat:
        - ocamlformat_rocq_default
      macro-decompress:
        - test_decompress_default
      macro-eio:
        - eio_conc_default
      macro-sedlex:
        - sedlex_tokenize_default
      macro-yojson:
        - ydump_repeat_default
      macro-zarith:
        - zarith_pi_default
      macro-owl:
        - owl_gc_default
      macro-ocamlc-self-compile:
        - ocamlc_compile_uucp_default
      macro-liquidsoap-lang:
        - liq_parse_typecheck_default
      macro-jsoo:
        - jsoo_default
      macro-liq-video-frames:
        - liq_video_frames_pool_default
      macro-pplacer:
        - pplacer_like_default

  small_run:
    description: |
      Input-size ladder — the SMALL rung of every tool (fast, correctness-oriented).
      This is what macro-benches CI runs. Applied automatically? No — the CI passes it
      explicitly; a bare run defaults to `default_run`.
    exercised_by:
      macro-menhir-monorepo:
        - menhir_sysver
      macro-cpdf-monorepo:
        - cpdf_squeeze_small
      macro-alt-ergo-monorepo:
        - alt_ergo_chain_small
      macro-frama-c-monorepo:
        - frama_c_eva_sqlite_small
      macro-goblint-monorepo:
        - goblint_gen_small
      macro-infer-monorepo:
        - infer_small
      macro-coq-monorepo:
        - coqc_tree_small
      macro-devkit:
