# =============================================================================
# Micro / multicore benchmark BASE — shared suites, modifiers, benchmarks
# =============================================================================
# Included by:
#   - examples/ocaml_gc_sweep_example.yml
#   - experiments/gc_sweep_all_versions.yml
#
# Defines every (benchmark, build script) pair under ~/benches/ that the
# running-ng OCaml pipeline can drive, plus the standard modifier set
# (perf groups, time_stats, olly_gc, OCAMLRUNPARAM templates). This file
# does NOT define runtimes, configs, config_sweep, or invocations — those
# belong in the including config (the experiment).
#
# Paths use ${RUNNING_BENCH_DIR} which is supplied by the launch script.
# =============================================================================

# =============================================================================
# Suites
# =============================================================================
# Each suite defines the available programs (path, args, timeout).  The
# `benchmarks` section below selects which programs are actually run.
#
# Suite types:
#   OCamlBenchmarkSuite          — sequential benchmarks (any OCaml version)
#   OCamlMulticoreBenchmarkSuite — enforces OCaml >= 5 at build time

suites:
  # ---------------------------------------------------------------------------
  # simple/ — stdlib-only sequential benchmarks
  # ---------------------------------------------------------------------------
  sandmark-sequential:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      almabench:
        path: "${RUNNING_BENCH_DIR}/simple/almabench"
        args: ""
      bdd:
        path: "${RUNNING_BENCH_DIR}/simple/bdd"
        args: ""
      # `binarytrees` used to be declared here pointing at simple/binarytrees,
      # a directory that does not exist in ~/benches. Nothing selected it in
      # this file, so it was invisible until a config's `overrides:` picked it
      # up (smoke_micro_550.yml did, and failed). The real one is
      # `binarytrees5` in the sandmark-with-packages suite below.
