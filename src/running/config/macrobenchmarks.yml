# =============================================================================
# Macro-benchmarks — real-world OCaml applications
# =============================================================================
# These benchmarks install external tools (alt-ergo, coq, cpdf, etc.) via opam
# and benchmark the installed binary.  Each tool gets its own isolated satellite
# opam switch per compiler version to avoid dependency conflicts.
#
# Switch isolation: the base runtime switch (built once via `opam compiler
# create`) is copied to per-benchmark satellite switches.  OCaml 5.6+
# compilers are relocatable, so copied binaries work in the new location.
# Each satellite has its own opam package root for independent installs.
#
# Intended for large baseline comparisons across compiler versions, NOT for
# GC parameter sweeps or PR feedback loops.
#
# Usage:
#   running runbms <log_dir> macrobenchmarks.yml
#
# Build time: first run is slow (opam installs).  Subsequent runs reuse
# cached switches and binaries (set always_build: false, the default).
#
# Version compatibility (as of 2026-03, tested on 4.14.3/5.1.0/5.4.1/trunk/OxCaml):
#   coq, cpdf, menhir — work on all stock OCaml versions (4.14 through trunk)
#   alt-ergo  — works on trunk only; ocamlbuild (transitive dep) fails in
#               ext-switch sandboxes on 4.14/5.1/5.4
#   cubicle   — requires ocaml < 5.0.0; autotools also fails in sandboxes
#   frama-c   — blocked by why3 (ocaml < 5.5) on all current versions
#   OxCaml    — all tools fail (ocamlfind locality type error)
#
# Benchmarks that can't install on a given runtime are skipped automatically
# (the build fails and running-ng logs a warning, then continues).
# =============================================================================

invocations: 1
remote_host: null
compress_logs: false
minheap_multiplier: 1.0
heap_range: 6
spread_factor: 1

# =============================================================================
# Runtimes — adjust to the versions you want to compare
# =============================================================================
runtimes:
  ocaml-4.14.3:
    type: OCaml
    repo: "https://github.com/dra27/ocaml.git"
    commit: "8b8971e46f5c09aedb5f8d43a6e2701fecc8f98d"
    configure_args:
      - "--with-relative-libdir=../lib/ocaml"
      - "--enable-runtime-search=always"
      - "--enable-runtime-search-target"
      - "--with-stublibs=../stublibs"
  ocaml-5.4.1:
    type: OCaml
    repo: "https://github.com/dra27/ocaml.git"
    commit: "b74c645ef30c6060dcc293a73811a9ae9ceefd57"
    configure_args:
      - "--with-relative-libdir=../lib/ocaml"
      - "--enable-runtime-search=always"
      - "--enable-runtime-search-target"
      - "--with-stublibs=../stublibs"
  ocaml-trunk:
    type: OCaml
    commit: "02ee646ee1f40eb19f4942f50a4a607b52b3ab39"
    configure_args:
      - "--with-relative-libdir=../lib/ocaml"
      - "--enable-runtime-search=always"
      - "--enable-runtime-search-target"
      - "--with-stublibs=../stublibs"

# =============================================================================
# Suites
# =============================================================================
suites:
  macro-alt-ergo:
    type: OCamlMacroBenchmarkSuite
    timeout: 300
    programs:
      alt_ergo_fill:
        path: "${RUNNING_BENCH_DIR}/macrobenchmarks/alt-ergo"
        build_script: "alt_ergo.build.sh"
        args: "${RUNNING_BENCH_DIR}/macrobenchmarks/alt-ergo/fill.why"
      alt_ergo_yyll:
        path: "${RUNNING_BENCH_DIR}/macrobenchmarks/alt-ergo"
        build_script: "alt_ergo.build.sh"
        args: "${RUNNING_BENCH_DIR}/macrobenchmarks/alt-ergo/yyll.why"

  macro-cpdf:
    type: OCamlMacroBenchmarkSuite
    timeout: 300
    programs:
      cpdf_merge:
        path: "${RUNNING_BENCH_DIR}/macrobenchmarks/cpdf"
        build_script: "cpdf.build.sh"
        args: "-merge ${RUNNING_BENCH_DIR}/macrobenchmarks/cpdf/metro_geo.pdf -o /dev/null"
      cpdf_blacktext:
        path: "${RUNNING_BENCH_DIR}/macrobenchmarks/cpdf"
        build_script: "cpdf.build.sh"
        args: "-blacktext ${RUNNING_BENCH_DIR}/macrobenchmarks/cpdf/metro_geo.pdf -o /dev/null"
      cpdf_scale:
        path: "${RUNNING_BENCH_DIR}/macrobenchmarks/cpdf"
        build_script: "cpdf.build.sh"
        args: "scale-to-fit a4landscape -twoup ${RUNNING_BENCH_DIR}/macrobenchmarks/cpdf/PDFReference16.pdf_toobig -o /dev/null"
      cpdf_squeeze:
        path: "${RUNNING_BENCH_DIR}/macrobenchmarks/cpdf"
        build_script: "cpdf.build.sh"
        args: "-squeeze ${RUNNING_BENCH_DIR}/macrobenchmarks/cpdf/PDFReference16.pdf_toobig -o /dev/null"

  macro-cubicle:
    type: OCamlMacroBenchmarkSuite
    timeout: 600
    programs:
      cubicle_german_pfs:
        path: "${RUNNING_BENCH_DIR}/macrobenchmarks/cubicle"
        build_script: "cubicle.build.sh"
        args: "${RUNNING_BENCH_DIR}/macrobenchmarks/cubicle/german_pfs.cub"
      cubicle_szymanski_at:
        path: "${RUNNING_BENCH_DIR}/macrobenchmarks/cubicle"
        build_script: "cubicle.build.sh"
        args: "${RUNNING_BENCH_DIR}/macrobenchmarks/cubicle/szymanski_at.cub"

  macro-frama-c:
    type: OCamlMacroBenchmarkSuite
    timeout: 600
    programs:
      frama_c_slevel:
        path: "${RUNNING_BENCH_DIR}/macrobenchmarks/frama-c"
        build_script: "frama_c.build.sh"
        args: "-slevel 1000000000 -no-results -no-val-show-progress ${RUNNING_BENCH_DIR}/macrobenchmarks/frama-c/t.c -val"

  macro-menhir:
    type: OCamlMacroBenchmarkSuite
    timeout: 600
    programs:
      menhir_ocamly:
        path: "${RUNNING_BENCH_DIR}/macrobenchmarks/menhir"
        build_script: "menhir.build.sh"
        args: "${RUNNING_BENCH_DIR}/macrobenchmarks/menhir/ocaml.mly --list-errors -la 2 --no-stdlib --lalr"
      menhir_sql_parser:
        path: "${RUNNING_BENCH_DIR}/macrobenchmarks/menhir"
        build_script: "menhir.build.sh"
        args: "-v -t ${RUNNING_BENCH_DIR}/macrobenchmarks/menhir/keywords.mly ${RUNNING_BENCH_DIR}/macrobenchmarks/menhir/sql-parser.mly --base sql-parser"
      menhir_sysver:
        path: "${RUNNING_BENCH_DIR}/macrobenchmarks/menhir"
        build_script: "menhir.build.sh"
        args: "-v --table ${RUNNING_BENCH_DIR}/macrobenchmarks/menhir/sysver.mly"

  macro-coq:
    type: OCamlMacroBenchmarkSuite
    timeout: 600
    programs:
      coqc_basicsyntax:
        path: "${RUNNING_BENCH_DIR}/macrobenchmarks/coq"
        build_script: "coq.build.sh"
        args: "${RUNNING_BENCH_DIR}/macrobenchmarks/coq/BasicSyntax.v"
      coqc_abstractinterpretation:
        path: "${RUNNING_BENCH_DIR}/macrobenchmarks/coq"
        build_script: "coq.build.sh"
        args: "${RUNNING_BENCH_DIR}/macrobenchmarks/coq/AbstractInterpretation.v"

# =============================================================================
# Modifiers
# =============================================================================
modifiers:
  time_stats:
    type: Wrapper
    val: "/usr/bin/time -f \"%Uuser %Ssystem %eelapsed %PCPU (%Xavgtext+%Davgdata %Mmaxresident)k\""
  gc_verbose:
    type: OCamlRunParam
    val: "v=0x400"
  perf_grp1:
    type: PerfAndOllyAttach
    val: "task-clock,page-faults,cycles,instructions"

# =============================================================================
# Benchmarks
# =============================================================================
benchmarks:
  macro-alt-ergo:
    - alt_ergo_fill
    - alt_ergo_yyll

  macro-cpdf:
    - cpdf_merge
    - cpdf_blacktext
    - cpdf_scale
    - cpdf_squeeze

  macro-cubicle:
    - cubicle_german_pfs
    - cubicle_szymanski_at

  macro-frama-c:
    - frama_c_slevel

  macro-menhir:
    - menhir_ocamly
    - menhir_sql_parser
    - menhir_sysver

  macro-coq:
    - coqc_basicsyntax
    - coqc_abstractinterpretation

# =============================================================================
# Configs — no sweep, just baseline comparison at default GC
# =============================================================================
configs:
  - "ocaml-4.14.3|perf_grp1|time_stats|gc_verbose"
  - "ocaml-5.4.1|perf_grp1|time_stats|gc_verbose"
  - "ocaml-trunk|perf_grp1|time_stats|gc_verbose"
