invocations: 1
remote_host: null
compress_logs: false
minheap_multiplier: 1.0
heap_range: 6
spread_factor: 1

runtimes:
  # ocaml-local:
    # type: OCaml
    # executable: "/home/udesou/.local/ocaml/bin/ocaml"
  # ocaml-global:
  #   type: OCaml
  #   executable: "/usr/bin/ocaml"
  ocaml-v5.4:
    type: OCaml
    version: "5.4.0"
  ocaml-v4.14.3:
    type: OCaml
    version: "4.14.3"
  # ocaml-release:
  #   type: OCaml
  #   commit: "02ee646ee1f40eb19f4942f50a4a607b52b3ab39"
  
suites:
  ocaml-binarytrees:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      binarytrees:
        path: "/home/udesou/benches/simple/binarytrees"
        # optional: always_build: true
        args: "21"

  sandmark-sequential:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      almabench:
        path: "/home/udesou/benches/simple/almabench"
        args: ""
      bdd:
        path: "/home/udesou/benches/simple/bdd"
        args: ""
      hamming:
        path: "/home/udesou/benches/simple/hamming"
        # N: number of elements in the Hamming sequence to iterate over.
        args: "500000"
      soli:
        path: "/home/udesou/benches/simple/soli"
        # nruns: number of solitaire solver runs.
        args: "50"
      kb:
        path: "/home/udesou/benches/simple/kb"
        # Runs 100 iterations of Knuth-Bendix completion internally.
        args: ""
      kb_no_exc:
        # Same as kb but without exceptions; build script is kb_no_exc.build.sh.
        path: "/home/udesou/benches/simple/kb"
        args: ""
      lexifi-g2pp:
        # Multi-file benchmark; built with dune.
        path: "/home/udesou/benches/simple/lexifi-g2pp"
        # If dune is not on PATH, set it explicitly:
        # build_env:
        #   DUNE_BIN: "/home/udesou/.opam/<switch>/bin/dune"
        args: ""
      zdd:
        path: "/home/udesou/benches/simple/zdd"
        # words.txt must be passed as an absolute path since the run cwd is a temp dir.
        args: "/home/udesou/benches/simple/zdd/words.txt"
      fannkuchredux:
        path: "/home/udesou/benches/simple/fannkuchredux"
        # N: permutation length. Compiled with -noassert -unsafe as in sandmark.
        args: "11"
      crout_decomposition:
        path: "/home/udesou/benches/simple/numerical-analysis"
        args: ""
      qr_decomposition:
        path: "/home/udesou/benches/simple/numerical-analysis"
        args: ""
      durand_kerner_aberth:
        path: "/home/udesou/benches/simple/numerical-analysis"
        # Optional arg: percentage of coefficient array to use (default 100).
        args: ""
      fft:
        path: "/home/udesou/benches/simple/numerical-analysis"
        # Optional arg: array size (default 1048576). Needs unix for timing.
        args: ""
      levinson_durbin:
        path: "/home/udesou/benches/simple/numerical-analysis"
        args: ""
      naive_multilayer:
        path: "/home/udesou/benches/simple/numerical-analysis"
        args: ""
      markbench:
        path: "/home/udesou/benches/simple/markbench"
        # Optional; default script is <benchmark>.build.sh in benchmark path.
        # build_script: "markbench.build.sh"
        # Optional: if dune is not on PATH, point to it explicitly.
        # build_env:
        #   DUNE_BIN: "/home/udesou/.opam/<switch>/bin/dune"
        # Optional benchmark argument; defaults to 10 full_major cycles if empty.
        args: ""

  sandmark-with-deps:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      graph500seq:
        path: "/home/udesou/benches/with_deps/graph500seq"
        # Built with dune (multi-library). graph500seq.build.deps.sh generates
        # edges.data once (runtime-independent) before the first binary build.
        # If dune is not on PATH, set it explicitly:
        # build_env:
        #   DUNE_BIN: "/home/udesou/.opam/<switch>/bin/dune"
        # edges.data is passed as an absolute path since the run cwd is a temp dir.
        args: "/home/udesou/benches/with_deps/graph500seq/edges.data"

modifiers:
  # Runtime metrics in stderr; captured by running-ng logs.
  time_stats:
    type: Wrapper
    val: "/usr/bin/time -f \"%Uuser %Ssystem %eelapsed %PCPU (%Xavgtext+%Davgdata %Mmaxresident)k\""

# TODO: add support for olly stats
  # Optional, requires runtime_events_tools (`olly`) on PATH.
  # olly_gc:
  #   type: Wrapper
  #   val: "olly gc-stats"

  # d:
  #   type: OCamlRunParam
  #   val: "d={0}"
  s:
    type: OCamlRunParam
    val: "s={0}"
  o:
    type: OCamlRunParam
    val: "o={0}"
  # i:
  #   type: OCamlRunParam
  #   val: "i={0}"
  a:
    type: OCamlRunParam
    val: "a={0}"

benchmarks:
  # ocaml-binarytrees:
    # - binarytrees
    # TODO: run the infer benchmark
    # - infer

  sandmark-sequential:
    - almabench
    - bdd
    - hamming
    - soli
    - kb
    - kb_no_exc
    - lexifi-g2pp
    - zdd
    - fannkuchredux
    - crout_decomposition
    - qr_decomposition
    - durand_kerner_aberth
    - fft
    - levinson_durbin
    - naive_multilayer
    - markbench

  sandmark-with-deps:
    - graph500seq

configs:
  # Vary according to defaul values
  # s - minor heap size (words). default: 262144 (256k words)
  # o - space overhead (%). default: 120

  # initial idea (but can be user defined)
  # vary s ∈ {32k, 64k, 128k, 256k, 512k, 1M, 2M}
  # vary o ∈ {40, 60, 80, 100, 120, 150, 200}

  # we could also do a two-step approach
  # s: {64k, 128k, 256k, 512k, 1M}
  # o: {60, 80, 120, 150, 200}
  # and then explore further refining against the best area
  # which would be particularly useful for long running benchmarks

  # d, i, a set to defaults: d=1, i=32, a=1.
  # Sweeps are generated from config_sweep for modifiers not already present.
  # These three lines produce 1 + 7 + 49 runs.
  # - "ocaml-local|time_stats"
  # - "ocaml-v5.4|time_stats|d-1|s-32768|i-32|a-1"
  - "ocaml-v5.4|time_stats"

config_sweep:
  s: [32768] #, 65536, 131072, 262144, 524288, 1048576, 2097152]
  o: [40] #, 60, 80, 100, 120, 150, 200]

# Observed from gc-sweep-logs/obelisk-2026-02-24-Tue-230709 (single run per point):
# 1) Increasing o reduces GC frequency and runtime, but raises peak memory.
#    - At s=262144: o=10 -> 80
#      minor_collections: 107 -> 91 (-15%)
#      major_collections: 47 -> 16 (-66%)
#      elapsed: 33.11s -> 19.58s (-41%)
#      top_heap_words: 14.08M -> 16.05M (+14%)
#      maxresident: 118640k -> 133992k (+13%)
# 2) Increasing s also reduces GC frequency, mostly minor collections.
#    - At o=80: s=262144 -> 524288
#      minor_collections: 91 -> 52 (-43%)
#      major_collections: 16 -> 14 (-12.5%)
#      elapsed: 19.58s -> 18.98s (-3%)
#      maxresident: 133992k -> 138864k (+3.6%)
# 3) At higher s, pushing o further (80 -> 120) gives small extra GC/runtime wins,
#    but a large memory increase:
#      major_collections: 14 -> 12, elapsed: 18.98s -> 17.31s,
#      maxresident: 138864k -> 164804k.
# 4) promoted_words and promotion_rate stay close across runs (~0.926-0.934),
#    suggesting the survival profile of this workload is mostly unchanged.
# 5) compactions stayed 0 and forced_major_collections stayed 1 in all runs.
#
# Data collection:
#   CSV summary has been generated at:
#   gc-sweep-logs/obelisk-2026-02-24-Tue-230709/gc_summary.csv
#   (fields include s,o,minor/major collections, promoted_words, top_heap_words,
#   maxresident_kb, elapsed_s, etc.)
#
# Plotting:
#   python3 scripts/plot_gc_sweep.py gc-sweep-logs/obelisk-2026-02-24-Tue-230709
