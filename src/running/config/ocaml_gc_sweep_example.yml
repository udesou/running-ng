invocations: 1
remote_host: null
compress_logs: false
minheap_multiplier: 1.0
heap_range: 6
spread_factor: 1

runtimes:
  # ocaml-local:
    # type: OCaml
    # executable: "/home/udesou/.local/ocaml/bin/ocaml"
  # ocaml-global:
  #   type: OCaml
  #   executable: "/usr/bin/ocaml"
  ocaml-v5.4:
    type: OCaml
    version: "5.4.0"
  ocaml-v4.14.3:
    type: OCaml
    version: "4.14.3"
  ocaml-release:
    type: OCaml
    commit: "02ee646ee1f40eb19f4942f50a4a607b52b3ab39"
  
suites:
  ocaml-binarytrees:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      binarytrees:
        path: "/home/udesou/benches/simple/binarytrees"
        # optional: always_build: true
        args: "21"

  sandmark-sequential:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      almabench:
        path: "/home/udesou/benches/simple/almabench"
        args: ""
      bdd:
        path: "/home/udesou/benches/simple/bdd"
        args: ""
      hamming:
        path: "/home/udesou/benches/simple/hamming"
        # N: number of elements in the Hamming sequence to iterate over.
        args: "500000"
      soli:
        path: "/home/udesou/benches/simple/soli"
        # nruns: number of solitaire solver runs.
        args: "50"
      kb:
        path: "/home/udesou/benches/simple/kb"
        # Runs 100 iterations of Knuth-Bendix completion internally.
        args: ""
      kb_no_exc:
        # Same as kb but without exceptions; build script is kb_no_exc.build.sh.
        path: "/home/udesou/benches/simple/kb"
        args: ""
      lexifi-g2pp:
        # Multi-file benchmark; built with dune.
        path: "/home/udesou/benches/simple/lexifi-g2pp"
        # If dune is not on PATH, set it explicitly:
        # build_env:
        #   DUNE_BIN: "/home/udesou/.opam/<switch>/bin/dune"
        args: ""
      zdd:
        path: "/home/udesou/benches/simple/zdd"
        # words.txt must be passed as an absolute path since the run cwd is a temp dir.
        args: "/home/udesou/benches/simple/zdd/words.txt"
      fannkuchredux:
        path: "/home/udesou/benches/simple/fannkuchredux"
        # N: permutation length. Compiled with -noassert -unsafe as in sandmark.
        args: "11"
      crout_decomposition:
        path: "/home/udesou/benches/simple/numerical-analysis"
        args: ""
      qr_decomposition:
        path: "/home/udesou/benches/simple/numerical-analysis"
        args: ""
      durand_kerner_aberth:
        path: "/home/udesou/benches/simple/numerical-analysis"
        # Optional arg: percentage of coefficient array to use (default 100).
        args: ""
      fft:
        path: "/home/udesou/benches/simple/numerical-analysis"
        # Optional arg: array size (default 1048576). Needs unix for timing.
        args: ""
      levinson_durbin:
        path: "/home/udesou/benches/simple/numerical-analysis"
        args: ""
      naive_multilayer:
        path: "/home/udesou/benches/simple/numerical-analysis"
        args: ""
      markbench:
        path: "/home/udesou/benches/simple/markbench"
        # Optional; default script is <benchmark>.build.sh in benchmark path.
        # build_script: "markbench.build.sh"
        # Optional: if dune is not on PATH, point to it explicitly.
        # build_env:
        #   DUNE_BIN: "/home/udesou/.opam/<switch>/bin/dune"
        # Optional benchmark argument; defaults to 10 full_major cycles if empty.
        args: ""
      sequence_cps:
        path: "/home/udesou/benches/simple/sequence"
        # N: sequence length; each run computes sum of squares of even elements.
        args: "10000"

  multicore-effects:
    type: OCamlMulticoreBenchmarkSuite
    timeout: 120
    programs:
      algorithmic_differentiation:
        path: "/home/udesou/benches/multicore/multicore-effects"
        args: "100"
      rec_eff_fib:
        path: "/home/udesou/benches/multicore/multicore-effects"
        # args: <iters> <n>; default: 4 40 (output: 102334155)
        args: ""
      rec_seq_fib:
        path: "/home/udesou/benches/multicore/multicore-effects"
        # args: <iters> <n>; default: 4 40 (output: 102334155)
        args: ""
      rec_eff_tak:
        path: "/home/udesou/benches/multicore/multicore-effects"
        # args: <iters> <x> <y> <z>; default: 1 40 20 11 (output: 12)
        args: ""
      rec_seq_tak:
        path: "/home/udesou/benches/multicore/multicore-effects"
        # args: <iters> <x> <y> <z>; default: 1 40 20 11 (output: 12)
        args: ""
      rec_eff_ack:
        path: "/home/udesou/benches/multicore/multicore-effects"
        # args: <iters> <m> <n>; default: 2 3 11 (output: 16381)
        args: ""
      rec_seq_ack:
        path: "/home/udesou/benches/multicore/multicore-effects"
        # args: <iters> <m> <n>; default: 2 3 11 (output: 16381)
        args: ""

  sandmark-with-deps:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      graph500seq:
        path: "/home/udesou/benches/with_deps/graph500seq"
        # Built with dune (multi-library). graph500seq.build.deps.sh generates
        # edges.data once (runtime-independent) before the first binary build.
        # If dune is not on PATH, set it explicitly:
        # build_env:
        #   DUNE_BIN: "/home/udesou/.opam/<switch>/bin/dune"
        # edges.data is passed as an absolute path since the run cwd is a temp dir.
        args: "/home/udesou/benches/with_deps/graph500seq/edges.data"

  # Benchmarks requiring external opam packages.
  # Before running: opam install zarith num lwt decompress bigstringaf checkseum yojson camlp-streams
  sandmark-with-packages:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      # --- benchmarksgame (needs zarith, str, unix) ---
      binarytrees5:
        path: "/home/udesou/benches/with_packages/benchmarksgame"
        args: "21"
      fasta3:
        path: "/home/udesou/benches/with_packages/benchmarksgame"
        args: "25000000"
      fasta6:
        path: "/home/udesou/benches/with_packages/benchmarksgame"
        args: "25000000"
      mandelbrot6:
        path: "/home/udesou/benches/with_packages/benchmarksgame"
        args: "16000"
      nbody:
        path: "/home/udesou/benches/with_packages/benchmarksgame"
        args: "50000000"
      pidigits5:
        path: "/home/udesou/benches/with_packages/benchmarksgame"
        args: "10000"
      spectralnorm2:
        path: "/home/udesou/benches/with_packages/benchmarksgame"
        args: "5500"
      # --- zarith (needs zarith, num) ---
      zarith_fact:
        path: "/home/udesou/benches/with_packages/zarith"
        # factorial of 40, repeated 1_000_000 times
        args: "40 1000000"
      zarith_fib:
        path: "/home/udesou/benches/with_packages/zarith"
        # fibonacci of 40 using Zarith bignums
        args: "Z 40"
      zarith_pi:
        path: "/home/udesou/benches/with_packages/zarith"
        # number of pi digits to compute
        args: "10000"
      zarith_tak:
        path: "/home/udesou/benches/with_packages/zarith"
        # tak function using Zarith bignums, n=2500
        args: "Z 2500"
      # --- lwt-based (needs lwt, lwt.unix) ---
      chameneos_redux_lwt:
        path: "/home/udesou/benches/with_packages/chameneos"
        # number of meetings
        args: "600000"
      thread_ring_lwt_mvar:
        path: "/home/udesou/benches/with_packages/thread-lwt"
        # number of ring-pass iterations
        args: "20000"
      thread_ring_lwt_stream:
        path: "/home/udesou/benches/with_packages/thread-lwt"
        args: "20000"
      # --- decompress (needs bigstringaf, checkseum, decompress) ---
      test_decompress:
        path: "/home/udesou/benches/with_packages/decompress"
        # default: 64 iterations, 32KB data; override with "<iterations> <data_size>"
        args: ""
      # --- yojson (needs yojson, camlp-streams) ---
      ydump:
        path: "/home/udesou/benches/with_packages/yojson"
        # sample.json must be an absolute path since run cwd is a temp dir.
        args: "-c /home/udesou/benches/with_packages/yojson/sample.json"

modifiers:
  # Runtime metrics in stderr; captured by running-ng logs.
  time_stats:
    type: Wrapper
    val: "/usr/bin/time -f \"%Uuser %Ssystem %eelapsed %PCPU (%Xavgtext+%Davgdata %Mmaxresident)k\""

  # Optional GC stats from runtime_events_tools (`olly`) in benchmark logs.
  # Install with: opam install runtime_events_tools
  olly_gc:
    type: Wrapper
    val: "olly gc-stats"

  # d:
  #   type: OCamlRunParam
  #   val: "d={0}"
  s:
    type: OCamlRunParam
    val: "s={0}"
  o:
    type: OCamlRunParam
    val: "o={0}"
  # i:
  #   type: OCamlRunParam
  #   val: "i={0}"
  a:
    type: OCamlRunParam
    val: "a={0}"

