# suites are commented out since they require extra setup.

benchmarks:
  sandmark-sequential:
    - almabench
    - bdd
    - binarytrees
    - hamming
    - soli
    - kb
    - kb_no_exc
    - lexifi-g2pp
    - zdd
    - fannkuchredux
    - crout_decomposition
    - qr_decomposition
    - durand_kerner_aberth
    - fft
    - levinson_durbin
    - naive_multilayer
    - markbench
    - sequence_cps

  sandmark-with-deps:
    - graph500seq

  # Packages are auto-installed by each build script; just uncomment to enable.
  # sandmark-with-packages:
  #   - binarytrees5
  #   - fasta3
  #   - fasta6
  #   - mandelbrot6
  #   - nbody
  #   - pidigits5
  #   - spectralnorm2
  #   - zarith_fact
  #   - zarith_fib
  #   - zarith_pi
  #   - zarith_tak
  #   - chameneos_redux_lwt
  #   - thread_ring_lwt_mvar
  #   - thread_ring_lwt_stream
  #   - test_decompress
  #   - ydump

  multicore-effects:
    - algorithmic_differentiation
    - rec_eff_fib
    - rec_seq_fib
    - rec_eff_tak
    - rec_seq_tak
    - rec_eff_ack
    - rec_seq_ack

  multicore-structures:
    - test_queue_sequential
    - test_queue_parallel
    - test_stack_sequential
    - test_stack_parallel
    - test_spsc_queue_sequential
    - test_spsc_queue_parallel
    - test_spsc_queue_pingpong_parallel

  multicore-numerical:
    - mandelbrot6_multicore
    - nbody_multicore
    - floyd_warshall_multicore
    - game_of_life_multicore
    - binarytrees5_multicore
    - spectralnorm2_multicore
    - fannkuchredux_multicore
    - quicksort_multicore
    - mergesort_multicore
    - matrix_multiplication_multicore
    - matrix_multiplication_tiling_multicore
    - LU_decomposition_multicore
    - nqueens_multicore
    - evolutionary_algorithm_multicore
    - nbody
    - floyd_warshall
    - game_of_life
    - quicksort
    - mergesort
