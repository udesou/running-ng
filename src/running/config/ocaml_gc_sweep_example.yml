invocations: 1
remote_host: null
compress_logs: false
minheap_multiplier: 1.0
heap_range: 6
spread_factor: 1


# =============================================================================
# Runtimes
# =============================================================================
# Each runtime resolves an OCaml compiler by version tag, commit hash, or
# pre-built executable path.  The first build is cached under
# /tmp/running-ng-ocaml-toolchains/ and reused for subsequent runs.
#
# Use `repo` to point to a fork (e.g. OxCaml).  Default repo is
# https://github.com/ocaml/ocaml.git.

runtimes:
  # --- stock OCaml ---
  ocaml-v5.4:
    type: OCaml
    version: "5.4.0"
  ocaml-v4.14.3:
    type: OCaml
    version: "4.14.3"
  ocaml-release:
    type: OCaml
    commit: "02ee646ee1f40eb19f4942f50a4a607b52b3ab39"
  # --- OxCaml (Jane Street fork with Domain.Safe, prefetch intrinsics, etc.) ---
  # type: OxCaml handles the different build system automatically (autoconf,
  # --enable-runtime5, Dune-based make install) and builds a stock OCaml 5.4.0
  # bootstrap compiler if needed.  Default repo is oxcaml/oxcaml.
  oxcaml-release:
    type: OxCaml
    commit: "068b25529286862035eaf827230f7ffa86659c49"
    configure_args: ["--enable-poll-insertion", "--enable-multidomain"]

  # --- pre-built executable ---
  # ocaml-local:
  #   type: OCaml
  #   executable: "/path/to/ocaml/bin/ocaml"

# =============================================================================
# Suites
# =============================================================================
# Each suite defines the available programs (path, args, timeout).  The
# `benchmarks` section below selects which programs are actually run.
#
# Suite types:
#   OCamlBenchmarkSuite          — sequential benchmarks (any OCaml version)
#   OCamlMulticoreBenchmarkSuite — enforces OCaml >= 5 at build time

suites:
  # ---------------------------------------------------------------------------
  # simple/ — stdlib-only sequential benchmarks
  # ---------------------------------------------------------------------------
  sandmark-sequential:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      almabench:
        path: "${RUNNING_BENCH_DIR}/simple/almabench"
        args: ""
      bdd:
        path: "${RUNNING_BENCH_DIR}/simple/bdd"
        args: ""
      binarytrees:
        path: "${RUNNING_BENCH_DIR}/simple/binarytrees"
        args: "21"
      hamming:
        path: "${RUNNING_BENCH_DIR}/simple/hamming"
        args: "500000"
      soli:
        path: "${RUNNING_BENCH_DIR}/simple/soli"
        args: "50"
      kb:
        path: "${RUNNING_BENCH_DIR}/simple/kb"
        args: ""
      kb_no_exc:
        path: "${RUNNING_BENCH_DIR}/simple/kb"
        args: ""
      lexifi-g2pp:
        path: "${RUNNING_BENCH_DIR}/simple/lexifi-g2pp"
        # build_env:
        #   DUNE_BIN: "/path/to/.opam/<switch>/bin/dune"
        args: ""
      zdd:
        path: "${RUNNING_BENCH_DIR}/simple/zdd"
        args: "${RUNNING_BENCH_DIR}/simple/zdd/words.txt"
      fannkuchredux:
        path: "${RUNNING_BENCH_DIR}/simple/fannkuchredux"
        args: "11"
      crout_decomposition:
        path: "${RUNNING_BENCH_DIR}/simple/numerical-analysis"
        args: ""
      qr_decomposition:
        path: "${RUNNING_BENCH_DIR}/simple/numerical-analysis"
        args: ""
      durand_kerner_aberth:
        path: "${RUNNING_BENCH_DIR}/simple/numerical-analysis"
        args: ""
      fft:
        path: "${RUNNING_BENCH_DIR}/simple/numerical-analysis"
        args: ""
      levinson_durbin:
        path: "${RUNNING_BENCH_DIR}/simple/numerical-analysis"
        args: ""
      naive_multilayer:
        path: "${RUNNING_BENCH_DIR}/simple/numerical-analysis"
        args: ""
      markbench:
        path: "${RUNNING_BENCH_DIR}/simple/markbench"
        args: ""
      sequence_cps:
        path: "${RUNNING_BENCH_DIR}/simple/sequence"
        args: "10000"

  # ---------------------------------------------------------------------------
  # with_deps/ — benchmarks needing dune multi-library builds or generated data
  # ---------------------------------------------------------------------------
  sandmark-with-deps:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      graph500seq:
        path: "${RUNNING_BENCH_DIR}/with_deps/graph500seq"
        args: "${RUNNING_BENCH_DIR}/with_deps/graph500seq/edges.data"

  # ---------------------------------------------------------------------------
  # with_packages/ — benchmarks needing external opam packages
  # Packages are auto-installed by each build script (no manual setup needed).
  # ---------------------------------------------------------------------------
  sandmark-with-packages:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      # benchmarksgame (needs zarith, str, unix)
      binarytrees5:
        path: "${RUNNING_BENCH_DIR}/with_packages/benchmarksgame"
        args: "21"
      fasta3:
        path: "${RUNNING_BENCH_DIR}/with_packages/benchmarksgame"
        args: "25000000"
      fasta6:
        path: "${RUNNING_BENCH_DIR}/with_packages/benchmarksgame"
        args: "25000000"
      mandelbrot6:
        path: "${RUNNING_BENCH_DIR}/with_packages/benchmarksgame"
        args: "16000"
      nbody:
        path: "${RUNNING_BENCH_DIR}/with_packages/benchmarksgame"
        args: "50000000"
      pidigits5:
        path: "${RUNNING_BENCH_DIR}/with_packages/benchmarksgame"
        args: "10000"
      spectralnorm2:
        path: "${RUNNING_BENCH_DIR}/with_packages/benchmarksgame"
        args: "5500"
      # zarith (needs zarith, num)
      zarith_fact:
        path: "${RUNNING_BENCH_DIR}/with_packages/zarith"
        args: "40 1000000"
      zarith_fib:
        path: "${RUNNING_BENCH_DIR}/with_packages/zarith"
        args: "Z 40"
      zarith_pi:
        path: "${RUNNING_BENCH_DIR}/with_packages/zarith"
        args: "10000"
      zarith_tak:
        path: "${RUNNING_BENCH_DIR}/with_packages/zarith"
        args: "Z 2500"
      # lwt-based (needs lwt, lwt.unix)
      chameneos_redux_lwt:
        path: "${RUNNING_BENCH_DIR}/with_packages/chameneos"
        args: "600000"
      thread_ring_lwt_mvar:
        path: "${RUNNING_BENCH_DIR}/with_packages/thread-lwt"
        args: "20000"
      thread_ring_lwt_stream:
        path: "${RUNNING_BENCH_DIR}/with_packages/thread-lwt"
        args: "20000"
      # decompress (needs bigstringaf, checkseum, decompress)
      test_decompress:
        path: "${RUNNING_BENCH_DIR}/with_packages/decompress"
        args: ""
      # yojson (needs yojson, camlp-streams)
      ydump:
        path: "${RUNNING_BENCH_DIR}/with_packages/yojson"
        args: "-c ${RUNNING_BENCH_DIR}/with_packages/yojson/sample.json"

  # ---------------------------------------------------------------------------
  # multicore/ — OCaml 5+ benchmarks (effects, domains, domainslib)
  # ---------------------------------------------------------------------------
  multicore-effects:
    type: OCamlMulticoreBenchmarkSuite
    timeout: 120
    programs:
      algorithmic_differentiation:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-effects"
        args: "100"
      rec_eff_fib:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-effects"
        args: ""
      rec_seq_fib:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-effects"
        args: ""
      rec_eff_tak:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-effects"
        args: ""
      rec_seq_tak:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-effects"
        args: ""
      rec_eff_ack:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-effects"
        args: ""
      rec_seq_ack:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-effects"
        args: ""

  multicore-structures:
    type: OCamlMulticoreBenchmarkSuite
    timeout: 120
    programs:
      test_queue_sequential:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-structures"
        args: "1000000"
      test_queue_parallel:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-structures"
        args: "1000000"
      test_stack_sequential:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-structures"
        args: "1000000"
      test_stack_parallel:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-structures"
        args: "1000000"
      test_spsc_queue_sequential:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-structures"
        args: "1000"
      test_spsc_queue_parallel:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-structures"
        args: "1000000"
      test_spsc_queue_pingpong_parallel:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-structures"
        args: "4 100000"

  multicore-numerical:
    type: OCamlMulticoreBenchmarkSuite
    timeout: 180
    programs:
      # multicore variants (first arg is always num_domains)
      mandelbrot6_multicore:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-numerical"
        args: "4 200"
      nbody_multicore:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-numerical"
        args: "4 500 1024"
      floyd_warshall_multicore:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-numerical"
        args: "4 512"
      game_of_life_multicore:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-numerical"
        args: "4 10 1024"
      binarytrees5_multicore:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-numerical"
        args: "4 21"
      spectralnorm2_multicore:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-numerical"
        args: "4 2000"
      fannkuchredux_multicore:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-numerical"
        args: "4 11"
      quicksort_multicore:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-numerical"
        args: "4 2000000"
      mergesort_multicore:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-numerical"
        args: "4 1000000"
      matrix_multiplication_multicore:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-numerical"
        args: "4 512"
      matrix_multiplication_tiling_multicore:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-numerical"
        args: "4 512"
      LU_decomposition_multicore:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-numerical"
        args: "4 1200"
      nqueens_multicore:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-numerical"
        args: "4 13"
      evolutionary_algorithm_multicore:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-numerical"
        args: "4 1000 1000"
      # sequential baselines
      nbody:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-numerical"
        args: "500 1024"
      floyd_warshall:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-numerical"
        args: "512"
      game_of_life:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-numerical"
        args: "10 1024"
      quicksort:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-numerical"
        args: "2000000"
      mergesort:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-numerical"
        args: "1000000"
      matrix_multiplication:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-numerical"
        args: "512"
      LU_decomposition:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-numerical"
        args: "1200"
      nqueens:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-numerical"
        args: "13"
      evolutionary_algorithm:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-numerical"
        args: "1000 1000"

  multicore-grammatrix:
    type: OCamlMulticoreBenchmarkSuite
    timeout: 120
    programs:
      grammatrix:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-grammatrix"
        args: "1 ${RUNNING_BENCH_DIR}/multicore/multicore-grammatrix/data/tox21_nrar_ligands_std_rand_01.csv"
      grammatrix_multicore:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-grammatrix"
        args: "4 16 ${RUNNING_BENCH_DIR}/multicore/multicore-grammatrix/data/tox21_nrar_ligands_std_rand_01.csv"

  multicore-minilight:
    type: OCamlMulticoreBenchmarkSuite
    timeout: 30
    programs:
      minilight_multicore:
        path: "${RUNNING_BENCH_DIR}/multicore/multicore-minilight"
        args: "${RUNNING_BENCH_DIR}/multicore/multicore-minilight/roomfront.ml.txt"

  graph500par:
    type: OCamlMulticoreBenchmarkSuite
    timeout: 300
    programs:
      kernel1_run_multicore:
        path: "${RUNNING_BENCH_DIR}/multicore/graph500par"
        args: "-ndomains 4 ${RUNNING_BENCH_DIR}/multicore/graph500par/edges.data"

  # ---------------------------------------------------------------------------
  # OxCaml-only benchmarks (require a `type: OxCaml` runtime)
  # These benchmarks use OxCaml-specific APIs (Domain.Safe, prefetch
  # intrinsics, etc.).  The framework will refuse to build them if the
  # runtime is not `type: OxCaml` (see runtimes section above).
  # ---------------------------------------------------------------------------
  oxcaml-prefetch:
    type: OCamlOxcamlBenchmarkSuite
    timeout: 30
    programs:
      oxcaml_prefetch:
        path: "${RUNNING_BENCH_DIR}/multicore/oxcaml-prefetch"
        args: ""

# =============================================================================
# Modifiers
# =============================================================================
# Modifiers tweak how benchmarks are executed.  They are referenced by name
# in the pipe-separated config strings (e.g. "ocaml-release|time_stats|s-32768").

modifiers:
  # --- wrappers (prepend commands to the benchmark invocation) ---
  time_stats:
    type: Wrapper
    val: "/usr/bin/time -f \"%Uuser %Ssystem %eelapsed %PCPU (%Xavgtext+%Davgdata %Mmaxresident)k\""
  olly_gc:
    type: Wrapper
    val: "olly gc-stats"

  # --- perf + olly attach (PerfAndOllyAttach) ---
  # Uses SIGSTOP/SIGCONT to freeze the child so both perf stat and olly
  # gc-stats can attach before any code runs.  Requires `perf` and `olly`
  # on PATH.
  #
  # Run one group at a time to avoid PMU multiplexing.  Each group fits
  # within ~4 programmable + 3 fixed hardware counters.
  #
  # Group 1: baseline IPC (fixed counters + software events)
  perf_grp1:
    type: PerfAndOllyAttach
    val: "task-clock,page-faults,cycles,instructions"
  # Group 2: pipeline stalls
  perf_grp2:
    type: PerfAndOllyAttach
    val: "task-clock,cycles,stalled-cycles-frontend,stalled-cycles-backend"
  # Group 3: cache / TLB hierarchy
  perf_grp3:
    type: PerfAndOllyAttach
    val: "task-clock,cycles,cache-misses,LLC-load-misses,dTLB-load-misses,iTLB-load-misses"

  # --- GC run parameters (set via OCAMLRUNPARAM) ---
  #
  # gc_verbose: Print GC statistics at program exit.
  #
  # IMPORTANT: OxCaml reshuffled the GC verbosity flags relative to stock OCaml.
  # The CAML_GC_MSG_STATS bit that prints minor/major collection counts, heap
  # size, etc. at exit is:
  #   - Stock OCaml (4.x / 5.x):  v=0x400   (bit 10)
  #   - OxCaml:                    v=0x1000  (bit 12)
  #
  # OxCaml added new categories (DOMAIN=0x40, STW=0x80, MINOR_HEAP=0x100,
  # MAJOR_HEAP=0x200, STACKS=0x800) which pushed STATS from 0x400 to 0x1000.
  # Using the wrong value silently prints nothing (stock) or address-space
  # reservation messages (OxCaml) instead of GC stats.
  #
  # Pick the modifier matching your runtime:
  gc_verbose:
    type: OCamlRunParam
    val: "v=0x400"
  gc_verbose_oxcaml:
    type: OCamlRunParam
    val: "v=0x1000"
  s:
    type: OCamlRunParam
    val: "s={0}"
  o:
    type: OCamlRunParam
    val: "o={0}"
  a:
    type: OCamlRunParam
    val: "a={0}"
  # Runtime events ring buffer size (log2 words per domain).
  # Default is 16 (64K words).  Increase to reduce "Lost N events" from olly
  # when running GC-heavy multicore benchmarks.
  # NOTE: total events file size = max_domains * 2^e * 8 bytes.
  # With default max_domains=128, e=21 gives a 2GB file which will fail
  # ftruncate.  Pair with max_domains (d=) to keep it reasonable.
  re:
    type: OCamlRunParam
    val: "e={0}"
  # Max domains (OCAMLRUNPARAM d=).  Default is 128, but setting it to
  # the actual number of domains used (main + spawned) reduces the runtime
  # events file size proportionally.
  md:
    type: OCamlRunParam
    val: "d={0}"

# =============================================================================
# Benchmarks — which programs to actually run
# =============================================================================
# Uncomment / comment suites and individual programs as needed.  The default
# below enables all stock-OCaml benchmarks.  OxCaml-only
# are commented out since they require extra setup.

benchmarks:
  sandmark-sequential:
    - almabench
    - bdd
    - binarytrees
    - hamming
    - soli
    - kb
    - kb_no_exc
    - lexifi-g2pp
    - zdd
    - fannkuchredux
    - crout_decomposition
    - qr_decomposition
    - durand_kerner_aberth
    - fft
    - levinson_durbin
    - naive_multilayer
    - markbench
    - sequence_cps

  sandmark-with-deps:
    - graph500seq

  Packages are auto-installed by each build script; just uncomment to enable.
  sandmark-with-packages:
    - binarytrees5
    - fasta3
    - fasta6
    - mandelbrot6
    - nbody
    - pidigits5
    - spectralnorm2
    - zarith_fact
    - zarith_fib
    - zarith_pi
    - zarith_tak
    - chameneos_redux_lwt
    - thread_ring_lwt_mvar
    - thread_ring_lwt_stream
    - test_decompress
    - ydump

  multicore-effects:
    - algorithmic_differentiation
    - rec_eff_fib
    - rec_seq_fib
    - rec_eff_tak
    - rec_seq_tak
    - rec_eff_ack
    - rec_seq_ack

  multicore-structures:
    - test_queue_sequential
    - test_queue_parallel
    - test_stack_sequential
    - test_stack_parallel
    - test_spsc_queue_sequential
    - test_spsc_queue_parallel
    - test_spsc_queue_pingpong_parallel

  multicore-numerical:
    - mandelbrot6_multicore
    - nbody_multicore
    - floyd_warshall_multicore
    - game_of_life_multicore
    - binarytrees5_multicore
    - spectralnorm2_multicore
    - fannkuchredux_multicore
    - quicksort_multicore
    - mergesort_multicore
    - matrix_multiplication_multicore
    - matrix_multiplication_tiling_multicore
    - LU_decomposition_multicore
    - nqueens_multicore
    - evolutionary_algorithm_multicore
    - nbody
    - floyd_warshall
    - game_of_life
    - quicksort
    - mergesort
    - matrix_multiplication
    - LU_decomposition
    - nqueens
    - evolutionary_algorithm

  multicore-grammatrix:
    - grammatrix
    - grammatrix_multicore

  multicore-minilight:
    - minilight_multicore

  graph500par:
    - kernel1_run_multicore

  # OxCaml-only — requires a `type: OxCaml` runtime; will error otherwise.
  # oxcaml-prefetch:
  #   - oxcaml_prefetch

# =============================================================================
# Configs & Sweep
# =============================================================================
# Config strings: "runtime|modifier1|modifier2|..."
# config_sweep generates the cross-product of sweep values for any modifier
# NOT already present in the base config.

configs:
  - "ocaml-release|time_stats|perf_grp1|gc_verbose"
  # - "oxcaml-release|time_stats|perf_grp1|gc_verbose_oxcaml|re-23|md-9"

config_sweep:
  s: [32768, 65536, 131072, 262144, 524288, 1048576, 2097152]
  o: [40, 60, 80, 100, 120, 150, 200]
