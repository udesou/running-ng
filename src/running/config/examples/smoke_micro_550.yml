# Smoke test of the micro path, OCaml 5.5.0 vs pinned trunk: six benchmarks x 1
# invocation, a plumbing check (full suite: experiments/e2e_micro_5.5.0_vs_trunk.yml).
# Includes micro_base.yml.
# Run: RUNNING_BENCH_DIR=~/benches CONFIG_FILE=<this file> LOG_DIR=/tmp/smoke_micro_550 bash run_ocaml_bench_gc_sweep.sh

includes:
  - "../base/ocaml/micro_base.yml"

schema_version: "1.0"
invocations: 1
remote_host: null
compress_logs: false
minheap_multiplier: 1.0
heap_range: 6
spread_factor: 1

# Spans the build paths: ocamlopt-only (almabench, bdd, fannkuchredux), dune multi-file
# (fft), generated data (hamming); markbench exercises the major GC.
overrides:
  benchmarks:
    sandmark-sequential:
      - almabench
      - bdd
      - hamming
      - fannkuchredux
      - fft
      - markbench

runtimes:
  ocaml-5.5.0:
    type: OCaml
    version: "5.5.0"
  ocaml-trunk-c0f8c8ce:
    type: OCaml
    commit: "c0f8c8ceef751fb3a99652d3d52399db3d1c2aae"

configs:
  - "ocaml-5.5.0|perf_grp1"
  - "ocaml-trunk-c0f8c8ce|perf_grp1"

comparisons:
  - label: "5.5.0 -> trunk"
    a: ocaml-5.5.0
    b: [ocaml-trunk-c0f8c8ce]
