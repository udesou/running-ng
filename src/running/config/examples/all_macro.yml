# =============================================================================
# Every macro benchmark, coverage run
# =============================================================================
# COVERAGE, not measurement: one invocation each, so the numbers are not
# comparable. The question is which macro benchmarks build and run at all.
#
# 95 programs across 21 suites, which is the base's 23 minus lavyek and merlin,
# both of which the base already leaves empty (lavyek is in a private repo).
# Nothing is disabled here.
#
# NOTE 95 is what the config ENABLES, not what a bare run measures. With
# RUNNING_TAG unset, runbms falls back to the `default_run` tag, which takes one
# rung per suite and so measures 21. Use RUNNING_TAG=all_benches for all 95.
#
# Runs on Linux and FreeBSD from this one file. `perf_grp1` carries both event
# vocabularies (`val` and `val_freebsd`) and PerfAndOllyAttach picks by host, so
# there is no separate FreeBSD config to keep in step. A config that wants to
# pin one platform's events deliberately can still name perf_grp1_freebsd.
#
# Prerequisites: a built macro-benches checkout (`make setup` there). On FreeBSD
# that needs the system libraries listed in its README; every suite here was
# verified building and running on FreeBSD 15.1, 95/95.
#
# No CpuPin, so no cpuset appears. Pinning is verified separately, and confining
# a coverage run to one NUMA node would only make it slower.
#
# Usage. `bash`, not `sh`. RUNNING_REUSE_SWITCHES=1 avoids wiping and rebuilding
# the switch on each attempt while iterating. PYTHON matters where running-ng is
# in a virtualenv, which it usually is on FreeBSD.
#
#   cd ~/running-ng
#   PYTHON=/path/to/venv/bin/python \
#   RUNNING_MACRO_BENCH_DIR=~/macro-benches \
#   CONFIG_FILE=src/running/config/examples/all_macro.yml \
#   LOG_DIR=/tmp/all_macro \
#   RUNNING_TAG=all_benches \
#   RUNNING_REUSE_SWITCHES=1 \
#     bash run_ocaml_bench_gc_sweep.sh
# =============================================================================

includes:
  - "../base/ocaml/macro_base.yml"

# These six are all defined as top-level scalars by macro_base.yml, and
# redefining an included scalar at top level is a `combine()` TypeError
# ("not an array or a dictionary. Please use overrides instead"). It fails
# fast on the first one, so the traceback names only `invocations`.
overrides:
  invocations: 1
  remote_host: null
  compress_logs: false
  minheap_multiplier: 1.0
  heap_range: 6
  spread_factor: 1

# To disable a suite here, add a top-level `benchmarks:` dict naming it with an
# empty list. That UPDATES the base's dict key by key, so every suite not named
# keeps tracking macro_base. (`overrides:` would replace the whole block,
# meaning all 95 remaining entries by hand, stale the moment macro_base moves.)
#
# TWO TRAPS, both of which have bitten this file:
#
#  - A key that does not exist in the base is silently ADDED as an empty suite
#    rather than rejected, so a misspelling disables nothing and looks fine.
#    `macro-infer` instead of `macro-infer-monorepo` did exactly that.
#    tests/test_freebsd_event_groups.py checks every key against the base.
#  - Writing `benchmarks:` with nothing under it parses as None, not as an
#    empty dict. That is now treated as no override, with a warning, rather
#    than the NoneType crash it used to be; deleting the key says it cleanly.
runtimes:
  ocaml-5.4.1:
    type: OCaml
    version: "5.4.1"

configs:
  - "ocaml-5.4.1|perf_grp1"
