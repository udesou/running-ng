# Coverage run of every macro benchmark (95 programs, 21 suites), 1 invocation each;
# not a measurement. Includes macro_base.yml. A bare run measures only the default_run
# tag (21 programs): set RUNNING_TAG=all_benches for all 95. Works on Linux and FreeBSD
# (perf_grp1 carries both event vocabularies).
# Run: PYTHON=<venv python> RUNNING_MACRO_BENCH_DIR=~/macro-benches CONFIG_FILE=<this file> \
#      LOG_DIR=/tmp/all_macro RUNNING_TAG=all_benches RUNNING_REUSE_SWITCHES=1 bash run_ocaml_bench_gc_sweep.sh

includes:
  - "../base/ocaml/macro_base.yml"

# All six are top-level scalars in macro_base.yml; redefining one at top level is a combine() TypeError.
overrides:
  invocations: 1
  remote_host: null
  compress_logs: false
  minheap_multiplier: 1.0
  heap_range: 6
  spread_factor: 1

# To disable a suite, add a top-level `benchmarks:` dict naming it with an empty list
# (updates the base key by key; overrides: would replace the whole block). A key missing
# from the base is silently added as an empty suite, so a misspelling disables nothing;
# tests/test_freebsd_event_groups.py checks the keys against the base.
runtimes:
  ocaml-5.4.1:
    type: OCaml
    version: "5.4.1"

configs:
  - "ocaml-5.4.1|perf_grp1"
