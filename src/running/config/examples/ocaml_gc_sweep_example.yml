invocations: 5
remote_host: null
compress_logs: false
minheap_multiplier: 1.0
heap_range: 6
spread_factor: 1


# Example (s, o) GC sweep, stock OCaml vs OxCaml, on the micro suite; includes micro_base.yml.
# Run: RUNNING_BENCH_DIR=~/benches CONFIG_FILE=<this file> bash run_ocaml_bench_gc_sweep.sh
includes:
  - "../base/ocaml/micro_base.yml"

plugins:
  zulip:
    type: Zulip
    request:
      type: private
      to: [361443]

# Runtimes resolve by version tag, commit, or executable path and build into an opam
# switch running-ng-<runtime-name> (delete it to force a rebuild). `repo` points at a fork.

runtimes:
  # Every declared runtime must be referenced by a configs: entry
  # (Configuration.validate() rejects dead declarations), so unused ones stay commented out.
  # --- stock OCaml ---
  # ocaml-v5.4:
  #   type: OCaml
  #   version: "5.4.0"
  # ocaml-v4.14.3:
  #   type: OCaml
  #   version: "4.14.3"
  ocaml-release:
    type: OCaml
    commit: "02ee646ee1f40eb19f4942f50a4a607b52b3ab39"
  # type: OxCaml handles its own build system (autoconf, --enable-runtime5, dune
  # install) and bootstraps a stock 5.4.0 if needed. Default repo oxcaml/oxcaml.
  oxcaml-release:
    type: OxCaml
    commit: "068b25529286862035eaf827230f7ffa86659c49"
    configure_args: ["--enable-poll-insertion", "--enable-multidomain"]

  # --- pre-built executable ---
  # ocaml-local:
  #   type: OCaml
  #   executable: "/path/to/ocaml/bin/ocaml"

# config_sweep cross-products the sweep values for any modifier not already in the config string.

configs:
  - "oxcaml-release|perf_grp1|re-25|md-9"
  - "ocaml-release|perf_grp1|re-25|md-9"

config_sweep:
  s: [32768] #, 65536, 131072, 262144, 524288, 1048576, 2097152]
  o: [40] #, 60, 80, 100, 120, 150, 200]
