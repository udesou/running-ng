# Coverage run of every micro benchmark (195 programs, 13 suites), 1 invocation each;
# not a measurement. Includes micro_base.yml. Works on Linux and FreeBSD (perf_grp1
# carries both event vocabularies). re-25|md-2 matches the established micro configs;
# without it globroots_* and pidigits5 overflow the ring (olly stats_reliable: false).
# md-2 is safe: multicore benchmarks declare their own d= in micro_base.
# Run: PYTHON=<venv python> RUNNING_BENCH_DIR=~/benches CONFIG_FILE=<this file> \
#      LOG_DIR=/tmp/all_micro RUNNING_REUSE_SWITCHES=1 bash run_ocaml_bench_gc_sweep.sh

includes:
  - "../base/ocaml/micro_base.yml"

invocations: 1
remote_host: null
compress_logs: false
minheap_multiplier: 1.0
heap_range: 6
spread_factor: 1

# A top-level `benchmarks:` dict updates the base key by key, so this disables one suite only.
benchmarks:
  # Needs a `type: OxCaml` runtime; under OCaml it fails its build check every run.
  oxcaml-prefetch: []

runtimes:
  ocaml-5.4.1:
    type: OCaml
    version: "5.4.1"

configs:
  - "ocaml-5.4.1|perf_grp1|re-25|md-2"
