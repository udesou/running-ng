# Smoke test of the micro path: two cheap sandmark-sequential benchmarks under OCaml
# 5.4.1, 1 invocation (~30-60s once the switch and dune builds are warm). Includes micro_base.yml.
# Run: RUNNING_BENCH_DIR=~/benches CONFIG_FILE=<this file> LOG_DIR=/tmp/smoke_micro bash run_ocaml_bench_gc_sweep.sh

includes:
  - "../base/ocaml/micro_base.yml"

invocations: 1
remote_host: null
compress_logs: false
minheap_multiplier: 1.0
heap_range: 6
spread_factor: 1

overrides:
  benchmarks:
    sandmark-sequential:
      - almabench
      - bdd

runtimes:
  ocaml-5.4.1:
    type: OCaml
    version: "5.4.1"

configs:
  - "ocaml-5.4.1|perf_grp1"
