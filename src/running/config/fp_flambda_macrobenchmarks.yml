# =============================================================================
# FP × Flambda sweep on macrobenchmarks — 3 invocations
# =============================================================================
# Runtimes (2×2 = 4 variants of OCaml 5.4.1):
#   - ocaml-5.4.1             baseline
#   - ocaml-5.4.1-fp          frame pointers enabled
#   - ocaml-5.4.1-flambda     flambda optimizer
#   - ocaml-5.4.1-fp-flambda  frame pointers + flambda
#
# Benchmarks: full macrobenchmark suite (pulls from ~/macro-benches/).
# Default GC params (no s/o sweep). 3 invocations for statistical signal.
# =============================================================================

plugins:
  zulip:
    type: Zulip
    request:
      type: private
      to: [361443]


invocations: 3
remote_host: null
compress_logs: false
minheap_multiplier: 1.0
heap_range: 6
spread_factor: 1

# =============================================================================
# Runtimes
# =============================================================================
runtimes:
  ocaml-5.4.1:
    type: OCaml
    version: "5.4.1"
  ocaml-5.4.1-fp:
    type: OCaml
    version: "5.4.1"
    configure_args: ["--enable-frame-pointers"]
  ocaml-5.4.1-flambda:
    type: OCaml
    version: "5.4.1"
    configure_args: ["--enable-flambda"]
  ocaml-5.4.1-fp-flambda:
    type: OCaml
    version: "5.4.1"
    configure_args: ["--enable-frame-pointers", "--enable-flambda"]

# =============================================================================
# Suites — monorepo builds (OCamlBenchmarkSuite, not OCamlMacroBenchmarkSuite)
# =============================================================================
# RUNNING_MACRO_BENCH_DIR points to ~/macro-benches so build scripts can find
# the monorepo root.

suites:
  macro-menhir-monorepo:
    type: OCamlBenchmarkSuite
    timeout: 600
    programs:
      menhir_ocamly:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir"
        build_script: "menhir.build.sh"
        args: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir/ocaml.mly --list-errors -la 2 --no-stdlib --lalr"
      menhir_sql_parser:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir"
        build_script: "menhir.build.sh"
        args: "-v -t ${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir/keywords.mly ${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir/sql-parser.mly --base sql-parser"
      menhir_sysver:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir"
        build_script: "menhir.build.sh"
        args: "-v --table ${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir/sysver.mly"

  macro-cpdf-monorepo:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      cpdf_merge:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf"
        build_script: "cpdf.build.sh"
        args: "-merge ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig -o /dev/null"
      cpdf_blacktext:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf"
        build_script: "cpdf.build.sh"
        args: "-blacktext ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig -o /dev/null"
      cpdf_scale:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf"
        build_script: "cpdf.build.sh"
        args: "scale-to-fit a4landscape -twoup ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig -o /dev/null"
      cpdf_squeeze:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf"
        build_script: "cpdf.build.sh"
        args: "-squeeze ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig -o /dev/null"

  macro-alt-ergo-monorepo:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      alt_ergo_fill:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo"
        build_script: "alt-ergo.build.sh"
        args: "--input native ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/fill.why"
      alt_ergo_yyll:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo"
        build_script: "alt-ergo.build.sh"
        args: "--input native ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/yyll.why"
      alt_ergo_unsat_smt2:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo"
        build_script: "alt-ergo.build.sh"
        args: "--timelimit 15 ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/unsat.smt2"

  macro-coq-monorepo:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      coqc_corelib_stress:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq"
        build_script: "coq.build.sh"
        args: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq/coq_corelib_stress.v"

  macro-devkit:
    type: OCamlBenchmarkSuite
    timeout: 600
    programs:
      devkit_htmlstream:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ahrefs-devkit"
        build_script: "ahrefs-devkit.build.sh"
        args: ""
      devkit_stre:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ahrefs-devkit"
        build_script: "ahrefs-devkit.build.sh"
        args: "80"
      devkit_network:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ahrefs-devkit"
        build_script: "ahrefs-devkit.build.sh"
        args: "10"
      devkit_gzip:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ahrefs-devkit"
        build_script: "ahrefs-devkit.build.sh"
        args: "15"

  macro-irmin:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      irmin_mem_rw:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/irmin"
        build_script: "irmin.build.sh"
        args: "3000 10000 80 20000"

  macro-ocamlformat:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      ocamlformat_rocq:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlformat"
        build_script: "ocamlformat.build.sh"
        args: "--impl ${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlformat/workload_5x.ml -o /dev/null"

  macro-decompress:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      test_decompress:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/decompress"
        build_script: "decompress.build.sh"
        args: "64 524288"

  # Eio: OCaml 5 effect-based concurrency (requires OCaml >= 5.2)
  macro-eio:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      eio_fiber_stream:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/eio"
        build_script: "eio.build.sh"
        args: ""

  macro-sedlex:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      sedlex_tokenize:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/sedlex"
        build_script: "sedlex.build.sh"
        args: "700000"

  macro-yojson:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      ydump_repeat:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/yojson"
        build_script: "yojson.build.sh"
        args: "1000 ${RUNNING_MACRO_BENCH_DIR}/benchmarks/yojson/sample.json"

  macro-zarith:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      zarith_pi:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/zarith"
        build_script: "zarith.build.sh"
        args: "15000"

  macro-owl:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      owl_gc:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/owl"
        build_script: "owl.build.sh"
        args: "7"

  # dune-bootstrap: build dune from source (~100K LOC OCaml).
  macro-dune-bootstrap:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      dune_bootstrap:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/dune-bootstrap"
        build_script: "dune-bootstrap.build.sh"
        args: ""

  # liquidsoap-lang: parse + typecheck liquidsoap scripts (DSL compiler).
  macro-liquidsoap-lang:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      liq_parse_typecheck:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/liquidsoap-lang"
        build_script: "liquidsoap-lang.build.sh"
        args: "50000"

  # pplacer: phylogenetic placement (bioinformatics).
  macro-pplacer:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      pplacer_testsuite:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/pplacer"
        build_script: "pplacer.build.sh"
        args: "8"

# =============================================================================
# Modifiers
# =============================================================================
modifiers:
  time_stats:
    type: Wrapper
    val: "/usr/bin/time -f \"%Uuser %Ssystem %eelapsed %PCPU (%Xavgtext+%Davgdata %Mmaxresident)k\""
  gc_verbose:
    type: OCamlRunParam
    val: "v=0x400"
  perf_grp1:
    type: PerfAndOllyAttach
    val: "task-clock,page-faults,cycles,instructions"
  # Runtime events ring buffer size (log2 words per domain).
  # Default 16 (64K words) overflows on GC-heavy benchmarks (owl, zarith,
  # eio, coq), causing millions of lost events.  Use 23 (8M words).
  re:
    type: OCamlRunParam
    val: "e={0}"
  # Max domains — total events file size = d * 2^e * 8 bytes.
  # Our macrobenchmarks are single-domain; d=2 gives a 128MB file.
  md:
    type: OCamlRunParam
    val: "d={0}"

# =============================================================================
# Benchmarks — all programs enabled
# =============================================================================
benchmarks:
  macro-menhir-monorepo:
    - menhir_ocamly
    - menhir_sql_parser
    - menhir_sysver

  macro-cpdf-monorepo:
    - cpdf_merge
    - cpdf_blacktext
    - cpdf_scale
    - cpdf_squeeze

  macro-alt-ergo-monorepo:
    - alt_ergo_fill
    - alt_ergo_yyll
    - alt_ergo_unsat_smt2

  macro-coq-monorepo:
    - coqc_corelib_stress

  macro-devkit:
    - devkit_htmlstream
    - devkit_stre
    - devkit_network
    - devkit_gzip

  macro-irmin:
    - irmin_mem_rw

  macro-ocamlformat:
    - ocamlformat_rocq

  macro-decompress:
    - test_decompress

  macro-eio:
    - eio_fiber_stream

  macro-sedlex:
    - sedlex_tokenize

  macro-yojson:
    - ydump_repeat

  macro-zarith:
    - zarith_pi

  macro-owl:
    - owl_gc

  macro-dune-bootstrap:
    - dune_bootstrap

  macro-liquidsoap-lang:
    - liq_parse_typecheck

  macro-pplacer:
    - pplacer_testsuite

# =============================================================================
# Configs — 4 runtimes × default GC params (no sweep)
# =============================================================================
configs:
  - "ocaml-5.4.1|perf_grp1|re-23|md-2"
  - "ocaml-5.4.1-fp|perf_grp1|re-23|md-2"
  - "ocaml-5.4.1-flambda|perf_grp1|re-23|md-2"
  - "ocaml-5.4.1-fp-flambda|perf_grp1|re-23|md-2"
