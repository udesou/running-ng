# =============================================================================
# Smoke test — OCaml 5.2.1, 5.4.1, d8bb46c (5.5-beta) baselines
# =============================================================================
# Three runtimes (no flags), full benchmark set, one invocation.
# Exercises compiler build + every benchmark on each version before committing
# to the full 12-variant fp×flambda matrix (~4-6h).
#
# Expected total cells: 26 benchmarks × 3 runtimes = 78.
#
# Known expected failure:
#   liq_parse_typecheck on ocaml-5.2.1 — Liquidsoap-lang requires OCaml >= 5.3
#   (Jane Street PPX dep). The other 25 benchmarks should run cleanly on 5.2.1.
#
# Usage:
#   RUNNING_MACRO_BENCH_DIR=~/macro-benches \
#   CONFIG_FILE=src/running/config/smoke_5.2_5.4_5.5_baselines.yml \
#   LOG_DIR=/tmp/smoke_5.2_5.4_5.5_baselines_logs \
#     bash run_ocaml_bench_gc_sweep.sh
# =============================================================================

includes:
  - "./macrobenchmarks_base.yml"

overrides:
  invocations: 1

runtimes:
  ocaml-5.2.1:
    type: OCaml
    version: "5.2.1"
  ocaml-5.4.1:
    type: OCaml
    version: "5.4.1"
  ocaml-d8bb46c:
    type: OCaml
    commit: "d8bb46c39bf5fcafb513a8ba18e667d3f8c2600a"

configs:
  - "ocaml-5.2.1|perf_grp1|re-25|md-2"
  - "ocaml-5.4.1|perf_grp1|re-25|md-2"
  - "ocaml-d8bb46c|perf_grp1|re-25|md-2"
