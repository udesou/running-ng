# =============================================================================
# FP × Flambda × {OCaml 5.4.1, commit d8bb46c3} — macrobenchmarks
# =============================================================================
# 2 versions × 2 (frame-pointers on/off) × 2 (flambda on/off) = 8 variants.
#
# Versions:
#   - 5.4.1                (release)
#   - d8bb46c39bf5fcafb513a8ba18e667d3f8c2600a  (ocaml/ocaml commit)
#
# Benchmarks, suites, modifiers, plugins, and run settings are inherited from
# macrobenchmarks_base.yml.  Only runtimes and the configs matrix live here.
#
# Usage:
#   RUNNING_MACRO_BENCH_DIR=~/macro-benches \
#   CONFIG_FILE=src/running/config/fp_flambda_macro_5.4.1_vs_d8bb46c.yml \
#     bash run_ocaml_bench_gc_sweep.sh
# =============================================================================

plugins:
  zulip:
    type: Zulip
    request:
      type: private
      to: [361443]

includes:
  - "./macrobenchmarks_base.yml"

# =============================================================================
# Runtimes — 8 variants
# =============================================================================
runtimes:
  # --- OCaml 5.4.1 ---
  ocaml-5.4.1:
    type: OCaml
    version: "5.4.1"
  ocaml-5.4.1-fp:
    type: OCaml
    version: "5.4.1"
    configure_args: ["--enable-frame-pointers"]
  ocaml-5.4.1-flambda:
    type: OCaml
    version: "5.4.1"
    configure_args: ["--enable-flambda"]
  ocaml-5.4.1-fp-flambda:
    type: OCaml
    version: "5.4.1"
    configure_args: ["--enable-frame-pointers", "--enable-flambda"]

  # --- ocaml/ocaml commit d8bb46c3 ---
  ocaml-d8bb46c:
    type: OCaml
    commit: "d8bb46c39bf5fcafb513a8ba18e667d3f8c2600a"
  ocaml-d8bb46c-fp:
    type: OCaml
    commit: "d8bb46c39bf5fcafb513a8ba18e667d3f8c2600a"
    configure_args: ["--enable-frame-pointers"]
  ocaml-d8bb46c-flambda:
    type: OCaml
    commit: "d8bb46c39bf5fcafb513a8ba18e667d3f8c2600a"
    configure_args: ["--enable-flambda"]
  ocaml-d8bb46c-fp-flambda:
    type: OCaml
    commit: "d8bb46c39bf5fcafb513a8ba18e667d3f8c2600a"
    configure_args: ["--enable-frame-pointers", "--enable-flambda"]

# =============================================================================
# Configs — 8 runtimes × default GC params (no sweep)
# =============================================================================
configs:
  - "ocaml-5.4.1|perf_grp1|re-23|md-2"
  - "ocaml-5.4.1-fp|perf_grp1|re-23|md-2"
  - "ocaml-5.4.1-flambda|perf_grp1|re-23|md-2"
  - "ocaml-5.4.1-fp-flambda|perf_grp1|re-23|md-2"
  - "ocaml-d8bb46c|perf_grp1|re-23|md-2"
  - "ocaml-d8bb46c-fp|perf_grp1|re-23|md-2"
  - "ocaml-d8bb46c-flambda|perf_grp1|re-23|md-2"
  - "ocaml-d8bb46c-fp-flambda|perf_grp1|re-23|md-2"

# =============================================================================
# Comparisons — declared pairs the visualisation should render.
#
# Two modes:
#   pairwise (default): zip a and b. A scalar on either side is broadcast to
#                       the opposite side's length. Lengths must match after
#                       broadcasting.
#   cartesian:          every (x in a) × (y in b) cross.
#
# When this section is omitted, the notebook falls back to "BASELINE vs every
# other variant" using the BASELINE constant set at the top of Notebook A.
# =============================================================================
comparisons:
  # Flag-effect within each version: how does each compiler flag combo
  # change wall-time / RSS / GC behaviour relative to the version's
  # vanilla baseline?
  - label: "5.4.1 flag effects"
    a: ocaml-5.4.1
    b: [ocaml-5.4.1-fp, ocaml-5.4.1-flambda, ocaml-5.4.1-fp-flambda]
  - label: "d8bb46c flag effects"
    a: ocaml-d8bb46c
    b: [ocaml-d8bb46c-fp, ocaml-d8bb46c-flambda, ocaml-d8bb46c-fp-flambda]

  # Version effect, holding the flag combo constant: did the version change
  # itself regress us, separately from any flag interactions?
  - label: "version effect (by flag combo)"
    a: [ocaml-5.4.1, ocaml-5.4.1-fp, ocaml-5.4.1-flambda, ocaml-5.4.1-fp-flambda]
    b: [ocaml-d8bb46c, ocaml-d8bb46c-fp, ocaml-d8bb46c-flambda, ocaml-d8bb46c-fp-flambda]
