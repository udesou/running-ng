# =============================================================================
# Smoke test — OCaml 5.4.1 + d8bb46c (5.5-beta) baselines
# =============================================================================
# Two runtimes (no flags), full benchmark set, one invocation.
# Used as a fresh-rebuild verification after `make clean` in macro-benches —
# confirms compiler builds + every benchmark's build+run path on both
# versions before kicking off the full 8-variant fp×flambda matrix.
#
# Expected total cells: 27 benchmarks × 2 runtimes = 54.
#
# Usage:
#   cd ~/macro-benches && make clean      # nuke _build-* + wrappers
#   RUNNING_MACRO_BENCH_DIR=~/macro-benches \
#   CONFIG_FILE=src/running/config/smoke_5.4_5.5_baselines.yml \
#   LOG_DIR=/tmp/smoke_5.4_5.5_baselines_logs \
#     bash run_ocaml_bench_gc_sweep.sh
# =============================================================================

includes:
  - "./macrobenchmarks_base.yml"

overrides:
  invocations: 1

runtimes:
  ocaml-5.4.1:
    type: OCaml
    version: "5.4.1"
  ocaml-d8bb46c:
    type: OCaml
    commit: "d8bb46c39bf5fcafb513a8ba18e667d3f8c2600a"

configs:
  - "ocaml-5.4.1|perf_grp1|re-25|md-2"
  - "ocaml-d8bb46c|perf_grp1|re-25|md-2"
