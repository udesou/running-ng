# =============================================================================
# Configs & Sweep — 5 runtimes × 49 (s,o) combinations = 245 total
# =============================================================================
# Base configs (one per runtime, with appropriate gc_verbose variant).
# The sweep appends s-{val}|o-{val} to each, generating 49 variants per base.

configs:
  - "ocaml-4.14.3|perf_grp1|time_stats|gc_verbose"
  - "ocaml-5.1.0|perf_grp1|time_stats|gc_verbose"
  - "ocaml-5.4.1|perf_grp1|time_stats|gc_verbose"
  - "ocaml-trunk|perf_grp1|time_stats|gc_verbose"
  - "oxcaml-trunk|perf_grp1|time_stats|gc_verbose_oxcaml|re-23|md-9"

config_sweep:
  s: [32768, 65536, 131072, 262144, 524288, 1048576, 2097152]
  o: [40, 60, 80, 100, 120, 150, 200]
