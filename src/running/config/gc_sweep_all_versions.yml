# =============================================================================
# Modifiers
# =============================================================================
modifiers:
  time_stats:
    type: Wrapper
    val: "/usr/bin/time -f \"%Uuser %Ssystem %eelapsed %PCPU (%Xavgtext+%Davgdata %Mmaxresident)k\""
  gc_verbose:
    type: OCamlRunParam
    val: "v=0x400"
  gc_verbose_oxcaml:
    type: OCamlRunParam
    val: "v=0x1000"
  s:
    type: OCamlRunParam
    val: "s={0}"
  o:
    type: OCamlRunParam
    val: "o={0}"
  # --- perf + olly attach (PerfAndOllyAttach) ---
  # Uses SIGSTOP/SIGCONT to freeze the child so both perf stat and olly
  # gc-stats can attach before any code runs.  Requires `perf` and `olly`
  # on PATH.
  #
  # Run one group at a time to avoid PMU multiplexing.  Each group fits
  # within ~4 programmable + 3 fixed hardware counters.
  #
  # Group 1: baseline IPC (fixed counters + software events)
  perf_grp1:
    type: PerfAndOllyAttach
    val: "task-clock,page-faults,cycles,instructions"
  # Group 2: pipeline stalls
  perf_grp2:
    type: PerfAndOllyAttach
    val: "task-clock,cycles,stalled-cycles-frontend,stalled-cycles-backend"
  # Group 3: cache / TLB hierarchy
  perf_grp3:
    type: PerfAndOllyAttach
    val: "task-clock,cycles,cache-misses,LLC-load-misses,dTLB-load-misses,iTLB-load-misses"
  # Runtime events ring buffer size (log2 words per domain).
  # Default is 16 (64K words).  Increase to reduce "Lost N events" from olly
  # when running GC-heavy multicore benchmarks.
  # NOTE: total events file size = max_domains * 2^e * 8 bytes.
  # With default max_domains=128, e=21 gives a 2GB file which will fail
  # ftruncate.  Pair with max_domains (d=) to keep it reasonable.
  re:
    type: OCamlRunParam
    val: "e={0}"
  # Max domains (OCAMLRUNPARAM d=).  Default is 128, but setting it to
  # the actual number of domains used (main + spawned) reduces the runtime
  # events file size proportionally.
  md:
    type: OCamlRunParam
    val: "d={0}"


