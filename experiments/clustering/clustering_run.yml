# =============================================================================
# Clustering experiment — single-runtime macro-benchmark run
# =============================================================================
# macro_base.yml inlined so this file is fully self-contained.
# Runtime: ocaml-5.4.1 only.
#
# Usage (from repo root):
#   RUNNING_MACRO_BENCH_DIR=/home/curche/git/macro-benches \
#   LOG_DIR=experiments/clustering/logs \
#   CONFIG_FILE=experiments/clustering/clustering_run.yml \
#     bash run_ocaml_bench_gc_sweep.sh
# =============================================================================

invocations: 3
remote_host: null
compress_logs: false
minheap_multiplier: 1.0
heap_range: 6
spread_factor: 1

# =============================================================================
# Suites — monorepo builds (OCamlBenchmarkSuite)
# =============================================================================
suites:
  macro-menhir-monorepo:
    type: OCamlBenchmarkSuite
    timeout: 600
    programs:
      menhir_ocamly:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir"
        build_script: "menhir.build.sh"
        # `--canonical` builds the full canonical LR(1) automaton (vs the
        # smaller LALR tables in `--lalr`). For the OCaml grammar this is
        # ~80× more work — brings wall time from 0.4s to ~33s on this
        # machine and uses ~2.7 GB RSS for the state table. The other two
        # menhir benchmarks (sql_parser, sysver) use different algorithms
        # already; switching ocamly to canonical gives the suite three
        # distinct menhir workloads.
        args: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir/ocaml.mly --list-errors --no-stdlib --canonical"
      menhir_sql_parser:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir"
        build_script: "menhir.build.sh"
        args: "-v -t ${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir/keywords.mly ${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir/sql-parser.mly --base sql-parser"
      menhir_sysver:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir"
        build_script: "menhir.build.sh"
        args: "-v --table ${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir/sysver.mly"

  macro-cpdf-monorepo:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      cpdf_merge:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf"
        build_script: "cpdf.build.sh"
        args: "-merge ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig -o /dev/null"
      cpdf_blacktext:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf"
        build_script: "cpdf.build.sh"
        args: "-blacktext ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig -o /dev/null"
      cpdf_scale:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf"
        build_script: "cpdf.build.sh"
        args: "scale-to-fit a4landscape -twoup ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig -o /dev/null"
      cpdf_squeeze:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf"
        build_script: "cpdf.build.sh"
        args: "-squeeze ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig -o /dev/null"

  macro-alt-ergo-monorepo:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      alt_ergo_fill:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo"
        build_script: "alt-ergo.build.sh"
        # fill_x100.why is generated at build time by alt-ergo.build.sh —
        # it replicates the original `fill_assert_39` goal 100 times so
        # alt-ergo solves each independently. Scales work linearly: ~14s
        # wall on this machine, vs 0.18s for the single-goal fill.why.
        # See ~/macro-benches/README.md §"Iteration counts".
        args: "--input native ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/fill_x100.why"
      alt_ergo_yyll:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo"
        build_script: "alt-ergo.build.sh"
        args: "--input native ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/yyll.why"
      alt_ergo_unsat_smt2:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo"
        build_script: "alt-ergo.build.sh"
        args: "--timelimit 15 ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/unsat.smt2"

  # Frama-C EVA (value/abstract-interpretation).  Static-linked kernel+EVA
  # (vendored 32.1); the build script's wrapper sets DUNE_DIR_LOCATIONS and
  # -no-autoload-plugins.  The wrapper selects the workload by its single
  # arg: "t" (zlib t.c) or "sqlite" (258k-line SQLite amalgamation — the
  # ocaml#11733 weak/ephemeron hash-consing reproducer, ~460MB RSS).
  macro-frama-c-monorepo:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      frama_c_eva_t:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/frama-c"
        build_script: "frama-c.build.sh"
        args: "t"
      frama_c_eva_sqlite:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/frama-c"
        build_script: "frama-c.build.sh"
        args: "sqlite"

  macro-goblint-monorepo:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      goblint:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/goblint"
        build_script: "goblint.build.sh"
        args: ""

  macro-coq-monorepo:
    type: OCamlBenchmarkSuite
    timeout: 600
    programs:
      coqc_corelib_stress:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq"
        build_script: "coq.build.sh"
        args: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq/coq_corelib_stress.v"

  macro-devkit:
    type: OCamlBenchmarkSuite
    timeout: 600
    programs:
      devkit_htmlstream:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ahrefs-devkit"
        build_script: "ahrefs-devkit.build.sh"
        args: ""
      devkit_stre:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ahrefs-devkit"
        build_script: "ahrefs-devkit.build.sh"
        # arg = in-process loop count, read by stre_bench.ml as Sys.argv.(1).
        # Each iteration is ~0.47s on this machine (full 8 sub-benches),
        # so arg=30 → ~14s wall.
        # See ~/macro-benches/README.md §"Iteration counts".
        args: "30"
      devkit_network:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ahrefs-devkit"
        build_script: "ahrefs-devkit.build.sh"
        # arg = in-process loop count. Each iteration ~4.3s, so arg=4 → ~17s.
        args: "4"
      devkit_gzip:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ahrefs-devkit"
        build_script: "ahrefs-devkit.build.sh"
        # arg = in-process loop count. Each iteration ~2.7s, so arg=5 → ~14s.
        # gc_overhead ≈ 1% — gzip is compute-bound, GC isn't the story here.
        args: "5"

  macro-irmin:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      irmin_mem_rw:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/irmin"
        build_script: "irmin.build.sh"
        args: "3000 10000 80 20000"

  macro-ocamlformat:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      ocamlformat_rocq:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlformat"
        build_script: "ocamlformat.build.sh"
        args: "--impl ${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlformat/workload_5x.ml -o /dev/null"

  macro-decompress:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      test_decompress:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/decompress"
        build_script: "decompress.build.sh"
        args: "64 524288"

  # Eio: OCaml 5 effect-based concurrency (requires OCaml >= 5.2)
  macro-eio:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      eio_fiber_stream:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/eio"
        build_script: "eio.build.sh"
        args: ""

  macro-sedlex:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      sedlex_tokenize:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/sedlex"
        build_script: "sedlex.build.sh"
        args: "700000"

  macro-yojson:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      ydump_repeat:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/yojson"
        build_script: "yojson.build.sh"
        args: "1000 ${RUNNING_MACRO_BENCH_DIR}/benchmarks/yojson/sample.json"

  macro-zarith:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      zarith_pi:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/zarith"
        build_script: "zarith.build.sh"
        args: "15000"

  macro-owl:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      owl_gc:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/owl"
        build_script: "owl.build.sh"
        # arg = in-process loop count, read by owl_gc.ml as Sys.argv.(1).
        # Each iteration is ~2.6s on this machine (full O(n²) GW pass),
        # so arg=6 → ~16s wall.
        # Requires runtime_events ring `re-25` (32 MB) or larger in the
        # config string — `re-23` (8 MB default) overflows on 5+
        # iterations and olly reports lost events plus a corrupted
        # wall_time.
        # See ~/macro-benches/README.md §"Iteration counts".
        args: "6"

  # ocamlc-self-compile: invoke the variant's own ocamlc on a generated
  # ~400k-line OCaml workload (concatenated JSOO benchmark sources × 30
  # replicas, each in a unique module). Single observable OCaml process —
  # the runtime under test executes ocamlc's code, exercising the
  # ephemeron tables in typing/btype.ml, Hashtbl, AST allocation, and
  # Marshal (.cmi writing). Bytecode (`ocamlc`) chosen over native
  # (`ocamlopt`) so the workload is uniform across flambda/non-flambda
  # variants — cross-variant deltas reflect runtime perf only.
  # See ~/macro-benches/README.md §"Benchmark characteristics".
  macro-ocamlc-self-compile:
    type: OCamlBenchmarkSuite
    timeout: 300
    programs:
      ocamlc_self_compile:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlc-self-compile"
        build_script: "ocamlc-self-compile.build.sh"
        args: ""

  # liquidsoap-lang: parse + typecheck liquidsoap scripts (DSL compiler).
  macro-liquidsoap-lang:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      liq_parse_typecheck:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/liquidsoap-lang"
        build_script: "liquidsoap-lang.build.sh"
        args: "50000"

  # merlin: in-process driver replicating merlin's cram bench (the 7
  # canonical IDE queries against a 51 319-line file). Spawns a typer
  # domain alongside the main domain — the merlin-domains branch's
  # parallel-typer feature using OCaml 5 domains and effects. Same
  # Domain.spawn dance ocamlmerlin_server does in single mode, so we
  # exercise the production code path. Two domains exactly: main +
  # typer.
  # arg = in-process loop count, read by merlin_bench.ml as
  # Sys.argv.(1). Each iteration runs all 7 queries once. arg=4 → ~16s
  # wall on obelisk after the first iteration's typer warmup.
  #
  # Requires OCaml 5.5+. The merlin-domains branch ships its own copy
  # of OCaml's typer (src/ocaml/typing/) targeted at OCaml_5_5_0; on
  # 5.4.1 and earlier the vendored typer trips an internal assertion
  # because data-structure invariants differ across compiler
  # versions. For multi-version sweeps, the user should override
  # `benchmarks.macro-merlin: []` when 5.4 / earlier is in the matrix
  # to avoid known-failing cells.
  macro-merlin:
    type: OCamlBenchmarkSuite
    timeout: 180
    programs:
      merlin_bench:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/merlin"
        build_script: "merlin.build.sh"
        args: "4"

  # js_of_ocaml: compile the runtime's ocamlc.byte (~3.5 MB of bytecode,
  # version-matched per runtime by construction) to JavaScript. Exercises
  # jsoo's bytecode parser, SSA / IR pipeline, optimisation passes, and
  # JS output. Wall ~8-10s per invocation.
  #
  # Vendored from the `ocaml-5.6` branch of jsoo (PR ocsigen/js_of_ocaml#2227)
  # rather than the 6.2.0 release, because 6.2.0 hard-rejects OCaml >= 5.5.
  # The branch supports 4.13 ≤ x < 5.7 — covers all our matrix runtimes.
  # Requires Cmdliner 2.0+ (vendored via setup-monorepo.sh as v2.1.0).
  macro-jsoo:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      jsoo:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/js_of_ocaml"
        build_script: "jsoo.build.sh"
        args: ""

  # liq-video-frames: synthetic reproduction of the GC-pacer / heap-growth
  # pattern from ocaml/ocaml#13123 + #14533 (custom_major_ratio regression).
  # Allocates three Bigarrays per iteration (Y/U/V planes at 1280×720 YUV420,
  # ~1.32 MiB total) matching mm/Image.YUV420.create. Persistent OCaml-heap
  # "deadweight" simulates liquidsoap's loaded stdlib + script graph
  # (LIQ_DW_MB, default 100). Headline metrics are max_rss_kb and
  # minor:major collection counts; wall_time captures the GC-pacer effect.
  #
  # POOL=1 + TOUCH=full: AVFrame-style refcounted-pool semantics — the
  # canonical reproduction of toots' ocaml#14533 free-lunch shape. Under
  # M=250 this variant shows the dramatic CPU drop with no RSS growth.
  # See ~/macro-benches/benchmarks/liq-video-frames/liq_video_frames.ml
  # for the full env-knob catalogue (LIQ_POOL, LIQ_CHURN, LIQ_PACE_FPS).
  # arg = number of iterations; arg=30000 ≈ 4–20s wall.
  macro-liq-video-frames:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      liq_video_frames_pool:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/liq-video-frames"
        build_script: "liq-video-frames.build.sh"
        args: "30000"

  # pplacer: phylogenetic placement (bioinformatics).
  macro-pplacer:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
      pplacer_testsuite:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/pplacer"
        build_script: "pplacer.build.sh"
        # arg = in-process loop count, passed to tests.exe as
        # PPLACER_TEST_LOOP. The whole suite runs in one OCaml process so
        # olly observes everything. Each iteration is ~3.5s on this machine,
        # so arg ≈ N × 3.5s wall. arg=5 → ~17s (well in envelope on slower
        # hardware; comfortably above noise floor on faster CI machines).
        # See ~/macro-benches/README.md §"Iteration counts" for the pattern.
        args: "5"

  # lavyek: multicore key-value store on Eio + kcas + io_uring (single
  # OCaml process, multi-domain).  DaCapo-style fixed-work driver; the
  # 4-domain cell is the calibrated target (~8s wall on monolith).  All
  # 4 cells share the same nb=10_000_000 op budget so wall times reflect
  # parallel scaling rather than work-budget differences.
  #
  # *** REQUIRED CONFIG-STRING MODIFIERS ***
  # Any config that enables this suite MUST add `|re_par-22|md_par-8|pin_lavyek`
  # to its config-string entries. Without these, lavyek runs with olly's
  # default 8 MB per-domain ring, which overflows on the 10M-op multi-domain
  # workload and silently drops runtime_events.
  macro-lavyek-monorepo:
    type: OCamlBenchmarkSuite
    timeout: 120
    required_modifiers: [re_par, md_par, pin_lavyek]
    programs:
      lavyek_kv_1d:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek"
        build_script: "lavyek.build.sh"
        args: "1 100 10000000 ${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek/wal/lavyek_wal_1d"
      lavyek_kv_2d:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek"
        build_script: "lavyek.build.sh"
        args: "2 100 10000000 ${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek/wal/lavyek_wal_2d"
      lavyek_kv_4d:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek"
        build_script: "lavyek.build.sh"
        args: "4 100 10000000 ${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek/wal/lavyek_wal_4d"
      lavyek_kv_8d:
        path: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek"
        build_script: "lavyek.build.sh"
        args: "8 100 10000000 ${RUNNING_MACRO_BENCH_DIR}/benchmarks/lavyek/wal/lavyek_wal_8d"

# =============================================================================
# Modifiers
# =============================================================================
modifiers:
  time_stats:
    type: Wrapper
    val: "/usr/bin/time -f \"%Uuser %Ssystem %eelapsed %PCPU (%Xavgtext+%Davgdata %Mmaxresident)k\""
  gc_verbose:
    type: OCamlRunParam
    val: "v=0x400"
  # Runtime events ring buffer size (log2 words per domain).  Bigger ring
  # reduces "Lost N events" from olly on GC-heavy workloads.
  #
  # Two separate (re, md) pairs — sequential macros vs the parallel
  # lavyek suite — because md must be >= the actual domain count and the
  # events file size = md * 2^e * 8 bytes:
  #   - sequential: re-25|md-2  -> 512 MB file, 256 MB/domain ring
  #     (owl needs >= re-25 — see owl_gc comment; re-23 already overflows)
  #   - lavyek:     re-22|md-8  -> 256 MB file,  32 MB/domain ring
  #     (md-8|re-25 would be 2 GB, right at the ftruncate boundary)
  # Routing is via `excludes`: re/md skip lavyek; re_par/md_par skip
  # everything else.
  re:
    type: OCamlRunParam
    val: "e={0}"
    excludes: &lavyek_only_excludes
      macro-lavyek-monorepo:
        - lavyek_kv_1d
        - lavyek_kv_2d
        - lavyek_kv_4d
        - lavyek_kv_8d
  md:
    type: OCamlRunParam
    val: "d={0}"
    excludes: *lavyek_only_excludes
  # Parallel-suite counterparts: only applied to lavyek programs.
  re_par:
    type: OCamlRunParam
    val: "e={0}"
    excludes: &non_lavyek_excludes
      macro-menhir-monorepo: [menhir_ocamly, menhir_sql_parser, menhir_sysver]
      macro-cpdf-monorepo: [cpdf_merge, cpdf_blacktext, cpdf_scale, cpdf_squeeze]
      macro-alt-ergo-monorepo: [alt_ergo_fill, alt_ergo_yyll, alt_ergo_unsat_smt2]
      macro-coq-monorepo: [coqc_corelib_stress]
      macro-devkit: [devkit_htmlstream, devkit_stre, devkit_network, devkit_gzip]
      macro-irmin: [irmin_mem_rw]
      macro-ocamlformat: [ocamlformat_rocq]
      macro-decompress: [test_decompress]
      macro-eio: [eio_fiber_stream]
      macro-sedlex: [sedlex_tokenize]
      macro-yojson: [ydump_repeat]
      macro-zarith: [zarith_pi]
      macro-owl: [owl_gc]
      macro-ocamlc-self-compile: [ocamlc_self_compile]
      macro-liquidsoap-lang: [liq_parse_typecheck]
      macro-merlin: [merlin_bench]
      macro-jsoo: [jsoo]
      macro-liq-video-frames: [liq_video_frames_pool]
      macro-pplacer: [pplacer_testsuite]
  md_par:
    type: OCamlRunParam
    val: "d={0}"
    excludes: *non_lavyek_excludes
  # Process-level CPU mask for the lavyek suite — belt-and-braces on top
  # of the per-domain pinning that lavyek_bench.ml does internally via
  # ocaml-processor. Assumption: cores 0-15 are physical (smt=0).
  pin_lavyek:
    type: Wrapper
    val: "taskset -c 0-15"
    excludes: *non_lavyek_excludes
  perf_grp1:
    type: PerfAndOllyAttach
    val: "task-clock,page-faults,cycles,instructions"
  perf_grp2:
    type: PerfAndOllyAttach
    val: "task-clock,cycles,stalled-cycles-frontend,stalled-cycles-backend"
  perf_grp3:
    type: PerfAndOllyAttach
    val: "task-clock,cycles,cache-misses,LLC-load-misses,dTLB-load-misses,iTLB-load-misses"

# =============================================================================
# Benchmarks — all programs enabled
# =============================================================================
benchmarks:
  macro-menhir-monorepo:
    - menhir_ocamly
    - menhir_sql_parser
    - menhir_sysver

  macro-cpdf-monorepo:
    - cpdf_merge
    - cpdf_blacktext
    - cpdf_scale
    - cpdf_squeeze

  macro-alt-ergo-monorepo:
    - alt_ergo_fill
    - alt_ergo_yyll
    - alt_ergo_unsat_smt2

  macro-frama-c-monorepo:
    - frama_c_eva_t
    - frama_c_eva_sqlite

  macro-goblint-monorepo:
    - goblint

  macro-coq-monorepo:
    - coqc_corelib_stress

  macro-devkit:
    - devkit_htmlstream
    - devkit_stre
    - devkit_network
    - devkit_gzip

  macro-irmin:
    - irmin_mem_rw

  macro-ocamlformat:
    - ocamlformat_rocq

  macro-decompress:
    - test_decompress

  macro-eio:
    - eio_fiber_stream

  macro-sedlex:
    - sedlex_tokenize

  macro-yojson:
    - ydump_repeat

  macro-zarith:
    - zarith_pi

  macro-owl:
    - owl_gc

  macro-ocamlc-self-compile:
    - ocamlc_self_compile

  macro-liquidsoap-lang:
    - liq_parse_typecheck

  # macro-merlin: DISABLED pending upstream fix to a race in
  # merlin-domains' typer-domain handoff. The vendored typer hits an
  # `Invalid -> assert false` in `Types.rev_log` non-deterministically
  # at N>=2 iterations of the cram-bench workload. Re-enable by
  # uncommenting the `- merlin_bench` line below once the race is
  # fixed in the merlin-domains branch.
  # Also requires OCaml 5.5+ — will fail on 5.4.1.
  macro-merlin: []
    # - merlin_bench

  macro-jsoo:
    - jsoo

  macro-liq-video-frames:
    - liq_video_frames_pool

  macro-pplacer:
    - pplacer_testsuite

  # macro-lavyek-monorepo: DISABLED — the lavyek library lives in a PRIVATE
  # repo (github.com/tarides/lavyek), so builds without access to it cannot
  # vendor the suite. Re-enable by uncommenting the four cells below once
  # you have lavyek access. NB: when re-enabled, config-strings must add
  # |re_par-22|md_par-8|pin_lavyek (see modifiers above).
  macro-lavyek-monorepo: []
    # - lavyek_kv_1d
    # - lavyek_kv_2d
    # - lavyek_kv_4d
    # - lavyek_kv_8d

# =============================================================================
# Runtimes — single runtime for clustering baseline
# =============================================================================
runtimes:
  ocaml-5.4.1:
    type: OCaml
    version: "5.4.1"

# =============================================================================
# Configs
# perf_grp1        — hardware counters: task-clock, page-faults, cycles, instructions
# re_par-22|md_par-8 — runtime_events ring: 32 MB/domain (lavyek routing; see
#                      modifiers above — re_par/md_par are no-ops for sequential
#                      benchmarks because they exclude every non-lavyek program)
# pin_lavyek       — no-op here (lavyek disabled); kept so the config string
#                    stays valid if lavyek is re-enabled
# =============================================================================
configs:
  - "ocaml-5.4.1|perf_grp1|re_par-22|md_par-8|pin_lavyek"
