benchmarks:
  ocaml-binarytrees:
  - binarytrees
configs:
- ocaml-local|time_stats|domains-1|s-262144|o-80|i-64|a-2
- ocaml-local|time_stats|domains-4|s-262144|o-80|i-64|a-2
- ocaml-local|time_stats|domains-1|s-524288|o-120|i-128|a-2
- ocaml-local|time_stats|domains-4|s-524288|o-120|i-128|a-2
heap_range: 6
invocations: 5
minheap_multiplier: 1.0
modifiers:
  a:
    type: OCamlRunParam
    val: a={0}
  c2:
    excludes:
      dacapochopin-29a657f:
      - tradebeans
      - tradesoap
      dacapochopin-f480064:
      - tradebeans
      - tradesoap
    type: JVMArg
    val: -XX:-TieredCompilation -Xcomp
  cms:
    type: JVMArg
    val: -XX:-UseCompressedOops -XX:+UseConcMarkSweepGC -XX:TLABSize=32K -XX:-ResizeTLAB
  domains:
    type: OCamlArg
    val: -domain-count {0}
  epsilon:
    type: JVMArg
    val: -XX:-UseCompressedOops -XX:+UnlockExperimentalVMOptions -XX:+UseEpsilonGC
      -XX:-EpsilonElasticTLAB -XX:TLABSize=32K -XX:-ResizeTLAB
  g1:
    type: JVMArg
    val: -XX:-UseCompressedOops -XX:+UseG1GC
  hotspot_gc:
    type: JVMArg
    val: -XX:-UseCompressedOops -XX:+UnlockExperimentalVMOptions -XX:+Use{0}GC
  i:
    type: OCamlRunParam
    val: i={0}
  ix:
    type: EnvVar
    val: Immix
    var: MMTK_PLAN
  mmtk_gc:
    type: EnvVar
    val: '{0}'
    var: MMTK_PLAN
  ms:
    type: JVMArg
    val: -XX:MetaspaceSize=500M -XX:+DisableExplicitGC
  o:
    type: OCamlRunParam
    val: o={0}
  s:
    type: OCamlRunParam
    val: s={0}
  sgc:
    type: JVMArg
    val: -XX:+UseSerialGC
  ss:
    type: EnvVar
    val: SemiSpace
    var: MMTK_PLAN
  time_stats:
    type: Wrapper
    val: /usr/bin/time -f "%Uuser %Ssystem %eelapsed %PCPU (%Xavgtext+%Davgdata %Mmaxresident)k"
  tph:
    type: JVMArg
    val: -XX:+UseThirdPartyHeap
remote_host: null
runtimes:
  ocaml:
    executable: /usr/bin/ocaml
    type: OCaml
  ocaml-local:
    executable: $HOME/Documents/Repositories/ocaml/ocaml
    type: OCaml
  temurin-11:
    home: /usr/lib/jvm/temurin-11-jdk-amd64
    release: 11
    type: OpenJDK
  temurin-17:
    home: /usr/lib/jvm/temurin-17-jdk-amd64
    release: 17
    type: OpenJDK
  temurin-8:
